---
version: '3'
includes:
#  gatekeeper: gatekeeper.yml
  gatekeeper: pet.yml

#  pinniped-supervisor: pinniped-supervisor.yml
  pinniped-supervisor: pet.yml

#  pinniped-concierge: pinniped-concierge.yml
  pinniped-concierge: pet.yml

#  airflow: apache-airflow.yml
  airflow: pet.yml

#  retool: retool.yml
  retool: pet.yml

  hatchet: hatchet.yml
#  hatchet: pet.yml

tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: pinniped-supervisor:install
      - task: pinniped-concierge:install
      - task: airflow:upgrade
      - task: retool:upgrade
      - task: hatchet:upgrade
  delete:
    cmds:
      - task: hatchet:delete
      - task: retool:delete
      - task: airflow:delete
      - task: pinniped-concierge:delete
      - task: pinniped-supervisor:delete
  check:
    cmds:
      - task: airflow:check
      - task: retool:check
      - task: hatchet:check
