---
version: '3'
vars:
  pinniped_supervisor: pet
  pinniped_concierge: pet
  airflow: pet
  retool: pet
  hatchet: hatchet
  temporal: temporal
  gitlab: pet
includes:
  pinniped-supervisor:
    taskfile: '{{ .pinniped_supervisor }}.yml'

  pinniped-concierge:
    taskfile: '{{ .pinniped_concierge }}.yml'

  airflow:
    taskfile: '{{ .airflow }}.yml'

  retool:
    taskfile: '{{ .retool }}.yml'

  hatchet:
    taskfile: '{{ .hatchet }}.yml'

  temporal:
    taskfile: '{{ .temporal }}.yml'

  gitlab:
    taskfile: '{{ .gitlab }}.yml'

tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: pinniped-supervisor:install
      - task: pinniped-concierge:install
      - task: airflow:upgrade
      - task: retool:upgrade
      - task: hatchet:upgrade
      - task: temporal:upgrade
      - task: gitlab:upgrade
  delete:
    cmds:
      - task: gitlab:delete
      - task: temporal:delete
      - task: hatchet:delete
      - task: retool:delete
      - task: airflow:delete
      - task: pinniped-concierge:delete
      - task: pinniped-supervisor:delete
  check:
    cmds:
      - task: airflow:check
      - task: retool:check
      - task: hatchet:check
      - task: temporal:check
      - task: gitlab:check
