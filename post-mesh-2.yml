---
version: '3'
includes:
#  gatekeeper: gatekeeper.yml
  gatekeeper: pet.yml

#  pinniped-supervisor: pinniped-supervisor.yml
  pinniped-supervisor: pet.yml

#  pinniped-concierge: pinniped-concierge.yml
  pinniped-concierge: pet.yml

#  gitea: gitea.yml
  gitea: pet.yml

#  gitlab: gitlab.yml
  gitlab: pet.yml

#  harbor: harbor.yml
  harbor: pet.yml

#  artifacthub: artifacthub.yml
  artifacthub: pet.yml

#  opencost: opencost.yml
  opencost: pet.yml

  airflow: apache-airflow.yml
#  airflow: pet.yml

tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: gatekeeper:upgrade
      - task: pinniped-supervisor:install
      - task: pinniped-concierge:install
      - task: gitea:upgrade
      - task: gitlab:upgrade
      - task: harbor:upgrade
      - task: artifacthub:upgrade
      - task: opencost:upgrade
      - task: airflow:upgrade
  delete:
    cmds:
      - task: airflow:delete
      - task: opencost:delete
      - task: artifacthub:delete
      - task: harbor:delete
      - task: gitlab:delete
      - task: gitea:delete
      - task: pinniped-concierge:delete
      - task: pinniped-supervisor:delete
      - task: gatekeeper:delete
  check:
    cmds:
      - task: gatekeeper:check
      - task: gitea:check
      - task: gitlab:check
      - task: harbor:check
      - task: artifacthub:check
      - task: opencost:check
      - task: airflow:check
