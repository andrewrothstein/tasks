---
version: '3'
includes:
#  awx: awx-operator.yml
  awx: pet.yml

#  gatekeeper: gatekeeper.yml
  gatekeeper: pet.yml

#  pinniped-supervisor: pinniped-supervisor.yml
  pinniped-supervisor: pet.yml

#  pinniped-concierge: pinniped-concierge.yml
  pinniped-concierge: pet.yml

#  gitea: gitea.yml
  gitea: pet.yml

#  gitlab: gitlab.yml
  gitlab: pet.yml

tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: gatekeeper:upgrade
      - task: pinniped-supervisor:install
      - task: pinniped-concierge:install
      - task: awx:upgrade
      - task: gitea:upgrade
      - task: gitlab:upgrade
  delete:
    cmds:
      - task: gitlab:delete
      - task: gitea:delete
      - task: awx:delete
      - task: pinniped-concierge:delete
      - task: pinniped-supervisor:delete
      - task: gatekeeper:delete
  check:
    cmds:
      - task: gatekeeper:check
      - task: awx:check
      - task: gitea:check
      - task: gitlab:check
