---
version: '3'
vars:
  SOLR_VER: 0.8.1
includes:
  repo: solr-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: solr-operator
#      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: apache-solr
      chart: solr-operator
      chart_ver: '{{ .SOLR_VER }}'
      namespace: solr-operator
      name: solr-operator
  cluster:
    taskfile: helm.yml
    vars:
      chart_repo_name: apache-solr
      chart: solr
      chart_ver: '{{ .SOLR_VER }}'
      namespace: solr-clusters
      create_namespace: 'true'
      name: solr-cluster
tasks:
  default:
    deps:
      - upgrade
  _crds:
    internal: true
    vars:
      verb: '{{ .verb | default "apply" }}'
    cmds:
      - |
        wget -q "https://solr.apache.org/operator/downloads/crds/v{{ .SOLR_VER }}/all.yaml" -O - | \
          yq eval-all 'del(.. | select(has("description")).description)' | \
          kubectl {{ .verb }} -f -
  crds-upgrade:
    cmds:
      - task: _crds
        vars:
          verb: apply
  crds-delete:
    cmds:
      - task: _crds
        vars:
          verb: delete
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: crds-upgrade
      - task: helm:upgrade
  test:
    cmds:
      - task: cluster:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
      - task: crds-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
