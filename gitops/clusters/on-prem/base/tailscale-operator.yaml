---
apiVersion: v1
kind: Secret
metadata:
  name: operator-oauth
  namespace: tailscale
stringData:
  client_id: "${TAILSCALE_OPERATOR_CLIENT_ID}"
  client_secret: "${TAILSCALE_OPERATOR_CLIENT_SECRET}"
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 5m
  chart:
    spec:
      chart: tailscale-operator
      version: 1.78.3
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
  install:
    createNamespace: true
  values:
    oauth:
      clientId: "${TAILSCALE_OPERATOR_CLIENT_ID}"
      clientSecret: "${TAILSCALE_OPERATOR_CLIENT_SECRET}"
    operatorConfig:
      hostname: "ts-operator"
