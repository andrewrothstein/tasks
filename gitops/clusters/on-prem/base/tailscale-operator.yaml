---
# Note: Create the tailscale-oauth secret manually before applying:
# kubectl create namespace tailscale
# kubectl create secret generic tailscale-oauth -n tailscale \
#   --from-literal=client_id=$TAILSCALE_OPERATOR_CLIENT_ID \
#   --from-literal=client_secret=$TAILSCALE_OPERATOR_CLIENT_SECRET
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 5m
  chart:
    spec:
      chart: tailscale-operator
      version: 1.78.3
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
  install:
    createNamespace: true
  valuesFrom:
    - kind: Secret
      name: tailscale-oauth
      valuesKey: client_id
      targetPath: oauth.clientId
    - kind: Secret
      name: tailscale-oauth
      valuesKey: client_secret
      targetPath: oauth.clientSecret
  values:
    operatorConfig:
      hostname: "ts-operator"
