---
version: '3'
includes:
  pulumi: pulumi.yml
tasks:
  ls:
    vars:
      # flags
      a: '{{ .a | default .all }}'
      h: '{{ .h | default .help }}'
      j: '{{ .j | default .json }}'
      o: '{{ .o | default .organization }}'
      p: '{{ .p | default .project }}'
      t: '{{ .t | default .tag }}'
    cmds:
      - task: pulumi
        vars:
          pulumi_command: stack ls
          pulumi_args: |-
            {{- if .a }} \
              -a
            {{- end }}
            {{- if .h }} \
              -h
            {{- end }}
            {{- if .j }} \
              -j
            {{- end }}
            {{- if .o }} \
              -o {{ .o | quote }}
            {{- end }}
            {{- if .p }} \
              -p {{ .p | quote }}
            {{- end }}
            {{- if .t }} \
              -t {{ .t | quote }}
            {{- end }}
  rm:
    vars:
      y: '{{ .y | default .yes }}'
    cmds:
      - task: pulumi
        vars:
          pulumi_command: stack rm
          pulumi_args: |-
            {{- if eq "true" .y }} \
              --yes
            {{- end }}
  init:
    vars:
#      s: '{{ .s | default .stack_name }}'
#      org_name: '{{ .org_name }}'
      secrets_provider: '{{ .secrets_provider }}'
    cmds:
      - task: pulumi
        vars:
          pulumi_command: stack init
          pulumi_args: |-
            {{- if .secrets_provider }} \
              --secrets-provider {{ .secrets_provider | quote }}
            {{- end }}
          C: '{{ .C }}'
