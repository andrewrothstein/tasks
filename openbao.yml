---
version: '3'
includes:
  repo: openbao-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: openbao
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    internal: true
    vars:
      namespace: openbao
      name: openbao
      chart_repo_name: openbao
      chart: openbao
      chart_ver: 0.27.2
      force_conflicts: 'true'
      helm_args: >-
        -f openbao-values.yml
        --set server.dev.devRootToken="${VAULT_ROOT_TOKEN}"
  ingress:
    taskfile: tailscale-ingress.yml
    vars:
      namespace: openbao
      name: tailscale-ingress
      helm_args: -f openbao-tailscale-ingress-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: helm:upgrade
      - task: ingress:upgrade
  delete:
    cmds:
      - task: ingress:delete
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
