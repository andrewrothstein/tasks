---
apiVersion: containerservice.azure.upbound.io/v1beta1
kind: KubernetesCluster
metadata:
  name: cluster-1
spec:
  forProvider:
    resourceGroupName: ansible-aks-rg
    defaultNodePool:
      - name: default
        nodeCount: 1
        upgradeSettings:
          - maxSurge: 10%
        vmSize: Standard_D2_v2
    dnsPrefix: cluster-1
    identity:
      - type: SystemAssigned
    location: eastus2
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
