---
version: '3'
includes:
  repo: keda-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: keda
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    internal: true
    vars:
      namespace: keda
      name: keda
      chart_repo_name: kedacore
      chart: keda
      chart_ver: 2.17.2
      helm_args: -f keda-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
