---
version: '3'
includes:
  kind: kind+registry.yml
  cilium: cilium.yml
tasks:
  up:
    cmds:
      - task: kind:up
        vars:
          disableDefaultCNI: true
          kubeProxyMode: none
      - task: cilium:upgrade
  delete:
    cmds:
      - task: kind:delete
  destroy:
    cmds:
      - task: kind:destroy
  check:
    cmds:
      - task: cilium:check
      - task: kind:check
