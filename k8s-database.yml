---
version: '3'
includes:
  pxc-operator: pxc-operator.yml
#  pxc-operator: pet.yml

#  pxc-db: pxc-db.yml
  pxc-db: pet.yml

#  postgresql: bitnami-postgresql.yml
  postgresql: pet.yml

#  cass-operator: cass-operator.yml
  cass-operator: pet.yml

  cnpg: cnpg.yml
#  cnpg: pet.yml

#  redis: redis.yml
  redis: pet.yml

#  debezium-operator: debezium-operator.yml
  debezium-operator: pet.yml

#  yugabyte: yugabyte.yml
  yugabyte: pet.yml

#  questdb: questdb.yml
  questdb: pet.yml

  clickhouse: clickhouse.yml
#  clichouse-operator: pet.yml

#  cockroachdb: cockroackdb.yml
  cockroachdb: pet.yml

tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: pxc-operator:upgrade
      - task: pxc-db:upgrade
      - task: cass-operator:upgrade
      - task: postgresql:upgrade
      - task: cnpg:upgrade
      - task: redis:up
      - task: debezium-operator:upgrade
      - task: yugabyte:upgrade
      - task: questdb:upgrade
      - task: clickhouse:upgrade
      - task: cockroachdb:upgrade
  delete:
    cmds:
      - task: cockroachdb:delete
      - task: clickhouse:delete
      - task: questdb:delete
      - task: yugabyte:delete
      - task: debezium-operator:delete
      - task: redis:delete
      - task: cnpg:delete
      - task: cass-operator:delete
      - task: postgresql:delete
      - task: pxc-db:delete
      - task: pxc-operator:delete
  check:
    cmds:
      - task: pxc-operator:check
      - task: pxc-db:check
      - task: cass-operator:check
      - task: postgresql:check
      - task: cnpg:check
      - task: redis:check
      - task: yugabyte:check
      - task: questdb:check
      - task: clickhouse:check
      - task: cockroachdb:check
