---
version: '3'
vars:
  pxc_operator: pxc-operator
  pxc_db: pet
  postgresql: pet
  cass_operator: pet
  cnpg: cnpg
  redis: pet
  debezium_operator: pet
  yugabyte: pet
  questdb: pet
  clickhouse: clickhouse
  cockroachdb: pet
  neo4j: pet
includes:
  pxc-operator:
    taskfile: '{{ .pxc_operator }}.yml'

  pxc-db:
    taskfile: '{{ .pxc_db }}.yml'

  postgresql:
    taskfile: '{{ .postgresql }}.yml'

  cass-operator:
    taskfile: '{{ .cass_operator }}.yml'

  cnpg:
    taskfile: '{{ .cnpg }}.yml'

  redis:
    taskfile: '{{ .redis }}.yml'

  debezium-operator:
    taskfile: '{{ .debezium_operator }}.yml'

  yugabyte:
    taskfile: '{{ .yugabyte }}.yml'

  questdb:
    taskfile: '{{ .questdb }}.yml'

  clickhouse:
    taskfile: '{{ .clickhouse }}.yml'

  cockroachdb:
    taskfile: '{{ .cockroachdb }}.yml'

  neo4j:
    taskfile: '{{ .neo4j }}.yml'

tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: pxc-operator:upgrade
      - task: pxc-db:upgrade
      - task: cass-operator:upgrade
      - task: postgresql:upgrade
      - task: cnpg:upgrade
      - task: redis:up
      - task: debezium-operator:upgrade
      - task: yugabyte:upgrade
      - task: questdb:upgrade
      - task: clickhouse:upgrade
      - task: cockroachdb:upgrade
      - task: neo4j:upgrade
  delete:
    cmds:
      - task: neo4j:delete
      - task: cockroachdb:delete
      - task: clickhouse:delete
      - task: questdb:delete
      - task: yugabyte:delete
      - task: debezium-operator:delete
      - task: redis:delete
      - task: cnpg:delete
      - task: cass-operator:delete
      - task: postgresql:delete
      - task: pxc-db:delete
      - task: pxc-operator:delete
  check:
    cmds:
      - task: pxc-operator:check
      - task: pxc-db:check
      - task: cass-operator:check
      - task: postgresql:check
      - task: cnpg:check
      - task: redis:check
      - task: yugabyte:check
      - task: questdb:check
      - task: clickhouse:check
      - task: cockroachdb:check
      - task: neo4j:check
