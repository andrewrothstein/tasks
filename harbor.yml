---
version: '3'
includes:
  repo: harbor-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: harbor
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    internal: true
    vars:
      namespace: harbor
      name: harbor
      chart_repo_name: harbor
      chart: harbor
      chart_ver: 1.17.2
  ingress:
    taskfile: helm.yml
    vars:
      chart: chart-tailscale-ingress
      namespace: harbor
      name: harbor-registry
      helm_args: -f harbor-tailscale-ingress-values.yml
tasks:
  default:
    deps:
      - upgrade
  test-secrets:
    vars:
      adminPassword: '{{ .adminPassword | default "${HARBOR_ADMIN_PASSWORD}" }}'
    cmds:
      - test {{ .adminPassword | quote }}
  upgrade:
    vars:
      adminPassword: '{{ .adminPassword | default "${HARBOR_ADMIN_PASSWORD}" }}'
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: test-secrets
        vars:
          adminPassword: '{{ .adminPassword }}'
      - task: helm:upgrade
        vars:
          helm_args: >-
            -f harbor-values.yml
            --set harborAdminPassword={{ .adminPassword | quote }}
      - task: ingress:upgrade
  delete:
    cmds:
      - task: ingress:delete
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
