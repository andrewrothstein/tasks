---
version: '3'
includes:
  kk:
    internal: true
    taskfile: kubectl.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: kpack
      k: kpack
tasks:
  default:
    deps:
      - apply
  apply:
    cmds:
      - task: kk:kapply
  delete:
    cmds:
      - task: kk:kdelete
