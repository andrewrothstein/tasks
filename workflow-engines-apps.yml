---
version: '3'
# Argo CD app-of-apps for Temporal and Argo Workflows, each backed by a cnpg
# cluster. An alternative to temporal.yml and argo.yml: it manages the same
# releases, so use one or the other on a given cluster.
# Needs argocd.yml, cnpg.yml and seaweedfs.yml to be installed first.
vars:
  ARGOCD_NAMESPACE: '{{ .ARGOCD_NAMESPACE | default "argocd" }}'
  APP_NAME: workflow-engines
includes:
  kk:
    taskfile: kubectl.yml
  temporal-barman-s3:
    taskfile: barman-s3-secret.yml
    vars:
      n: temporal
      s: temporal-pg-barman-s3
  argo-barman-s3:
    taskfile: barman-s3-secret.yml
    vars:
      n: argo
      s: argo-pg-barman-s3
tasks:
  default:
    cmds:
      - task: upgrade
  secrets:
    desc: "Create the namespaces and the backup credentials the cnpg clusters expect"
    cmds:
      - task: kk:ns-create
        vars:
          n: temporal
      - task: kk:ns-create
        vars:
          n: argo
          labels: 'istio.io/dataplane-mode=ambient'
      - task: temporal-barman-s3:create
      - task: argo-barman-s3:create
  upgrade:
    desc: "Apply the root Application; Argo CD creates and syncs the four child apps"
    vars:
      repo_url: '{{ .repo_url | default "https://github.com/andrewrothstein/tasks.git" }}'
      target_revision: '{{ .target_revision | default "develop" }}'
    cmds:
      - task: secrets
      - |
        kubectl apply -f - <<MANIFEST
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: {{ .APP_NAME }}
          namespace: {{ .ARGOCD_NAMESPACE }}
          finalizers:
            - resources-finalizer.argocd.argoproj.io
        spec:
          project: default
          source:
            repoURL: {{ .repo_url }}
            targetRevision: {{ .target_revision }}
            path: chart-workflow-engines-apps
            helm:
              parameters:
                - name: repoURL
                  value: {{ .repo_url }}
                - name: targetRevision
                  value: {{ .target_revision }}
          destination:
            server: https://kubernetes.default.svc
            namespace: {{ .ARGOCD_NAMESPACE }}
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
        MANIFEST
  wait:
    desc: "Wait for the root app and its children to be synced and healthy"
    vars:
      timeout: '{{ .timeout | default "20m" }}'
    cmds:
      - >-
        kubectl wait applications.argoproj.io/{{ .APP_NAME }}
        -n {{ .ARGOCD_NAMESPACE }}
        --for=jsonpath='{.status.sync.status}'=Synced
        --timeout={{ .timeout }}
      - >-
        kubectl wait applications.argoproj.io
        {{ .APP_NAME }} temporal-pg temporal argo-pg argo-workflows
        -n {{ .ARGOCD_NAMESPACE }}
        --for=jsonpath='{.status.health.status}'=Healthy
        --timeout={{ .timeout }}
  status:
    cmds:
      - kubectl get applications.argoproj.io -n {{ .ARGOCD_NAMESPACE }}
      - kubectl get clusters.postgresql.cnpg.io -A
  delete:
    desc: "Delete the root app; its finalizer removes the child apps and everything they deployed"
    cmds:
      - >-
        kubectl delete applications.argoproj.io/{{ .APP_NAME }}
        -n {{ .ARGOCD_NAMESPACE }}
        --ignore-not-found
        --wait
      - task: kk:ns-delete
        vars:
          n: temporal
      - task: kk:ns-delete
        vars:
          n: argo
