---
version: '3'
dotenv:
includes:
  cicd:
    taskfile: terraform-cicd.yml
    flatten: true
    vars:
      WORKSPACE_NAME: gitlab
      CHDIR: tf-gitlab
      tfvars: >-
        -var "admin_token={{ .admin_token | default "${GITLAB_ADMIN_TOKEN}" }}"
        -var "base_url=https://gitlab.elephant-frog.ts.net"
