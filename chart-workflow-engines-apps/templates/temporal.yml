{{- if .Values.temporal.enabled }}
---
{{ include "workflow-engines-apps.pg" (dict "root" $ "name" "temporal-pg" "namespace" .Values.temporal.namespace "valuesFile" "temporal-pg-values.yml") }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: temporal
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  sources:
    - repoURL: https://temporalio.github.io/helm-charts
      chart: temporal
      targetRevision: {{ .Values.temporal.chartVersion }}
      helm:
        releaseName: temporal
        valueFiles:
          - $values/temporal-values.yml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      ref: values
  destination:
    server: {{ .Values.destination.server }}
    namespace: {{ .Values.temporal.namespace }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
