[Service]
# With /dev/zfs present the kubelet asks a zfs binary for disk stats; the node
# image has none, so on ZFS-backed docker storage the kubelet exits at startup.
# Without the device node it falls back to statfs. Only the node's own /dev is
# touched, and the rm is a no-op on hosts without ZFS.
ExecStartPre=-/bin/rm -f /dev/zfs
