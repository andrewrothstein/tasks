---
version: '3'
vars:
  K8S_DIGESTER_VERSION: v0.1.16
  K8S_DIGESTER_MIRROR: https://github.com/google/k8s-digester.git/manifests/
includes:
  gh:
    internal: true
    taskfile: gh.yml
    vars:
      org: google
      repo: k8s-digester
      current_ver: '{{ .K8S_DIGESTER_VERSION }}'
      strip_v: "false"
  kk:
    internal: true
    taskfile: kubectl.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: digester-system
tasks:
  default:
    cmds:
      - task: apply
  apply:
    vars:
      version: '{{ .version | default .K8S_DIGESTER_VERSION }}'
    deps:
      - task: kk:kapply
        vars:
          k: '{{ .K8S_DIGESTER_MIRROR }}?ref={{ .version }}'
  delete:
    vars:
      version: '{{ .version | default .K8S_DIGESTER_VERSION }}'
    deps:
      - task: kk:kdelete
        vars:
          k: '{{ .K8S_DIGESTER_MIRROR }}?ref={{ .version }}'
  check:
    cmds:
      - task: gh:check
