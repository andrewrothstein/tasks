---
version: '3'
includes:
  repo: tailscale-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: tailscale
#      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: tailscale
      chart: tailscale-operator
      chart_ver: 1.76.1
      namespace: tailscale
      name: tailscale
      helm_args: >-
        --set oauth.clientId="${TAILSCALE_OPERATOR_CLIENT_ID}"
        --set oauth.clientSecret="${TAILSCALE_OPERATOR_CLIENT_SECRET}"
  py-k8s-tools:
    taskfile: pipenv.yml
    vars:
      workdir: py-k8s-tools
tasks:
  default:
    cmds:
      - task: upgrade
  test-secrets:
    cmds:
      - test ${TAILSCALE_OPERATOR_CLIENT_ID}
      - test ${TAILSCALE_OPERATOR_CLIENT_SECRET}
  upgrade:
    deps:
      - task: repo
      - task: test-secrets
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - repo
    cmds:
      - task: helm:check
  cluster-evacuate-kubectl:
    cmds:
      - |
        kubectl get ingress -A -o json | \
          jq '.items[] | select(.spec.ingressClassName == "tailscale") | .metadata | [.namespace, .name] | join(" ")' -r | \
          xargs -I {} sh -c 'kubectl delete ingress -n $(echo "{}" | cut -d" " -f1) $(echo "{}" | cut -d" " -f2)'
  cluster-evacuate-python:
    cmds:
      - task: py-k8s-tools:run
        vars:
          run_args: python ingress-cleanup.py
  cluster-evacuate:
    deps:
      - task: cluster-evacuate-python
      - task: delete
