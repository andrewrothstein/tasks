---
version: '3'
includes:
  repo: tailscale-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: tailscale
#      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: tailscale
      chart: tailscale-operator
      chart_ver: 1.84.3
      namespace: tailscale
      name: tailscale
      helm_args: |-
        --set oauth.clientId="${TAILSCALE_OPERATOR_CLIENT_ID}" \
          --set oauth.clientSecret="${TAILSCALE_OPERATOR_CLIENT_SECRET}"
  py-k8s-tools:
    taskfile: pipenv.yml
    vars:
      workdir: py-k8s-tools
tasks:
  default:
    cmds:
      - task: upgrade
  test-secrets:
    cmds:
      - test ${TAILSCALE_OPERATOR_CLIENT_ID}
      - test ${TAILSCALE_OPERATOR_CLIENT_SECRET}
  upgrade:
    deps:
      - task: repo
      - task: test-secrets
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - repo
    cmds:
      - task: helm:check
  cluster-evacuate:
    vars:
      sleep_time: '{{ .sleep_time | default 60 }}'
    cmds:
      - task: py-k8s-tools:run
        vars:
          run_args: python ingress-cleanup.py
      - sleep {{ .sleep_time }}
