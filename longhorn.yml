---
version: '3'
includes:
  repo: longhorn-repo.yml
  helm:
    taskfile: helm.yml
    vars:
      namespace: longhorn-system
      create_namespace: 'true'
      name: longhorn
      chart_repo_name: longhorn
      chart: longhorn
      chart_ver: 1.9.1
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
