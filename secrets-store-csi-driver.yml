---
version: '3'
includes:
  repo: secrets-store-csi-driver-repo.yml
  helm:
    taskfile: helm.yml
    internal: true
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: kube-system
      name: csi-secrets-store
      chart_repo_name: secrets-store-csi-driver
      chart: secrets-store-csi-driver
      chart_ver: 1.6.0
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
