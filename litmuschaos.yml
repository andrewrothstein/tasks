---
version: '3'
includes:
  repo: litmuschaos-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: litmus
      labels: 'istio.io/dataplane-mode=ambient'
  ingress:
    taskfile: helm.yml
    vars:
      chart: chart-tailscale-ingress
      namespace: litmus
      name: tailscale-ingress
      helm_args: -f litmuschaos-tailscale-ingress-values.yml
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: litmuschaos
      chart: litmus
      chart_ver: 3.14.0
      namespace: litmus
      name: litmus
#      helm_args: -f litmus-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: helm:upgrade
      - task: ingress:upgrade
  delete:
    cmds:
      - task: ingress:delete
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
