---
version: '3'
includes:
#  trivy-operator: trivy-operator.yml
  trivy-operator: pet.yml

  keycloak: bitnami-keycloak.yml
#  keycloak: pet.yml
tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: keycloak:upgrade
      - task: trivy-operator:upgrade
  delete:
    cmds:
      - task: trivy-operator:delete
      - task: keycloak:delete
  check:
    cmds:
      - task: keycloak:check
      - task: trivy-operator:check
