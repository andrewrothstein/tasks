---
version: '3'
includes:
  repo: k8sgpt-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: k8sgpt-operator-system
      labels: 'istio.io/dataplane-mode=ambient'
      k: k8sgpt-ollama-backend
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: k8sgpt
      chart: k8sgpt-operator
      chart_ver: 0.2.5
      namespace: k8sgpt-operator-system
      name: k8sgpt-operator
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: helm:upgrade
      - task: kk:kapply
  delete:
    cmds:
      - task: kk:kdelete
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
