---
version: '3'
includes:
  pipeline:
    taskfile: tekton.yml
    vars:
      APP: pipeline
      VER: 0.60.1
  hello-world:
    taskfile: kubectl.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      f: tekton-helloworld.yml
tasks:
  apply:
    cmds:
      - task: pipeline:apply
      - task: hello-world:apply
  delete:
    cmds:
      - task: hello-world:delete
      - task: pipeline:delete
  default:
    cmds:
      - task: apply
