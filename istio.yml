---
version: '3'
vars:
  istio_ver: 1.23.3
includes:
  repo: istio-repo.yml
  istio-base:
    taskfile: helm.yml
    vars:
      namespace: istio-system
      create_namespace: 'true'
      name: istio-base
      chart_repo_name: istio
      chart: base
      chart_ver: '{{ .istio_ver }}'
  cni:
    taskfile: helm.yml
    vars:
      namespace: kube-system
      name: istio-cni
      chart_repo_name: istio
      chart: cni
      chart_ver: '{{ .istio_ver }}'
      helm_args: -f istio-profile-values.yml
  istiod:
    taskfile: helm.yml
    vars:
      namespace: istio-system
      name: istiod
      chart_repo_name: istio
      chart: istiod
      chart_ver: '{{ .istio_ver }}'
      helm_args: -f istio-profile-values.yml
  ztunnel:
    taskfile: helm.yml
    vars:
      namespace: istio-system
      name: ztunnel
      chart_repo_name: istio
      chart: ztunnel
      chart_ver: '{{ .istio_ver }}'
tasks:
  default:
    deps:
      - task: install
  up:
    deps:
      - task: install
  install:
    deps:
      - repo
    cmds:
      - task: istio-base:upgrade
      - task: cni:upgrade
      - task: istiod:upgrade
      - task: ztunnel:upgrade
  delete:
    cmds:
      - task: ztunnel:delete
      - task: istiod:delete
      - task: cni:delete
      - task: istio-base:delete
  check:
    deps:
      - repo
    cmds:
      - task: gateway-api:check
      - task: istio-base:check
