---
version: '3'
vars:
  istio_ver: 1.28.1
includes:
  repo: istio-repo.yml
  helm:
    taskfile: helm.yml
    vars:
      namespace: istio-system
      create_namespace: 'true'
      name: istio-ambient
      chart_repo_name: istio
      chart: ambient
      chart_ver: '{{ .istio_ver }}'
      helm_args: -f istio-ambient-values.yml
tasks:
  default:
    deps:
      - task: upgrade
  up:
    deps:
      - task: upgrade
  upgrade:
    deps:
      - repo
    cmds:
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
  check:
    deps:
      - repo
    cmds:
      - task: helm:check
