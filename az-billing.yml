---
version: '3'
tasks:
  default:
    cmds:
      - task: list
        vars:
          query: "[].{name:name, displayName:displayName}"
  list:
    vars:
      query: '{{ .query }}'
    cmds:
      - |-
        az billing account \
          list
        {{- if .query }} \
          --query {{ .query | quote }}
        {{- end }}
