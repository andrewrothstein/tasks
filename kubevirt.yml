---
version: '3'
includes:
  kk:
    taskfile: kubectl.yml
#    vars:
#      n: kubevirt
tasks:
  apply_operator:
    cmds:
      - task: kk:kapply
        vars:
          k: kubevirt-operator
  delete_operator:
    cmds:
      - task: kk:kdelete
        vars:
          k: kubevirt-operator
  apply_crds:
    cmds:
      - task: kk:kapply
        vars:
          k: kubevirt-crds
  delete_crds:
    cmds:
      - task: kk:kdelete
        vars:
          k: kubevirt-crds
  apply:
    cmds:
      - task: apply_operator
      - task: apply_crds
  delete:
    cmds:
      - task: delete_crds
      - task: delete_operator
  default:
    deps:
      - apply
