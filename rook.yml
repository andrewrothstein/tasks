---
version: '3'
vars:
  rook_ver: v1.19.1
includes:
  repo: rook-repo.yml
  operator:
    taskfile: helm.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: rook-ceph
      create_namespace: 'true'
      name: rook-ceph
      chart_repo_name: rook-release
      chart: rook-ceph
      chart_ver: '{{ .rook_ver }}'
  cluster:
    taskfile: helm.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: rook-ceph-cluster
      create_namespace: 'true'
      name: rook-ceph-cluster
      chart_repo_name: rook-release
      chart: rook-ceph-cluster
      chart_ver: '{{ .rook_ver }}'
      helm_args: >-
        --set operatorNamespace=rook-ceph
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: operator:upgrade
      - task: cluster:upgrade
  delete:
    cmds:
      - task: cluster:delete
      - task: operator:delete
  check:
    deps:
      - task: repo
    cmds:
      - task: operator:check
      - task: cluster:check
