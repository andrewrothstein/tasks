---
version: '3'
includes:
  repo: crossplane-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: crossplane-system
#      labels: istio.io/dataplane-mode=ambient
  crossplane-helm:
    taskfile: helm.yml
    internal: true
    vars:
      namespace: crossplane-system
      name: crossplane
      chart_repo_name: crossplane-stable
      chart: crossplane
      chart_ver: 1.19.1
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: crossplane-helm:upgrade
  check:
    deps:
      - task: repo
    cmds:
      - task: crossplane-helm:check
  delete:
    cmds:
      - task: crossplane-helm:delete
      - task: kk:ns-delete
