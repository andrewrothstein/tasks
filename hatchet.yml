---
version: '3'
includes:
  repo: hatchet-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: hatchet
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: hatchet
      chart: hatchet-stack
      chart_ver: 0.10.1
      namespace: hatchet
      name: hatchet-stack
  ingress:
    taskfile: helm.yml
    vars:
      chart: chart-tailscale-ingress
      namespace: hatchet
      name: hatchet-ui-tailscale-ingress
      helm_args: -f hatchet-tailscale-ingress-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    vars:
      admin_email: '{{ .admin_email | default "${HATCHET_ADMIN_EMAIL}" }}'
      admin_password: '{{ .admin_password | default "${HATCHET_ADMIN_PASSWORD}" }}'
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: helm:upgrade
        vars:
          helm_args: |-
            \
              -f hatchet-values.yml \
              --set sharedConfig.defaultAdminEmail={{ .admin_email | quote }} \
              --set sharedConfig.defaultAdminPassword={{ .admin_password | quote }}
      - task: gateway
      - task: ingress:upgrade
  gateway:
    desc: Apply Istio Gateway and HTTPRoute for path-based routing
    cmds:
      - kubectl apply -f hatchet-gateway.yml
  delete:
    cmds:
      - task: ingress:delete
      - kubectl delete -f hatchet-gateway.yml --ignore-not-found
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
