---
version: '3'
vars:
  metallb: metallb
  ngrok_operator: ngrok-operator
  pomerium_zero: pet
  ingress: pet
  envoygateway: envoygateway
  gloo_gateway: pet
includes:
  metallb:
    taskfile: '{{ .metallb }}.yml'

  ngrok-operator:
    taskfile: '{{ .ngrok_operator }}.yml'

  pomerium-zero:
    taskfile: '{{ .pomerium_zero }}.yml'

  ingress:
    taskfile: '{{ .ingress }}.yml'

  envoygateway:
    taskfile: '{{ .envoygateway }}.yml'

  gloo-gateway:
    taskfile: '{{ .gloo_gateway }}.yml'
tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: metallb:upgrade
      - task: ngrok-operator:upgrade
      - task: pomerium-zero:apply
      - task: ingress:upgrade
      - task: envoygateway:upgrade
      - task: gloo-gateway:upgrade
  delete:
    cmds:
      - task: gloo-gateway:delete
      - task: envoygateway:delete
      - task: ingress:delete
      - task: pomerium-zero:delete
      - task: ngrok-operator:delete
      - task: metallb:delete
  check:
    cmds:
      - task: metallb:check
      - task: ingress:check
      - task: ngrok-operator:check
      - task: envoygateway:check
      - task: gloo-gateway:check
