---
version: '3'
includes:
  metallb: metallb.yml
#  metallb: pet.yml

#  ingress: nginx-ingress.yml
  ingress: pet.yml

  envoygateway: envoygateway.yml
#  envoygateway: pet.yml
tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: metallb:upgrade
      - task: ingress:upgrade
      - task: envoygateway:upgrade
  delete:
    cmds:
      - task: envoygateway:delete
      - task: ingress:delete
      - task: metallb:delete
  check:
    cmds:
      - task: metallb:check
      - task: ingress:check
      - task: envoygateway:check
