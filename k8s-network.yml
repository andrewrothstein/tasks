---
version: '3'
includes:
  metallb: metallb.yml
#  metallb: pet.yml

  ngrok-operator: ngrok-operator.yml
#  ngrok-operator: pet.yml

#  pomerium-zero: pomerium-zero.yml
  pomerium-zero: pet.yml

#  ingress: nginx-ingress.yml
  ingress: pet.yml

#  envoygateway: envoygateway.yml
  envoygateway: pet.yml

#  gloo-gateway: gloo-gateway.yml
  gloo-gateway: pet.yml
tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: metallb:upgrade
      - task: ngrok-operator:upgrade
      - task: pomerium-zero:apply
      - task: ingress:upgrade
      - task: envoygateway:upgrade
      - task: gloo-gateway:upgrade
  delete:
    cmds:
      - task: gloo-gateway:delete
      - task: envoygateway:delete
      - task: ingress:delete
      - task: pomerium-zero:delete
      - task: ngrok-operator:delete
      - task: metallb:delete
  check:
    cmds:
      - task: metallb:check
      - task: ingress:check
      - task: ngrok-operator:check
      - task: envoygateway:check
      - task: gloo-gateway:check
