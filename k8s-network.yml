---
version: '3'
includes:
  metallb: metallb.yml
#  metallb: pet.yml

  ngrok-ingress-controller: ngrok-ingress-controller.yml
#  ngrok-ingress-controller: pet.yml

#  ingress: nginx-ingress.yml
  ingress: pet.yml

  envoygateway: envoygateway.yml
#  envoygateway: pet.yml

  gloo-gateway: gloo-gateway.yml
tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: metallb:upgrade
      - task: ngrok-ingress-controller:upgrade
      - task: ingress:upgrade
      - task: envoygateway:upgrade
      - task: gloo-gateway:upgrade
  delete:
    cmds:
      - task: gloo-gateway:delete
      - task: envoygateway:delete
      - task: ingress:delete
      - task: ngrok-ingress-controller:delete
      - task: metallb:delete
  check:
    cmds:
      - task: metallb:check
      - task: ingress:check
      - task: ngrok-ingress-controller:check
      - task: envoygateway:check
      - task: gloo-gateway:check
