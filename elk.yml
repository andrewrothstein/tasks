---
version: '3'
includes:
  elk:
    taskfile: kubectl.yml
    vars:
      n: elk
#      labels: 'istio.io/dataplane-mode=ambient'
      k: elk
  tailscale-ingress:
    taskfile: helm.yml
    vars:
      chart: chart-tailscale-ingress
      namespace: elk
      name: tailscale-ingress
      helm_args: -f elk-tailscale-ingress-values.yml
  elastic-secrets:
    taskfile: k8s-literal-secret.yml
    vars:
      n: elk
      s: elasticsearch-es-elastic-user
  kibana-secrets:
    taskfile: k8s-literal-secret.yml
    vars:
      n: elk
      s: kibana-kibana-user
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    cmds:
      - task: elk:ns-create
      - task: elk:kapply
      - task: tailscale-ingress:upgrade
  delete:
    cmds:
      - task: tailscale-ingress:delete
      - task: elk:kdelete
      - task: elk:ns-delete
  check:
    cmds: []
  elastic-creds:
    cmds:
      - task: elastic-secrets:get
        vars:
          f: elastic
  kibana-creds:
    cmds:
      - task: kibana-secrets:get
        vars:
          f: name
      - task: kibana-secrets:get
        vars:
          f: token
