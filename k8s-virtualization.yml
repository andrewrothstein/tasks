---
version: '3'
includes:
#  preprod-vclusters: preprod-vclusters.yml
  preprod-vclusters: pet.yml

#  capi-operator: capi-operator.yml
  capi-operator: pet.yml

#  kubevirt: kubevirt.yml
  kubevirt: pet.yml

#  kubevirt-cdi: kubevirt-cdi.yml
  kubevirt-cdi: pet.yml

#  kubevirt-vms: kubevirt-vm.yml
  kubevirt-vms: pet.yml

  crossplane: crossplane.yml
#  crossplane: pet.yml

#  crossplane-azure: crossplane-azure.yml
  crossplane-azure: pet.yml

tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: preprod-vclusters:upgrade
      - task: capi-operator:upgrade
      - task: kubevirt:apply
      - task: kubevirt-cdi:apply
      - task: kubevirt-vms:apply
      - task: crossplane:upgrade
      - task: crossplane-azure:upgrade
  delete:
    cmds:
      - task: crossplane-azure:delete
      - task: crossplane:delete
      - task: kubevirt-vms:delete
      - task: kubevirt-cdi:delete
      - task: kubevirt:delete
      - task: capi-operator:delete
      - task: preprod-vclusters:delete
  check:
    cmds:
      - task: preprod-vclusters:check
      - task: capi-operator:check
      - task: crossplane:check
