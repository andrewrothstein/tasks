---
version: '3'
vars:
  preprod_vclusters: pet
  capi_operator: pet
  kubevirt: pet
  kubevirt_cdi: pet
  kubevirt_vms: pet
  crossplane: crossplane
  crossplane_aws_provider: crossplane-aws-provider
  crossplane_azure_provider: crossplane-azure-provider
  crossplane_azure: pet
  crossplane_gcp_provider: crossplane-gcp-provider
  crossplane_terraform_provider: crossplane-terraform-provider
  crossplane_vault_provider: crossplane-vault-provider
includes:
  preprod-vclusters:
    taskfile: '{{ .preprod_vclusters }}.yml'

  capi-operator:
    taskfile: '{{ .capi_operator }}.yml'

  kubevirt:
    taskfile: '{{ .kubevirt }}.yml'

  kubevirt-cdi:
    taskfile: '{{ .kubevirt_cdi }}.yml'

  kubevirt-vms:
    taskfile: '{{ .kubevirt_vms }}.yml'

  crossplane:
    taskfile: '{{ .crossplane }}.yml'

  crossplane-aws-provider:
    taskfile: '{{ .crossplane_aws_provider }}.yml'

  crossplane-azure-provider:
    taskfile: '{{ .crossplane_azure_provider }}.yml'

  crossplane-azure:
    taskfile: '{{ .crossplane_azure }}.yml'

  crossplane-gcp-provider:
    taskfile: '{{ .crossplane_gcp_provider }}.yml'

  crossplane-terraform-provider:
    taskfile: '{{ .crossplane_terraform_provider }}.yml'

  crossplane-vault-provider:
    taskfile: '{{ .crossplane_vault_provider }}.yml'

tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: preprod-vclusters:upgrade
      - task: capi-operator:upgrade
      - task: kubevirt:apply
      - task: kubevirt-cdi:apply
      - task: kubevirt-vms:apply
      - task: crossplane:upgrade
      - task: crossplane-aws-provider:kapply
      - task: crossplane-azure-provider:kapply
      - task: crossplane-gcp-provider:kapply
      - task: crossplane-terraform-provider:kapply
      - task: crossplane-vault-provider:kapply
      - task: crossplane-azure:upgrade
  delete:
    cmds:
      - task: crossplane-azure:delete
      - task: crossplane-vault-provider:delete
      - task: crossplane-terraform-provider:delete
      - task: crossplane-gcp-provider:delete
      - task: crossplane-azure-provider:delete
      - task: crossplane-aws-provider:delete
      - task: crossplane:delete
      - task: kubevirt-vms:delete
      - task: kubevirt-cdi:delete
      - task: kubevirt:delete
      - task: capi-operator:delete
      - task: preprod-vclusters:delete
  check:
    cmds:
      - task: preprod-vclusters:check
      - task: capi-operator:check
      - task: crossplane:check
