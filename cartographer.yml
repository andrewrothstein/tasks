---
version: '3'
includes:
  kubectl:
    taskfile: kubectl.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: cartographer-system
tasks:
  install:
    cmds:
      - task: kubectl:ns-create
      - task: kubectl:apply
        vars:
          f: https://github.com/vmware-tanzu/cartographer/releases/latest/download/cartographer.yaml
  default:
    deps:
      - task: install
