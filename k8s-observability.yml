---
version: '3'
vars:
  k8s_dashboard: pet
  komodor: pet
  open_telemetry_operator: open-telemetry-operator
  kube_prometheus_stack: kube-prometheus-stack
  elk: pet
  eck: pet
  jaeger: pet
  kiali: kiali
  grafana: pet
  datadog: pet
includes:
  k8s-dashboard:
    taskfile: '{{ .k8s_dashboard }}.yml'

  komodor:
    taskfile: '{{ .komodor }}.yml'

  open-telemetry-operator:
    taskfile: '{{ .open_telemetry_operator }}.yml'

  kube-prometheus-stack:
    taskfile: '{{ .kube_prometheus_stack }}.yml'

  elk:
    taskfile: '{{ .elk }}.yml'

  eck:
    taskfile: '{{ .eck }}.yml'

  jaeger:
    taskfile: '{{ .jaeger }}.yml'

  kiali:
    taskfile: '{{ .kiali }}.yml'

  grafana:
    taskfile: '{{ .grafana }}.yml'

  datadog:
    taskfile: '{{ .datadog }}.yml'

tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: k8s-dashboard:upgrade
      - task: open-telemetry-operator:upgrade
      - task: komodor:upgrade
      - task: kube-prometheus-stack:upgrade
      - task: eck:upgrade
      - task: elk:upgrade
      - task: jaeger:upgrade
      - task: kiali:upgrade
      - task: grafana:upgrade
      - task: datadog:upgrade
  delete:
    cmds:
      - task: datadog:delete
      - task: grafana:delete
      - task: kiali:delete
      - task: jaeger:delete
      - task: elk:delete
      - task: eck:delete
      - task: kube-prometheus-stack:delete
      - task: komodor:delete
      - task: open-telemetry-operator:delete
      - task: k8s-dashboard:delete
  check:
    cmds:
      - task: k8s-dashboard:check
      - task: open-telemetry-operator:check
      - task: komodor:check
      - task: kube-prometheus-stack:check
      - task: eck:check
      - task: elk:check
      - task: jaeger:check
      - task: kiali:check
      - task: grafana:check
      - task: datadog:check
