---
version: '3'
includes:
#  k8s-dashboard: k8s-dashboard.yml
  k8s-dashboard: pet.yml

  komodor: komodor.yml
#  komodor: pet.yml

#  open-telemetry-operator: open-telemetry-operator.yml
  open-telemetry-operator: pet.yml

  kube-prometheus-stack: kube-prometheus-stack.yml
#  kube-prometheus-stack: pet.yml

#  elk: elk.yml
  elk: pet.yml

  keda: keda.yml
#  keda: pet.yml

#  eck: eck.yml
  eck: pet.yml

#  jaeger: jaeger.yml
  jaeger: pet.yml

  kiali: kiali.yml
#  kiali: pet.yml

#  grafana: grafana.yml
  grafana: pet.yml

#  datadog: datadog.yml
  datadog: pet.yml

tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: k8s-dashboard:upgrade
      - task: open-telemetry-operator:upgrade
      - task: komodor:upgrade
      - task: kube-prometheus-stack:upgrade
      - task: eck:upgrade
      - task: elk:upgrade
      - task: jaeger:upgrade
      - task: keda:upgrade
      - task: kiali:upgrade
      - task: grafana:upgrade
      - task: datadog:upgrade
  delete:
    cmds:
      - task: datadog:delete
      - task: grafana:delete
      - task: kiali:delete
      - task: keda:delete
      - task: jaeger:delete
      - task: elk:delete
      - task: eck:delete
      - task: kube-prometheus-stack:delete
      - task: komodor:delete
      - task: open-telemetry-operator:delete
      - task: k8s-dashboard:delete
  check:
    cmds:
      - task: k8s-dashboard:check
      - task: open-telemetry-operator:check
      - task: komodor:check
      - task: kube-prometheus-stack:check
      - task: eck:check
      - task: elk:check
      - task: jaeger:check
      - task: keda:check
      - task: kiali:check
      - task: grafana:check
      - task: datadog:check
