---
version: '3'
includes:
  repo: external-dns-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: external-dns
  secrets:
    taskfile: k8s-literal-secret.yml
    vars:
      n: external-dns
  helm:
    taskfile: helm.yml
    vars:
      namespace: external-dns
      create_namespace: 'false'
      name: external-dns
      chart_repo_name: external-dns
      chart: external-dns
      chart_ver: 1.21.1
tasks:
  default:
    deps:
      - upgrade
  test-godaddy-secrets:
    cmds:
      - test "${GODADDY_API_KEY}"
      - test "${GODADDY_API_SECRET}"
      - |
        curl \
          -v \
          -X GET "https://api.godaddy.com/v1/domains" \
          -H "Authorization: sso-key ${GODADDY_API_KEY}:${GODADDY_API_SECRET}"
  create-godaddy-secrets:
    cmds:
      - task: test-godaddy-secrets
      - task: secrets:create
        vars:
          s: external-dns-godaddy
          args: >-
            --from-literal=apiKey="${GODADDY_API_KEY}"
            --from-literal=apiSecret="${GODADDY_API_SECRET}"
  test-cf-secrets:
    cmds:
      - test "${CLOUDFLARE_DNS_TOKEN}"
  create-cloudflare-secrets:
    cmds:
      - task: secrets:create
        vars:
          s: external-dns-cloudflare
          args: >-
            --from-literal=apiKey="${CLOUDFLARE_DNS_TOKEN}"
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
#      - task: create-godaddy-secrets
      - task: create-cloudflare-secrets
      - task: helm:upgrade
        vars:
          helm_args: -f external-dns-values.yml
  delete:
    cmds:
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
