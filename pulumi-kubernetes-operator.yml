---
version: '3'
includes:
  helm:
    taskfile: helm.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      chart: oci://ghcr.io/pulumi/helm-charts/pulumi-kubernetes-operator
      chart_ver: 2.0.0
      create_namespace: "true"
      namespace: pulumi-kubernetes-operator
      name: pulumi-kubernetes-operator
#      helm_args: -f pulumi-kubernetes-operator-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    cmds:
      - task: helm:upgrade
        vars:
  delete:
    cmds:
      - task: helm:delete
  check:
    cmds: []
