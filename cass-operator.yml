---
version: '3'
includes:
  repo: k8ssandra-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: cass-operator
      labels: 'istio.io/dataplane-mode=ambient'
      k: cassandra-cluster
  helm:
    taskfile: helm.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: cass-operator
      name: cass-operator
      chart_repo_name: k8ssandra
      chart: cass-operator
      chart_ver: 0.62.5
tasks:
  default:
    deps:
      - upgrade
  test-cluster:
    cmds:
      - task: kk:kapply
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: helm:upgrade
  delete-cluster:
    cmds:
      - task: kk:kdelete
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
