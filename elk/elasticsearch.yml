---
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
spec:
  version: 8.15.3
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
        volumeClaimTemplates:
          - metadata:
              name: elasticsearch-data
            spec:
              accessModes:
                - "ReadWriteOnce"
            resources:
              requests:
                storage: 10Gi
