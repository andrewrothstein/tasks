---
version: '3'
vars:
  gatekeeper: pet
  kyverno: kyverno
includes:
  gatekeeper:
    taskfile: '{{ .gatekeeper }}.yml'

  kyverno:
    taskfile: '{{ .kyverno }}.yml'

tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: gatekeeper:upgrade
      - task: kyverno:upgrade
  delete:
    cmds:
      - task: kyverno:delete
      - task: gatekeeper:delete
  check:
    cmds:
      - task: gatekeeper:check
      - task: kyverno:check
