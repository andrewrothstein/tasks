---
version: '3'

# Cluster safety
# --------------
# Every task that hits a Kubernetes cluster requires the driver to declare
# both the kubeconfig file and the context, either by passing
# kubeconfig=<file> kube_context=<name> on the CLI or by exporting
# KUBECONFIG and KUBE_CONTEXT in the shell. Missing either is a hard error.
# The flags --kubeconfig and --context are passed on every kubectl
# invocation, so current-context drift cannot select the wrong cluster.

vars:
  KUBECTL_TIMEOUT: '{{ .KUBECTL_TIMEOUT | default "300s" }}'
  KUBECTL_DRY_RUN: '{{ .KUBECTL_DRY_RUN | default "false" }}'

tasks:
  _require-context:
    internal: true
    vars:
      kubeconfig: '{{ .kubeconfig }}'
      kube_context: '{{ .kube_context }}'
    cmds:
      - |-
        missing=
        [ -n {{ .kubeconfig | quote }} ]   || missing="${missing}kubeconfig "
        [ -n {{ .kube_context | quote }} ] || missing="${missing}kube_context "
        if [ -n "${missing}" ]; then
          echo "ERROR: kubectl task requires explicit ${missing}declaration." >&2
          echo "  Pass kubeconfig=<file> kube_context=<name> on the CLI, or" >&2
          echo "  export KUBECONFIG=<file> KUBE_CONTEXT=<name> in your shell." >&2
          echo "  This is enforced repo-wide to prevent cross-cluster mishaps." >&2
          exit 1
        fi

  ns-label:
    desc: "Apply labels to a namespace"
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: '{{ .n }}'
      labels: '{{ .labels }}'
      overwrite: '{{ .overwrite | default "true" }}'
    cmds:
      - task: _require-context
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
      - |-
        {{- if .labels }}
        kubectl \
          --kubeconfig {{ .kubeconfig | quote }} \
          --context {{ .kube_context | quote }} \
          label \
          namespace \
          {{ .n | quote }} \
          {{ .labels | quote }}
        {{- if eq .overwrite "true" }} \
          --overwrite
        {{- end }}
        {{- else }}
        echo "No labels to apply to {{ .n | quote }}"
        {{- end }}

  ns-create:
    desc: "Create a namespace"
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: '{{ .n }}'
      labels: '{{ .labels }}'
      dry_run: '{{ .dry_run | default .KUBECTL_DRY_RUN }}'
    cmds:
      - task: _require-context
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
      - |-
        kubectl \
          --kubeconfig {{ .kubeconfig | quote }} \
          --context {{ .kube_context | quote }} \
          create \
          namespace {{ .n | quote }}
        {{- if eq "true" .dry_run }} \
          --dry-run=client
        {{- end }}
      - task: ns-label
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
          n: '{{ .n }}'
          labels: '{{ .labels }}'
    status:
      - >-
        {{- if ne "true" .dry_run }}
        kubectl --kubeconfig {{ .kubeconfig | quote }} --context {{ .kube_context | quote }} get namespace {{ .n | quote }}
        {{- else }}
        false
        {{- end }}

  ns-delete:
    desc: "Delete a namespace"
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: '{{ .n }}'
      force: '{{ .force | default "false" }}'
    cmds:
      - task: _require-context
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
      - |-
        kubectl \
          --kubeconfig {{ .kubeconfig | quote }} \
          --context {{ .kube_context | quote }} \
          delete \
          namespace {{ .n | quote }}
        {{- if eq .force "true" }} \
          --force --grace-period=0
        {{- end }}

  _apply:
    internal: true
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      verb: '{{ .verb }}'
      n: '{{ .n }}'
      f: '{{ .f }}'
      literal_f: '{{ .literal_f }}'
      server_side: '{{ .server_side | default "false" }}'
      dry_run: '{{ .dry_run | default .KUBECTL_DRY_RUN }}'
      force: '{{ .force | default "false" }}'
      validate: '{{ .validate | default "true" }}'
    cmds:
      - task: _require-context
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
      - |-
          kubectl \
            --kubeconfig {{ .kubeconfig | quote }} \
            --context {{ .kube_context | quote }} \
            {{ .verb }}
          {{- if .n }} \
            -n {{ .n | quote }}
          {{- end }}
          {{- if eq "true" .server_side }} \
            --server-side
          {{- end }}
          {{- if eq "true" .dry_run }} \
            --dry-run=client
          {{- end }}
          {{- if eq "true" .force }} \
            --force
          {{- end }}
          {{- if eq "false" .validate }} \
            --validate=false
          {{- end }} \
            -f
          {{- if .literal_f }} - <<'EOF'
          {{ .literal_f }}
          EOF
          {{- else }} {{ .f | quote }}
          {{- end }}

  create:
    desc: "Create resources from file"
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: '{{ .n }}'
      f: '{{ .f }}'
      literal_f: '{{ .literal_f }}'
      server_side: '{{ .server_side | default "false" }}'
      dry_run: '{{ .dry_run | default .KUBECTL_DRY_RUN }}'
    cmds:
      - task: _apply
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
          verb: create
          n: '{{ .n }}'
          f: '{{ .f }}'
          literal_f: '{{ .literal_f }}'
          server_side: '{{ .server_side }}'
          dry_run: '{{ .dry_run }}'

  apply:
    desc: "Apply resources from file"
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: '{{ .n }}'
      f: '{{ .f }}'
      literal_f: '{{ .literal_f }}'
      server_side: '{{ .server_side | default "false" }}'
      dry_run: '{{ .dry_run | default .KUBECTL_DRY_RUN }}'
      force: '{{ .force | default "false" }}'
    cmds:
      - task: _apply
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
          verb: apply
          n: '{{ .n }}'
          f: '{{ .f }}'
          literal_f: '{{ .literal_f }}'
          server_side: '{{ .server_side }}'
          dry_run: '{{ .dry_run }}'
          force: '{{ .force }}'

  delete:
    desc: "Delete resources from file"
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: '{{ .n }}'
      f: '{{ .f }}'
      literal_f: '{{ .literal_f }}'
      force: '{{ .force | default "false" }}'
      cascade: '{{ .cascade | default "background" }}'
    cmds:
      - task: _apply
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
          verb: delete
          n: '{{ .n }}'
          f: '{{ .f }}'
          literal_f: '{{ .literal_f }}'
          force: '{{ .force }}'

  kapply:
    desc: "Apply kustomization"
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: '{{ .n }}'
      k: '{{ .k }}'
      server_side: '{{ .server_side | default "false" }}'
      dry_run: '{{ .dry_run | default .KUBECTL_DRY_RUN }}'
    cmds:
      - task: _require-context
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
      - |
          kubectl \
            --kubeconfig {{ .kubeconfig | quote }} \
            --context {{ .kube_context | quote }} \
            apply
          {{- if .n }} \
            -n {{ .n | quote }}
          {{- end }}
          {{- if .k }} \
            -k {{ .k | quote }}
          {{- end }}
          {{- if eq "true" .server_side }} \
            --server-side
          {{- end }}
          {{- if eq "true" .dry_run }} \
            --dry-run=client
          {{- end }}

  kdelete:
    desc: "Delete kustomization"
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: '{{ .n }}'
      k: '{{ .k }}'
      force: '{{ .force | default "false" }}'
    cmds:
      - task: _require-context
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
      - |
          kubectl \
            --kubeconfig {{ .kubeconfig | quote }} \
            --context {{ .kube_context | quote }} \
            delete
          {{- if .n }} \
            -n {{ .n | quote }}
          {{- end }} \
            -k {{ .k | quote }}
          {{- if eq .force "true" }} \
            --force --grace-period=0
          {{- end }}

  patch:
    desc: "Patch a resource"
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: '{{ .n | default "default" }}'
      resource: '{{ .resource }}{{ .typeofthing }}'  # Support both names
      name: '{{ .name }}{{ .thingname }}'
      type: '{{ .type }}{{ .ty | default "strategic" }}'
      patch: '{{ .patch }}'
      dry_run: '{{ .dry_run | default .KUBECTL_DRY_RUN }}'
    cmds:
      - task: _require-context
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
      - |
          kubectl \
            --kubeconfig {{ .kubeconfig | quote }} \
            --context {{ .kube_context | quote }} \
            patch
          {{- if .n }} \
            -n {{ .n | quote }}
          {{- end }} \
            {{ .resource | quote }} \
            {{ .name | quote }} \
            --type={{ .type | quote }} \
            --patch {{ .patch | quote }}
          {{- if eq "true" .dry_run }} \
            --dry-run=client
          {{- end }}

  wait:
    desc: "Wait for resource condition"
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: '{{ .n }}'
      resource: '{{ .resource }}'
      name: '{{ .name }}'
      selector: '{{ .selector }}'
      for: '{{ .for | default "condition=ready" }}'
      timeout: '{{ .timeout | default .KUBECTL_TIMEOUT }}'
    cmds:
      - task: _require-context
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
      - |
          kubectl \
            --kubeconfig {{ .kubeconfig | quote }} \
            --context {{ .kube_context | quote }} \
            wait
          {{- if .n }} \
            -n {{ .n | quote }}
          {{- end }} \
            {{ .resource | quote }}
          {{- if .name }} \
            {{ .name | quote }}
          {{- end }}
          {{- if .selector }} \
            -l {{ .selector | quote }}
          {{- end }} \
            --for={{ .for | quote }} \
            --timeout={{ .timeout | quote }}

  wait-for-pod:
    desc: "Wait for pod condition"
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      for: '{{ .for | default "condition=ready" }}'
      n: '{{ .n }}'
      k: '{{ .k }}'
      v: '{{ .v }}'
      timeout: '{{ .timeout | default .KUBECTL_TIMEOUT }}'
    cmds:
      - task: wait
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
          n: '{{ .n }}'
          resource: pod
          selector: '{{ .k }}={{ .v }}'
          for: '{{ .for }}'
          timeout: '{{ .timeout }}'

  wait-for-pod-ready:
    desc: "Wait for pod to be ready"
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: '{{ .n }}'
      k8s_app: '{{ .k8s_app }}'
      timeout: '{{ .timeout | default .KUBECTL_TIMEOUT }}'
    cmds:
      - task: wait-for-pod
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
          for: condition=ready
          n: '{{ .n }}'
          k: k8s-app
          v: '{{ .k8s_app }}'
          timeout: '{{ .timeout }}'

  wait-for-deployment:
    desc: "Wait for deployment to be ready"
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: '{{ .n }}'
      name: '{{ .name }}'
      timeout: '{{ .timeout | default .KUBECTL_TIMEOUT }}'
    cmds:
      - task: wait
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
          n: '{{ .n }}'
          resource: deployment
          name: '{{ .name }}'
          for: condition=available
          timeout: '{{ .timeout }}'

  rollout-status:
    desc: "Check rollout status"
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: '{{ .n }}'
      resource: '{{ .resource | default "deployment" }}'
      name: '{{ .name }}'
      timeout: '{{ .timeout | default .KUBECTL_TIMEOUT }}'
    cmds:
      - task: _require-context
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
      - |
          kubectl \
            --kubeconfig {{ .kubeconfig | quote }} \
            --context {{ .kube_context | quote }} \
            rollout status
          {{- if .n }} \
            -n {{ .n | quote }}
          {{- end }} \
            {{ .resource }}/{{ .name }} \
            --timeout={{ .timeout | quote }}

  rollout-restart:
    desc: "Restart a rollout"
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: '{{ .n }}'
      resource: '{{ .resource | default "deployment" }}'
      name: '{{ .name }}'
    cmds:
      - task: _require-context
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
      - |-
        kubectl \
          --kubeconfig {{ .kubeconfig | quote }} \
          --context {{ .kube_context | quote }} \
          rollout restart
        {{- if .n }} \
          -n {{ .n | quote }}
        {{- end }} \
          {{ .resource }}/{{ .name }}

  scale:
    desc: "Scale a resource"
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: '{{ .n }}'
      resource: '{{ .resource | default "deployment" }}'
      name: '{{ .name }}'
      replicas: '{{ .replicas }}'
    cmds:
      - task: _require-context
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
      - |-
        kubectl \
          --kubeconfig {{ .kubeconfig | quote }} \
          --context {{ .kube_context | quote }} \
          scale
        {{- if .n }} \
          -n {{ .n | quote }}
        {{- end }} \
          {{ .resource }}/{{ .name }} \
          --replicas={{ .replicas }}
  exec:
    desc: "Execute command in pod"
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: '{{ .n }}'
      pod: '{{ .pod }}'
      container: '{{ .container }}'
      cmd: '{{ .cmd | default "sh" }}'
      interactive: '{{ .interactive | default "true" }}'
    cmds:
      - task: _require-context
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
      - |-
          kubectl \
            --kubeconfig {{ .kubeconfig | quote }} \
            --context {{ .kube_context | quote }} \
            exec
          {{- if .n }} \
            -n {{ .n | quote }}
          {{- end }}
          {{- if .container }} \
            -c {{ .container | quote }}
          {{- end }}
          {{- if eq .interactive "true" }} \
            -it
          {{- end }} \
            {{ .pod | quote }} -- {{ .cmd }}

  logs:
    desc: "Get pod logs"
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: '{{ .n }}'
      pod: '{{ .pod }}'
      container: '{{ .container }}'
      follow: '{{ .follow | default "false" }}'
      tail: '{{ .tail }}'
      since: '{{ .since }}'
    cmds:
      - task: _require-context
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
      - |
          kubectl \
            --kubeconfig {{ .kubeconfig | quote }} \
            --context {{ .kube_context | quote }} \
            logs
          {{- if .n }} \
            -n {{ .n | quote }}
          {{- end }}
          {{- if .container }} \
            -c {{ .container | quote }}
          {{- end }}
          {{- if eq .follow "true" }} \
            -f
          {{- end }}
          {{- if .tail }} \
            --tail={{ .tail }}
          {{- end }}
          {{- if .since }} \
            --since={{ .since }}
          {{- end }} \
            {{ .pod | quote }}

  port-forward:
    desc: "Forward ports to a pod"
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: '{{ .n }}'
      resource: '{{ .resource | default "pod" }}'
      name: '{{ .name }}'
      ports: '{{ .ports }}'
    cmds:
      - task: _require-context
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
      - kubectl \
          --kubeconfig {{ .kubeconfig | quote }} \
          --context {{ .kube_context | quote }} \
          port-forward
        {{- if .n }} \
          -n {{ .n | quote }}
        {{- end }} \
          {{ .resource }}/{{ .name }} \
          {{ .ports }}
