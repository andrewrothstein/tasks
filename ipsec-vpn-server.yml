---
version: '3'
includes:
  repo: taskmedia-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: ipsec-vpn-server
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    internal: true
    vars:
      chart_repo_name: taskmedia
      chart: ipsec-vpn-server
      chart_ver: 2.1.2
      namespace: ipsec-vpn-server
      name: ipsec-vpn-server
#      helm_args: -f ipsec-vpn-server-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
