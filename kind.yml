---
version: '3'
tasks:
  up:
    vars:
      n: '{{ .n | default "kind" }}'
      f: '{{ .f }}'
      disableDefaultCNI: '{{ .disableDefaultCNI | default "false" }}'
      kubeProxyMode: '{{ .kubeProxyMode }}'
    cmds:
      - |
        helm template chart-kind
          {{- if .f }} \
          -f {{ .f | quote }}
          {{- end }}
          {{- if .disableDefaultCNI }} \
          --set disableDefaultCNI={{ .disableDefaultCNI | quote }}
          {{- end }}
          {{- if .kubeProxyMode }} \
          --set kubeProxyMode={{ .kubeProxyMode | quote }}
          {{- end }} \
          | kind create cluster \
             -n {{ .n | quote }} \
             --config=-
    status:
      - kind get kubeconfig -n {{ .n | quote }}
  delete:
    vars:
      n: '{{ .n | default "kind" }}'
    cmds:
      - kind delete clusters {{ .n | quote }}
  check:
    cmds: []
