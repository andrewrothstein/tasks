---
version: '3'
vars:
  keda: keda
  vpa: pet
includes:
  keda:
    taskfile: '{{ .keda }}.yml'

  vpa:
    taskfile: '{{ .vpa }}.yml'

tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: keda:upgrade
      - task: vpa:upgrade
  delete:
    cmds:
      - task: vpa:delete
      - task: keda:delete
  check:
    cmds:
      - task: keda:check
      - task: vpa:check
