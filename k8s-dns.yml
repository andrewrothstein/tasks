---
version: '3'
includes:
#  coredns: coredns.yml
  coredns: pet.yml

#  external-dns: bitnami-external-dns.yml
  external-dns: pet.yml
tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: coredns:upgrade
      - task: external-dns:upgrade
  delete:
    cmds:
      - task: external-dns:delete
      - task: coredns:delete
  check:
    cmds:
      - task: coredns:check
      - task: external-dns:check
