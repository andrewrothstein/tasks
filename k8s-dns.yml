---
version: '3'
vars:
  coredns: pet
  external_dns: external-dns
includes:
  coredns:
    taskfile: '{{ .coredns }}.yml'

  external-dns:
    taskfile: '{{ .external_dns }}.yml'
tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: coredns:upgrade
      - task: external-dns:upgrade
  delete:
    cmds:
      - task: external-dns:delete
      - task: coredns:delete
  check:
    cmds:
      - task: coredns:check
      - task: external-dns:check
