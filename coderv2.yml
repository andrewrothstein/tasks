---
version: '3'
includes:
  kk:
    taskfile: kubectl.yml
    vars:
      n: coder
#      labels: istio.io/dataplane-mode=ambient
  coderv2-secret:
    taskfile: k8s-literal-secret.yml
    vars:
      n: coder
      s: coder-db-url
  postgresql:
    taskfile: bitnami-postgresql.yml
    vars:
      namespace: coder
  repo: coderv2-repo.yml
  coderv2:
    taskfile: helm.yml
    vars:
      chart_repo_name: coder-v2
      chart: coder
      chart_ver: 2.18.2
      name: coder
      namespace: coder
      helm_args: -f coderv2-values.yml
tasks:
  test-secrets:
    vars:
      admin_password: '{{ .admin_password | default "${CODERV2_POSTGRESQL_PASSWORD}" }}'
    cmds:
      - test {{ .admin_password }}
  default:
    deps:
      - task: upgrade
  upgrade:
    vars:
      admin_username: '{{ .admin_username | default "coder" }}'
      admin_db: '{{ .admin_db | default "coder" }}'
      admin_password: '{{ .admin_password | default "${CODERV2_POSTGRESQL_PASSWORD}" }}'
      db_size: '{{ .db_size | default "10gi" }}'
    deps:
      - task: repo
    cmds:
      - task: test-secrets
        vars:
          admin_password: '{{ .admin_password }}'
      - task: kk:ns-create
      - task: kk:ns-label
      - task: postgresql:upgrade
        vars:
          admin_username: '{{ .admin_username }}'
          admin_password: '{{ .admin_password }}'
          admin_db: '{{ .admin_db }}'
          db_size: '{{ .db_size }}'
      - task: coderv2-secret:create
        vars:
          args: >-
            --from-literal=url="postgres://{{ .admin_username }}:{{ .admin_password }}@postgresql:5432/{{ .admin_db }}?sslmode=disable"
      - task: coderv2:upgrade
        vars:
  delete:
    cmds:
      - task: coderv2:delete
      - task: coderv2-secret:delete
      - task: postgresql:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: postgresql:check
      - task: coderv2:check
