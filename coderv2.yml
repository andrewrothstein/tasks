---
version: '3'
includes:
  kk:
    taskfile: kubectl.yml
    vars:
      n: coder
#      labels: istio.io/dataplane-mode=ambient
  pg-secret:
    taskfile: k8s-literal-secret.yml
    vars:
      n: coder
      s: coder-pg-user
  repo: coderv2-repo.yml
  pg:
    taskfile: helm.yml
    vars:
      namespace: coder
      name: coder-pg
      chart: chart-cnpg-instance
      helm_args: >-
        --set instances=1
        --set storage.size=10Gi
        --set bootstrap.initdb.database=coder
        --set bootstrap.initdb.owner=coder
        --set bootstrap.initdb.secret.name=coder-pg-user
  coderv2:
    taskfile: helm.yml
    vars:
      chart_repo_name: coder-v2
      chart: coder
      chart_ver: 2.30.0
      name: coder
      namespace: coder
      helm_args: -f coderv2-values.yml
  ingress:
    taskfile: tailscale-ingress.yml
    vars:
      namespace: coder
      name: tailscale-ingress
      helm_args: -f coderv2-tailscale-ingress-values.yml
tasks:
  pg-wait:
    vars:
      cluster_name: coder-pg-chart-cnpg-instance
    cmds:
      - >-
        kubectl wait clusters.postgresql.cnpg.io/{{ .cluster_name }}
        -n coder
        --for=condition=Ready
        --timeout=10m
  test-secrets:
    vars:
      admin_password: '{{ .admin_password | default "${CODERV2_POSTGRESQL_PASSWORD}" }}'
    cmds:
      - test {{ .admin_password }}
  default:
    deps:
      - task: upgrade
  upgrade:
    vars:
      admin_username: '{{ .admin_username | default "coder" }}'
      admin_password: '{{ .admin_password | default "${CODERV2_POSTGRESQL_PASSWORD}" }}'
    deps:
      - task: repo
    cmds:
      - task: test-secrets
        vars:
          admin_password: '{{ .admin_password }}'
      - task: kk:ns-create
      - task: pg-secret:create
        vars:
          args: >-
            --from-literal=username={{ .admin_username }}
            --from-literal=password={{ .admin_password }}
      - task: pg:upgrade
      - task: pg-wait
      - task: coderv2:upgrade
      - task: ingress:upgrade
  delete:
    cmds:
      - task: ingress:delete
      - task: coderv2:delete
      - task: pg:delete
      - task: pg-secret:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: coderv2:check
