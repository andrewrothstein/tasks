---
version: '3'
includes:
  repo: csi-driver-nfs-repo.yml
  helm:
    taskfile: helm.yml
    internal: true
    vars:
      chart_repo_name: csi-driver-nfs
      chart: csi-driver-nfs
      chart_ver: 4.12.0
      namespace: kube-system
      name: csi-driver-nfs
      helm_args: >-
        -f csi-driver-nfs-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
