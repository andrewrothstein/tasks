---
version: '3'
includes:
  repo: artifacthub-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: artifact-hub
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: artifact-hub
      chart: artifact-hub
      chart_ver: 1.20.0
      namespace: artifact-hub
      name: artifact-hub
      helm_args: -f artifacthub-values.yml
  ingress:
    taskfile: tailscale-ingress.yml
    vars:
      namespace: artifact-hub
      name: tailscale-ingress
      helm_args: -f artifacthub-tailscale-ingress-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: helm:upgrade
      - task: ingress:upgrade
  delete:
    cmds:
      - task: ingress:delete
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
