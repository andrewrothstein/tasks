---
version: '3'
vars:
  VALKEY_NAMESPACE: '{{ .VALKEY_NAMESPACE | default "valkey" }}'
  VALKEY_NAME: '{{ .VALKEY_NAME | default "valkey" }}'
  VALKEY_VERSION: 0.9.4
includes:
  repo: valkey-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
  helm:
    taskfile: helm.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
        vars:
          n: '{{ .VALKEY_NAMESPACE }}'
          labels: 'istio.io/dataplane-mode=ambient'
      - task: helm:upgrade
        vars:
          chart_repo_name: valkey
          chart: valkey
          chart_ver: '{{ .VALKEY_VERSION }}'
          namespace: '{{ .VALKEY_NAMESPACE }}'
          name: '{{ .VALKEY_NAME }}'
  delete:
    cmds:
      - task: helm:delete
        vars:
          namespace: '{{ .VALKEY_NAMESPACE }}'
          name: '{{ .VALKEY_NAME }}'
      - task: kk:ns-delete
        vars:
          n: '{{ .VALKEY_NAMESPACE }}'
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
        vars:
          chart_repo_name: valkey
          chart: valkey
          chart_ver: '{{ .VALKEY_VERSION }}'
