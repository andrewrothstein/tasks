---
version: '3'
includes:
  repo: valkey-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: valkey
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: valkey
      chart: valkey
      chart_ver: 0.9.3
      namespace: valkey
      name: valkey
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
