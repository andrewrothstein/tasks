---
version: '3'
includes:
  ss-csi: secrets-store-csi-driver.yml
  repo:
    taskfile: helm-repo.yml
    vars:
      n: hashicorp
      url: https://helm.releases.hashicorp.com
  kk:
    taskfile: kubectl.yml
    vars:
      n: vault-system
      labels: istio.io/dataplane-mode=ambient
  vault-secrets-operator:
    taskfile: helm.yml
    vars:
      chart_repo_name: hashicorp
      chart: vault-secrets-operator
      chart_ver: 1.1.0
      namespace: vault-system
      name: secrets-operator
  vault:
    taskfile: helm.yml
    vars:
      chart_repo_name: hashicorp
      chart: vault
      chart_ver: 0.31.0
      namespace: vault-system
      name: vault
      server_side: 'false'
  ingress:
    taskfile: helm.yml
    vars:
      chart: chart-tailscale-ingress
      namespace: vault-system
      name: tailscale-ingress
      helm_args: -f vault-tailscale-ingress-values.yml
tasks:
  test-secrets:
    vars:
      root_token: '{{ .root_token | default "${VAULT_ROOT_TOKEN}" }}'
    cmds:
      - test {{ .root_token | quote }}
  upgrade:
    vars:
      root_token: '{{ .root_token | default "${VAULT_ROOT_TOKEN}" }}'
    deps:
      - task: ss-csi:upgrade
    cmds:
      - task: repo:add
      - task: kk:ns-create
      - task: vault-secrets-operator:upgrade
      - task: test-secrets
        vars:
          root_token: '{{ .root_token }}'
      - task: vault:upgrade
        vars:
          helm_args: >-
            -f vault-values.yml
            --set server.dev.devRootToken={{ .root_token | quote }}
      - task: ingress:upgrade
  default:
    deps:
      - upgrade
  check:
    deps:
      - task: repo:add
    cmds:
      - task: ss-csi:check
      - task: vault-secrets-operator:check
      - task: vault:check
  delete:
    cmds:
      - task: ingress:delete
      - task: vault:delete
      - task: vault-secrets-operator:delete
      - task: ss-csi:delete
