---
version: '3'
vars:
  gitea: pet
  gitlab: pet
  artifacthub: pet
  sonarqube: pet
  harbor: pet
  opencost: pet
includes:
  gitea:
    taskfile: '{{ .gitea }}.yml'

  gitlab:
    taskfile: '{{ .gitlab }}.yml'

  artifacthub:
    taskfile: '{{ .artifacthub }}.yml'

  sonarqube:
    taskfile: '{{ .sonarqube }}.yml'

  harbor:
    taskfile: '{{ .harbor }}.yml'

  opencost:
    taskfile: '{{ .opencost }}.yml'

tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: gitea:upgrade
      - task: gitlab:upgrade
      - task: artifacthub:upgrade
      - task: sonarqube:upgrade
      - task: harbor:upgrade
      - task: opencost:upgrade
  delete:
    cmds:
      - task: opencost:delete
      - task: harbord:delete
      - task: sonarqube:delete
      - task: artifacthub:delete
      - task: gitlab:delete
      - task: gitea:delete
  check:
    cmds:
      - task: gitea:check
      - task: gitlab:check
      - task: artifacthub:check
      - task: sonarqube:check
      - task: harbor:check
      - task: opencost:check
