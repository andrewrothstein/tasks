---
version: '3'
includes:
  kk:
    taskfile: kubectl.yml
    vars:
      n: artifactory
      labels: 'istio.io/dataplane-mode=ambient'
  pg-secret:
    taskfile: k8s-literal-secret.yml
    vars:
      n: artifactory
      s: artifactory-pg-user
  pg:
    taskfile: helm.yml
    vars:
      namespace: artifactory
      name: artifactory-pg
      chart: chart-cnpg-instance
      helm_args: >-
        --set instances=1
        --set storage.size=10Gi
        --set bootstrap.initdb.database=artifactory
        --set bootstrap.initdb.owner=artifactory
        --set bootstrap.initdb.secret.name=artifactory-pg-user
  repo: jfrog-repo.yml
  helm:
    taskfile: helm.yml
    internal: true
    vars:
      namespace: artifactory
      name: artifactory
      chart_repo_name: jfrog
      chart: artifactory-oss
      chart_ver: 107.133.15
  ingress:
    taskfile: tailscale-ingress.yml
    vars:
      namespace: artifactory
      name: tailscale-ingress
      helm_args: -f artifactory-tailscale-ingress-values.yml
  secrets:
    taskfile: k8s-literal-secret.yml
    vars:
      n: artifactory
tasks:
  default:
    deps:
      - upgrade
  pg-wait:
    vars:
      cluster_name: artifactory-pg-chart-cnpg-instance
    cmds:
      - >-
        kubectl wait clusters.postgresql.cnpg.io/{{ .cluster_name }}
        -n artifactory
        --for=condition=Ready
        --timeout=10m
  test-secrets:
    vars:
      pgAdminPassword: '{{ .pgAdminPassword | default "${ARTIFACTORY_POSTGRESQL_ADMIN_PASSWORD}" }}'
      masterKey: '{{ .masterKey | default "${ARTIFACTORY_MASTER_KEY}" }}'
      joinKey: '{{ .joinKey | default "${ARTIFACTORY_JOIN_KEY}" }}'
      adminPassword: '{{ .adminPassword | default "${ARTIFACTORY_ADMIN_PASSWORD}" }}'
    cmds:
      - test {{ .pgAdminPassword | quote }}
      - test {{ .masterKey | quote }}
      - test {{ .joinKey | quote }}
      - test {{ .adminPassword | quote }}
  upgrade:
    vars:
      pgAdminPassword: '{{ .pgAdminPassword | default "${ARTIFACTORY_POSTGRESQL_ADMIN_PASSWORD}" }}'
      masterKey: '{{ .masterKey | default "${ARTIFACTORY_MASTER_KEY}" }}'
      masterKeySecretName: '{{ .masterKeySecretName | default "master-key" }}'
      joinKey: '{{ .joinKey | default "${ARTIFACTORY_JOIN_KEY}" }}'
      joinKeySecretName: '{{ .joinKeySecretName | default "join-key" }}'
      adminPassword: '{{ .adminPassword | default "${ARTIFACTORY_ADMIN_PASSWORD}" }}'
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: test-secrets
        vars:
          pgAdminPassword: '{{ .pgAdminPassword }}'
          masterKey: '{{ .masterKey }}'
          joinKey: '{{ .joinKey }}'
          adminPassword: '{{ .adminPassword }}'
      - task: pg-secret:create
        vars:
          args: >-
            --from-literal=username=artifactory
            --from-literal=password={{ .pgAdminPassword }}
      - task: pg:upgrade
      - task: pg-wait
      - task: secrets:create
        vars:
          s: '{{ .masterKeySecretName }}'
          args: --from-literal master-key={{ .masterKey | quote }}
      - task: secrets:create
        vars:
          s: '{{ .joinKeySecretName }}'
          args: --from-literal join-key={{ .joinKey | quote }}
      - task: helm:upgrade
        vars:
          helm_args: |-
            -f artifactory-values.yml \
              --set artifactory.database.password={{ .pgAdminPassword | quote }} \
              --set artifactory.masterKeySecretName={{ .masterKeySecretName | quote }} \
              --set artifactory.joinKeySecretName={{ .joinKeySecretName | quote }} \
              --set artifactory.artifactory.admin.password={{ .adminPassword | quote }}
      - task: ingress:upgrade
  delete:
    cmds:
      - task: ingress:delete
      - task: helm:delete
      - task: pg:delete
      - task: pg-secret:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
