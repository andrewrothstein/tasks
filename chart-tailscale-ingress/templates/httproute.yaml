{{- $fullname := include "tailscale-ingress.fullname" . }}
{{- $labels := include "tailscale-ingress.labels" . }}
{{- range $g := .Values.gateways }}
{{- if ($g.enabled | default true) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}-{{ $g.name }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $fullname }}-{{ $g.name }}
  rules:
    {{- range $g.routes }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .path }}
      backendRefs:
        - name: {{ .service.name }}
          port: {{ .service.port.number }}
    {{- end }}
{{- end }}
{{- end }}
