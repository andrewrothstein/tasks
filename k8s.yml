---
version: '3'

vars:
  CLUSTER_PROVIDER: '{{ .CLUSTER_PROVIDER | default "kind+cilium" }}'
  CLUSTER_TYPE: '{{ .CLUSTER_TYPE | default "ephemeral" }}'
  CLUSTER_NAME: '{{ .CLUSTER_NAME | default "default" }}'

includes:
  k3d: k3d.yml
  kind: kind.yml
  kind+cilium: kind+cilium.yml
  kind+spegel: kind+spegel.yml
  kind+registry: kind+registry.yml
  kind+calico: kind+calico.yml
  kind+antrea: kind+antrea.yml
  byo-cluster: byo-cluster.yml  # For externally managed clusters
  metrics-server: metrics-server.yml
  bootstrap: cluster-bootstrap.yml
#  metrics-server: pet.yml
#  k8s: k3d.yml
  kubectl-config: kubectl-config.yml
tasks:
  kind-up:
    cmds:
      - task: '{{ .CLUSTER_PROVIDER }}:up'

  up:
    desc: "Create cluster (GitOps handles app deployment)"
    cmds:
      - task: '{{ .CLUSTER_PROVIDER }}:up'

  delete:
    cmds:
      - task: '{{ .CLUSTER_PROVIDER }}:delete'

  destroy:
    cmds:
      - task: '{{ .CLUSTER_PROVIDER }}:destroy'

  default:
    deps:
      - up

  check:
    cmds:
      - task: '{{ .CLUSTER_PROVIDER }}:check'

  # Cluster switching helpers
  switch:
    desc: "Switch to a different cluster"
    cmds:
      - task: kubectl-config:switch
        vars:
          cluster: '{{ .cluster }}'

  list-clusters:
    desc: "List available cluster configs"
    cmds:
      - task: kubectl-config:list

  current:
    desc: "Show current cluster"
    cmds:
      - task: kubectl-config:current

  # BYO cluster helpers
  use-harvester:
    desc: "Switch to Harvester cluster"
    cmds:
      - task: kubectl-config:switch
        vars:
          cluster: harvester
      - echo "Switched to Harvester cluster"
      - echo "Using BYO cluster mode - create/delete are no-ops"

  use-k3s:
    desc: "Switch to K3s cluster"
    cmds:
      - task: kubectl-config:switch
        vars:
          cluster: k3s
      - echo "Switched to K3s cluster"
      - echo "Using BYO cluster mode - create/delete are no-ops"

  use-local:
    desc: "Switch back to local Kind/K3d cluster"
    cmds:
      - task: kubectl-config:switch
        vars:
          cluster: '{{ .cluster | default "kind" }}'
      - 'echo "Switched to local cluster: {{ .cluster | default "kind" }}"'

  # GitOps bootstrapping (Flux → ArgoCD → ApplicationSets)
  bootstrap:
    desc: "Bootstrap cluster with GitOps (Flux → ArgoCD)"
    vars:
      type: '{{ .type | default .CLUSTER_TYPE }}'
      name: '{{ .name | default .CLUSTER_NAME }}'
    cmds:
      - task: bootstrap:bootstrap
        vars:
          type: '{{ .type }}'
          name: '{{ .name }}'

  sync:
    desc: "Sync cluster with GitOps repo"
    cmds:
      - task: bootstrap:sync

  cluster-info:
    desc: "Show cluster classification and bootstrap status"
    cmds:
      - task: bootstrap:info

  argocd-ui:
    desc: "Open ArgoCD UI"
    cmds:
      - task: bootstrap:argocd-ui
