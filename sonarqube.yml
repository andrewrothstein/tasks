---
version: '3'
includes:
  repo: sonarqube-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: sonarqube
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    internal: true
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: sonarqube
      chart_repo_name: sonarqube
      chart: sonarqube
      name: sonarqube
      chart_ver: 2026.1.0
  ingress:
    taskfile: tailscale-ingress.yml
    vars:
      namespace: sonarqube
      name: tailscale-ingress
      helm_args: -f sonarqube-tailscale-ingress-values.yml
tasks:
  default:
    deps:
      - upgrade
  test-secrets:
    vars:
      monitoringPasscode: '{{ .monitoringPasscode | default "${SONARQUBE_MONITORING_PASSCODE}" }}'
    cmds:
      - test {{ .monitoringPasscode | quote }}
  upgrade:
    vars:
      monitoringPasscode: '{{ .monitoringPasscode | default "${SONARQUBE_MONITORING_PASSCODE}" }}'
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: test-secrets
        vars:
          monitoringPasscode: '{{ .monitoringPasscode }}'
      - task: helm:upgrade
        vars:
          helm_args: >-
            --set edition=developer
            --set monitoringPasscode={{ .monitoringPasscode | quote }}

      - task: ingress:upgrade
  delete:
    cmds:
      - task: ingress:delete
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
