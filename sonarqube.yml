---
version: '3'
includes:
  repo: sonarqube-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: sonarqube
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    internal: true
    vars:
      namespace: sonarqube
      chart_repo_name: sonarqube
      chart: sonarqube
      name: sonarqube
      chart_ver: 10.8.1
#      helm_args: -f sonarqube-values.yml
  ingress:
    taskfile: helm.yml
    vars:
      chart: chart-tailscale-ingress
      namespace: sonarqube
      name: tailscale-ingress
      helm_args: -f sonarqube-tailscale-ingress-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: helm:upgrade
      - task: ingress:upgrade
  delete:
    cmds:
      - task: ingress:delete
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
