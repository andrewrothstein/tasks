---
version: '3'
vars:
  qdrant: pet
  k8sgpt: pet
  milvus: pet
  mlflow: pet
  open_webui: open-webui
  kubeai: pet
  weaviate: pet
  litellm_operator: litellm-operator
  litellm_instance: litellm-instance
includes:
  qdrant:
    taskfile: '{{ .qdrant }}.yml'

  k8sgpt:
    taskfile: '{{ .k8sgpt }}.yml'

  milvus:
    taskfile: '{{ .milvus }}.yml'

  mlflow:
    taskfile: '{{ .mlflow }}.yml'

  open-webui:
    taskfile: '{{ .open_webui }}.yml'

  kubeai:
    taskfile: '{{ .kubeai }}.yml'

  weaviate:
    taskfile: '{{ .weaviate }}.yml'

  litellm-operator:
    taskfile: '{{ .litellm_operator }}.yml'

  litellm-instance:
    taskfile: '{{ .litellm_instance }}.yml'
tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: litellm-operator:upgrade
      - task: litellm-instance:upgrade
      - task: qdrant:upgrade
      - task: k8sgpt:upgrade
      - task: milvus:upgrade
      - task: mlflow:upgrade
      - task: open-webui:upgrade
      - task: kubeai:upgrade
      - task: weaviate:upgrade
  delete:
    cmds:
      - task: weaviate:delete
      - task: kubeai:delete
      - task: open-webui:delete
      - task: mlflow:delete
      - task: milvus:delete
      - task: k8sgpt:delete
      - task: litellm-instance:delete
      - task: litellm-operator:delete
      - task: qdrant:delete
  check:
    cmds:
      - task: litellm-operator:check
      - task: litellm-instance:check
      - task: qdrant:check
      - task: k8sgpt:check
      - task: milvus:check
      - task: mlflow:check
      - task: open-webui:check
      - task: kubeai:check
      - task: weaviate:check
