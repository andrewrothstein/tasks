---
version: '3'
includes:
#  qdrant: qdrant.yml
  qdrant: pet.yml

#  k8sgpt: k8sgpt.yml
  k8sgpt: pet.yml

#  milvus: milvus.yml
  milvus: pet.yml

#  mlflow: mlflow.yml
  mlflow: pet.yml

  open-webui: open-webui.yml
#  open-webui: pet.yml

#  kubeai: kubeai.yml
  kubeai: pet.yml

#  weaviate: weaviate-helm.yml
  weaviate: pet.yml

  litellm-operator: litellm-operator.yml
#  litellm-operator: pet.yml

  litellm-instance: litellm-instance.yml
#  litellm-instance: pet.yml
tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: litellm-operator:upgrade
      - task: litellm-instance:upgrade
      - task: qdrant:upgrade
      - task: k8sgpt:upgrade
      - task: milvus:upgrade
      - task: mlflow:upgrade
      - task: open-webui:upgrade
      - task: kubeai:upgrade
      - task: weaviate:upgrade
  delete:
    cmds:
      - task: weaviate:delete
      - task: kubeai:delete
      - task: open-webui:delete
      - task: mlflow:delete
      - task: milvus:delete
      - task: k8sgpt:delete
      - task: litellm-instance:delete
      - task: litellm-operator:delete
      - task: qdrant:delete
  check:
    cmds:
      - task: litellm-operator:check
      - task: litellm-instance:check
      - task: qdrant:check
      - task: k8sgpt:check
      - task: milvus:check
      - task: mlflow:check
      - task: open-webui:check
      - task: kubeai:check
      - task: weaviate:check
