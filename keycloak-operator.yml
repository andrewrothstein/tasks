---
version: '3'
vars:
  KEYCLOAK_OPERATOR_DEFAULT_VER: 26.5.2
  KEYCLOAK_OPERATOR_MIRROR: https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources
  KEYCLOAK_OPERATOR_CRD1: kubernetes/keycloaks.k8s.keycloak.org-v1.yml
  KEYCLOAK_OPERATOR_CRD2: kubernetes/keycloakrealmimports.k8s.keycloak.org-v1.yml
  KEYCLOAK_OPERATOR_OPERATOR: kubernetes/kubernetes.yml
includes:
  kk:
    internal: true
    taskfile: kubectl.yml
    vars:
      n: keycloak-operator
      labels: istio.io/dataplane-mode=ambient
  gh:
    taskfile: gh.yml
    vars:
      org: keycloak
      repo: keycloak-k8s-resources
      current_ver: '{{ .KEYCLOAK_OPERATOR_DEFAULT_VER }}'
tasks:
  default:
    cmds:
      - task: apply
  help-apply:
    internal: true
    vars:
      mirror: '{{ .mirror | default .KEYCLOAK_OPERATOR_MIRROR }}'
      ver: '{{ .ver | default .KEYCLOAK_OPERATOR_DEFAULT_VER }}'
      f: '{{ .f }}'
    cmds:
      - task: kk:apply
        vars:
          f: '{{ .mirror }}/{{ .ver }}/{{ .f }}'
  apply:
    cmds:
      - task: kk:ns-create
      - task: help-apply
        vars:
          f: '{{ .KEYCLOAK_OPERATOR_CRD1 }}'
      - task: help-apply
        vars:
          f: '{{ .KEYCLOAK_OPERATOR_CRD2 }}'
      - task: help-apply
        vars:
          f: '{{ .KEYCLOAK_OPERATOR_OPERATOR }}'
  help-delete:
    internal: true
    vars:
      mirror: '{{ .mirror | default .KEYCLOAK_OPERATOR_MIRROR }}'
      ver: '{{ .ver | default .KEYCLOAK_OPERATOR_DEFAULT_VER }}'
      f: '{{ .f }}'
    cmds:
      - task: kk:delete
        vars:
          f: '{{ .mirror }}/{{ .ver }}/{{ .f }}'
  delete:
    cmds:
      - task: help-delete
        vars:
          f: '{{ .KEYCLOAK_OPERATOR_OPERATOR }}'
      - task: help-delete
        vars:
          f: '{{ .KEYCLOAK_OPERATOR_CRD2 }}'
      - task: help-delete
        vars:
          f: '{{ .KEYCLOAK_OPERATOR_CRD1 }}'
      - task: kk:ns-delete
  check:
    cmds:
      - task: gh:check
