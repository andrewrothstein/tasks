---
version: '3'
includes:
  repo: apache-airflow-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: airflow
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      chart_repo_name: apache-airflow
      chart: airflow
      chart_ver: 1.16.0
      namespace: airflow
      name: apache-airflow
  ingress:
    taskfile: tailscale-ingress.yml
    vars:
      namespace: airflow
      name: airflow-ui-tailscale-ingress
      helm_args: -f airflow-ui-tailscale-ingress-values.yml
tasks:
  default:
    deps:
      - upgrade
  test-secrets:
    vars:
      admin_password: '{{ .admin_password | default "${AIRFLOW_ADMIN_PASSWORD}" }}'
      webserver_secret_key: '{{ .webserver_secret_key | default "${AIRFLOW_WEBSERVER_SECRET_KEY}" }}'
    cmds:
      - test {{ .admin_password | quote }}
      - test {{ .webserver_secret_key | quote }}
  upgrade:
    vars:
      admin_password: '{{ .admin_password | default "${AIRFLOW_ADMIN_PASSWORD}" }}'
      webserver_secret_key: '{{ .webserver_secret_key | default "${AIRFLOW_WEBSERVER_SECRET_KEY}" }}'
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: test-secrets
        vars:
          admin_password: '{{ .admin_password }}'
          webserver_secret_key: '{{ .webserver_secret_key }}'
      - task: helm:upgrade
        vars:
          helm_args: |-
            \
              -f apache-airflow-values.yml \
              --set webserver.defaultUser.password={{ .admin_password | quote }} \
              --set webserverSecretKey={{ .webserver_secret_key | quote }}
      - task: ingress:upgrade
  delete:
    cmds:
      - task: ingress:delete
      - task: helm:delete
      - task: kk:ns-delete
  check:
    cmds:
      - task: helm:check
