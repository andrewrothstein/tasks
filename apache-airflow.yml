---
version: '3'
includes:
  repo: apache-airflow-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: airflow
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: apache-airflow
      chart: airflow
      chart_ver: 1.15.0
      namespace: airflow
      name: apache-airflow
      helm_args: -f apache-airflow-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    cmds:
      - task: helm:check
