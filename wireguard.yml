---
version: '3'
includes:
  repo: wireguard-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: wireguard
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    internal: true
    vars:
      namespace: wireguard
      name: wireguard
      chart_repo_name: wireguard
      chart: wireguard
      chart_ver: 0.26.0
#      helm_args: -f wireguard-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
