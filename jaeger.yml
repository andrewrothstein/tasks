---
version: '3'
includes:
  repo: jaeger-repo.yml
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: jaegertracing
      chart: jaeger
      chart_ver: 4.1.5
      name: jaeger
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
