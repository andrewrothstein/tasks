---
version: '3'
includes:
  kk:
    taskfile: kubectl.yml
    vars:
      n: jaeger
#      labels: 'istio.io/dataplane-mode=ambient'
      k: jaeger
  repo: jaeger-repo.yml
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: jaegertracing
      chart: jaeger
      chart_ver: 3.3.2
      namespace: jaeger
      name: jaeger
      helm_args: -f jaeger-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: kk:kapply
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:kdelete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
