---
version: '3'
includes:
  repo: minio-repo.yml
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: minio
      chart: tenant
      chart_ver: 7.1.1
tasks:
  default:
    deps:
      - upgrade
  test-secrets:
    vars:
      accessKey: '{{ .accessKey | default "${AWS_ACCESS_KEY}" }}'
      secretKey: '{{ .secretKey | default "${AWS_SECRET_KEY}" }}'
    cmds:
      - test {{ .accessKey | quote }}
      - test {{ .secretKey | quote }}
  upgrade:
    vars:
      name: '{{ .name }}'
      s: '{{ .s }}'
      accessKey: '{{ .accessKey | default "${AWS_ACCESS_KEY}" }}'
      secretKey: '{{ .secretKey | default "${AWS_SECRET_KEY}" }}'
      helm_args: '{{ .helm_args }}'
    deps:
      - task: repo
    cmds:
      - task: helm:upgrade
        vars:
          helm_args: |-
            --set tenant.name={{ .name | quote }} \
            --set tenant.configuration.name={{ .s | quote }} \
            --set tenant.configSecret.name={{ .s | quote }} \
            --set tenant.configSecret.accessKey={{ .accessKey }} \
            --set tenant.configSecret.secretKey={{ .secretKey }}
            {{- if .helm_args }} \
            {{ .helm_args }}
            {{- end }}
  delete:
    cmds:
      - task: helm:delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
