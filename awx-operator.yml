---
version: '3'
includes:
  repo: awx-operator-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: awx-operator
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      namespace: awx-operator
      name: awx-operator
      chart_repo_name: awx-operator
      chart: awx-operator
      chart_ver: 3.0.0
  ingress:
    taskfile: tailscale-ingress.yml
    vars:
      namespace: awx-operator
      name: tailscale-ingress
      helm_args: -f awx-tailscale-ingress-values.yml
  admin-password:
    taskfile: k8s-literal-secret.yml
    vars:
      n: awx-operator
tasks:
  default:
    deps:
      - upgrade
  test-secrets:
    vars:
      admin_password: '{{ .admin_password | default "${AWX_OPERATOR_ADMIN_PASSWORD}" }}'
    cmds:
      - test {{ .admin_password | quote }}
  upgrade:
    vars:
      admin_password: '{{ .admin_password | default "${AWX_OPERATOR_ADMIN_PASSWORD}" }}'
      admin_password_secret: '{{ .admin_password_secret | default "awx-admin-password" }}'
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: test-secrets
        vars:
          admin_password: '{{ .admin_password }}'
      - task: admin-password:create
        vars:
          s: '{{ .admin_password_secret }}'
          args: --from-literal password={{ .admin_password | quote }}
      - task: helm:upgrade
        vars:
          helm_args: >-
            -f awx-operator-values.yml
            --set AWX.spec.admin_password_secret={{ .admin_password_secret | quote }}
      - task: ingress:upgrade
  delete:
    cmds:
      - task: ingress:delete
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
