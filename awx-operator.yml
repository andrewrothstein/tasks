---
version: '3'
includes:
  repo: awx-operator-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: awx-operator
      k: awx
  helm:
    taskfile: helm.yml
    vars:
      namespace: awx-operator
      name: awx-operator
      chart_repo_name: awx-operator
      chart: awx-operator
      chart_ver: 2.19.1
      helm_args: -f awx-operator-values.yml
  admin-password:
    taskfile: k8s-literal-secret.yml
    vars:
      n: awx-operator
      s: awx-admin-password
tasks:
  default:
    deps:
      - upgrade
  show-admin-password:
    cmds:
      - task: admin-password:get
        vars:
          f: password
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: helm:upgrade
      - task: kk:kapply
  delete:
    cmds:
      - task: kk:kdelete
      - task: helm:delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
