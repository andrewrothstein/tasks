---
version: '3'
includes:
  repo: awx-operator-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: awx-operator
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      namespace: awx-operator
      name: awx-operator
      chart_repo_name: awx-operator
      chart: awx-operator
      chart_ver: 2.19.1
      helm_args: -f awx-operator-values.yml
  ingress:
    taskfile: helm.yml
    vars:
      chart: chart-tailscale-ingress
      namespace: awx-operator
      name: tailscale-ingress
      helm_args: -f awx-tailscale-ingress-values.yml
  admin-password:
    taskfile: k8s-literal-secret.yml
    vars:
      n: awx-operator
      s: awx-admin-password
tasks:
  default:
    deps:
      - upgrade
  show-admin-password:
    cmds:
      - task: admin-password:get
        vars:
          f: password
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: helm:upgrade
      - task: ingress:upgrade
  delete:
    cmds:
      - task: ingress:delete
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
