---
kubeProxyReplacement: true
k8sServiceHost: kind-control-plane
k8sServicePort: 6443
hostServices:
  enabled: false
externalIPs:
  enabled: true
nodePort:
  enabled: true
hostPort:
  enabled: true
image:
  pullPolicy: IfNotPresent
ipam:
  mode: kubernetes
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
    ingress:
      enabled: true
      className: tailscale
      hosts:
        - hubble
      tls:
        - hosts:
            - hubble
# to play nicely with istio ambient
socketLB:
  hostNamespaceOnly: true
cni:
  exclusive: false
