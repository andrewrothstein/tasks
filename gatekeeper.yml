---
version: '3'
includes:
  repo: gatekeeper-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: gatekeeper-system
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    internal: true
    vars:
      namespace: gatekeeper-system
      name: gatekeeper
      chart_repo_name: gatekeeper
      chart: gatekeeper
      chart_ver: 3.21.0
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
