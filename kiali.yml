---
version: '3'
includes:
  jaeger:
    taskfile: jaeger.yml
    vars:
      namespace: istio-system
  repo: kiali-repo.yml
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: kiali
      chart: kiali-operator
      chart_ver: 2.25.0
      create_namespace: 'true'
      namespace: kiali-operator
      name: kiali
      helm_args: -f kiali-values.yml
  ingress:
    taskfile: tailscale-ingress.yml
    vars:
      namespace: istio-system
      name: tailscale-ingress
      helm_args: -f kiali-tailscale-ingress-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    vars:
    deps:
      - task: repo
    cmds:
      - task: jaeger:upgrade
      - task: helm:upgrade
      - task: ingress:upgrade
  delete:
    cmds:
      - task: helm:delete
  check:
    deps:
      - task: repo
    cmds:
      - task: jaeger:check
      - task: helm:check
