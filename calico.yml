---
version: '3'
includes:
  repo: calico-repo.yml
  helm:
    taskfile: helm.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      chart_repo_name: projectcalico
      chart: tigera-operator
      chart_ver: v3.31.3
      create_namespace: 'true'
      namespace: tigera-operator
      name: calico
#      helm_args: -f calico-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
