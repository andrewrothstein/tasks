---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      # Pattern 1: Wildcard secrets - fetch all from Doppler project
      - name: all-secrets
        namespace: default
        dopplerProject: YOUR_PROJECT
        dopplerConfig: YOUR_CONFIG
        refreshInterval: 1m
      # Pattern 2: Namespace-specific secrets
      - name: argocd-secrets
        namespace: argocd
        dopplerProject: YOUR_PROJECT
        dopplerConfig: YOUR_CONFIG
        refreshInterval: 1m
        secretKeys:
          - ARGOCD_ADMIN_PASSWORD
      - name: monitoring-secrets
        namespace: monitoring
        dopplerProject: YOUR_PROJECT
        dopplerConfig: YOUR_CONFIG
        refreshInterval: 1m
        secretKeys:
          - GRAFANA_ADMIN_PASSWORD
          - PROMETHEUS_REMOTE_WRITE_PASSWORD
      # Pattern 3: App-specific secrets with transformations
      - name: database-secrets
        namespace: database
        dopplerProject: YOUR_PROJECT
        dopplerConfig: YOUR_CONFIG
        refreshInterval: 5m
        secretKeys:
          - POSTGRES_PASSWORD
          - REDIS_PASSWORD
          - MONGODB_PASSWORD
  template:
    metadata:
      name: 'externalsecret-{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/andrewrothstein/tasks
        targetRevision: HEAD
        path: argocd/external-secrets/{{name}}
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true