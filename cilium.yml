---
version: '3'
includes:
  repo: cilium-repo.yml
  helm:
    taskfile: helm.yml
    vars:
      namespace: kube-system
      name: cilium
      chart_repo_name: cilium
      chart: cilium
      chart_ver: 1.16.5
      helm_args: -f cilium-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
