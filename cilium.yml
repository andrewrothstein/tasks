---
version: '3'
includes:
  repo: cilium-repo.yml
  helm:
    taskfile: helm.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: kube-system
      name: cilium
      chart_repo_name: cilium
      chart: cilium
      chart_ver: 1.19.3
      helm_args: -f cilium-values.yml
  ingress:
    taskfile: tailscale-ingress.yml
    vars:
      namespace: kube-system
      name: hubble-tailscale-ingress
      helm_args: -f cilium-tailscale-ingress-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: helm:upgrade
      - task: ingress:upgrade
  delete:
    cmds:
      - task: ingress:delete
      - task: helm:delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
