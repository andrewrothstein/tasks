---
version: '3'
includes:
  kk:
    taskfile: kubectl.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: crossplane-aws
      k: crossplane-aws
tasks:
  default:
    deps:
      - task: kapply
  upgrade:
    cmds:
      - task: kk:ns-create
      - task: kk:kapply
  delete:
    cmds:
      - task: kk:kdelete
