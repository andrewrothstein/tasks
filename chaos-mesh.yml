---
version: '3'
includes:
  repo: chaos-mesh-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: chaos-mesh
      labels: 'istio.io/dataplane-mode=ambient'
  ingress:
    taskfile: tailscale-ingress.yml
    vars:
      namespace: chaos-mesh
      name: tailscale-ingress
      helm_args: -f chaos-mesh-tailscale-ingress-values.yml
  helm:
    taskfile: helm.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      chart_repo_name: chaos-mesh
      chart: chaos-mesh
      chart_ver: 2.8.1
      namespace: chaos-mesh
      name: chaos-mesh
#      helm_args: -f chaos-mesh-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: helm:upgrade
      - task: ingress:upgrade
  delete:
    cmds:
      - task: ingress:delete
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
