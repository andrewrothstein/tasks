---
version: '3'
includes:
  kk:
    taskfile: kubectl.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
tasks:
  apply:
    cmds:
      - task: kk:kapply
        vars:
          k: kubevirt-cdi-operator
      - task: kk:kapply
        vars:
          k: kubevirt-cdi-crds
  delete:
    cmds:
      - task: kk:kdelete
        vars:
          k: kubevirt-cdi-crds
      - task: kk:kdelete
        vars:
          k: kubevirt-cdi-operator
  default:
    deps:
      - apply
