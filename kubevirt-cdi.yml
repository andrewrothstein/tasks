---
version: '3'
includes:
  kk:
    taskfile: kubectl.yml
tasks:
  apply:
    cmds:
      - task: kk:kapply
        vars:
          k: kubevirt-cdi-operator
      - task: kk:kapply
        vars:
          k: kubevirt-cdi-crds
  delete:
    cmds:
      - task: kk:kdelete
        vars:
          k: kubevirt-cdi-crds
      - task: kk:kdelete
        vars:
          k: kubevirt-cdi-operator
  default:
    deps:
      - apply
