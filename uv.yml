---
version: '3'
tasks:
  install-scoop:
    cmds:
      - scoop install uv
  install-brew:
    cmds:
      - brew install uv
  install-apt:
    cmds:
      - sudo apt install uv
  help:
    cmds:
      - task: default
        vars:
          uv_args: help
  default:
    internal: true
    vars:
      q: '{{ .q | default .quiet | default "false" }}'
      v: '{{ .v | default .verbose | default "false" }}'
      color: '{{ .color }}'
      native_tls: '{{ .native_tls | default "false" }}'
      offline: '{{ .offline | default "false" }}'
      allow_insecure_hosts: '{{ .allow_insecure_hosts }}'
      no_progress: '{{ .no_progress | default "false" }}'
      directory: '{{ .directory }}'
      project: '{{ .project }}'
      config_file: '{{ .config_file }}'
      no_config_file: '{{ .no_config_file | default "false" }}'
      h: '{{ .h | default .help | default "false" }}'
      V: '{{ .V | default .version | default "false" }}'
      uv_args: '{{ .uv_args }}'
    cmds:
      - |-
        uv
        {{- if eq .q "true" }} \
          --quiet
        {{- end }}
        {{- if eq .v "true" }} \
          --verbose
        {{- end }}
        {{- if .color }} \
          --color {{ .color | quote }}
        {{- end }}
        {{- if eq .native_tls "true" }} \
          --native-tls
        {{- end }}
        {{- if eq .offline "true" }} \
          --offline
        {{- end }}
        {{- if .allow_insecure_hosts }} \
          --allow-insecure-hosts
        {{- end }}
        {{- if .uv_args }} \
          {{ .uv_args }}
        {{- end }}
  version:
    cmds:
      - task: default
        vars:
          uv_args: >-
            --version
  init:
    vars:
      name: '{{ .name }}'
      bare: '{{ .bare | default "false" }}'
      package: '{{ .package | default "false" }}'
      no_package: '{{ .no_package | default "false" }}'
      app: '{{ .app | default "false" }}'
      lib: '{{ .lib | default "false" }}'
      script: '{{ .script | default "false" }}'
      description: '{{ .description }}'
      no_description: '{{ .no_description | default "false" }}'
      vcs: '{{ .vcs }}'
      build_backend: '{{ .build_backend }}'
      no_readme: '{{ .no_readme | default "false" }}'
      author_from: '{{ .author_from }}'
      no_pin_python: '{{ .no_pin_python | default "false" }}'
      no_workspace: '{{ .no_workspace | default "false" }}'
      p: '{{ .p | default .python }}'
      path: '{{ .path }}'
    cmds:
      - task: default
        vars:
          uv_args: >-
            init
            {{- if .name }} \
              --name {{ .name }}
            {{- end }}
            {{- if eq .bare "true" }} \
              --bare
            {{- end }}
            {{- if eq .package "true" }} \
              --package
            {{- end }}
            {{- if eq .no_package "true" }} \
              --no-package
            {{- end }}
            {{- if eq .app "true" }} \
              --app
            {{- end }}
            {{- if eq .lib "true" }} \
              --lib
            {{- end }}
            {{- if eq .script "true" }} \
              --script
            {{- end }}
            {{- if .description }} \
              --description {{ .description | quote }}
            {{- end }}
            {{- if eq .no_description "true" }} \
              --no-description
            {{- end }}
            {{- if .vcs }} \
              --vcs {{ .vcs | quote }}
            {{- end }}
            {{- if .build_backend }} \
              --build-backend {{ .build_backend | quote }}
            {{- end }}
            {{- if eq .no_readme "true" }} \
              --no-readme
            {{- end }}
            {{- if .author_from }} \
              --author-from {{ .author_from | quote }}
            {{- end }}
            {{- if eq .no_pin_python "true" }} \
              --no-pin-python
            {{- end }}
            {{- if eq .no_workspace "true" }} \
              --no-workspace
            {{- end }}
            {{- if .p }} \
              --python {{ .p | quote }}
            {{- end }}
            {{- if .path }} \
              {{ .path | quote }}
            {{- end }}
  run:
    vars:
      extra: '{{ .extra }}'
      all_extras: '{{ .all_extras | default "false" }}'
      no_extra: '{{ .no_extra }}'
      no_dev: '{{ .no_dev | default "false" }}'
      group: '{{ .group }}'
      no_group: '{{ .no_group }}'
      no_default_groups: '{{ .no_default_groups | default "false" }}'
      only_group: '{{ .only_group }}'
      all_groups: '{{ .all_groups | default "false" }}'
      m: '{{ .m | default .module }}'
      only_dev: '{{ .only_dev | default "false" }}'
      no_editable: '{{ .no_editable | default "false" }}'
      exact: '{{ .exact | default "false" }}'
      env_file: '{{ .env_file }}'
      no_env_file: '{{ .no_env_file | default "false" }}'
      withs: '{{ .withs }}'
      isolated: '{{ .isolated | default "false" }}'
      activate: '{{ .activate | default "false" }}'
      no_sync: '{{ .no_sync | default "false" }}'
      locked: '{{ .locked | default "false" }}'
      frozen: '{{ .frozen | default "false" }}'
      script: '{{ .script | default "false" }}'
      gui_script: '{{ .gui_script | default "false" }}'
      all_packages: '{{ .all_packages | default "false" }}'
      package: '{{ .package }}'
      no_project: '{{ .no_project | default "false" }}'
      run_args: '{{ .run_args }}'
    cmds:
      - task: default
        vars:
          uv_args: >-
            run
            {{- if .extra }} \
              --extra {{ .extra | quote }}
            {{- end }}
            {{- if eq .all_extras "true" }} \
              --all-extras
            {{- end }}
            {{- if .no_extra }} \
              --no-extra
            {{- end }}
            {{- if eq .no_dev "true" }} \
              --no-dev
            {{- end }}
            {{- if .group }} \
              --group {{ .group | quote }}
            {{- end }}
            {{- if .no_group }} \
              --no-group
            {{- end }}
            {{- if eq .no_default_groups "true" }} \
              --no-default-groups
            {{- end }}
            {{- if .only_group }} \
              --only-group {{ .only_group | quote }}
            {{- end }}
            {{- if eq .all_groups "true" }} \
              --all-groups
            {{- end }}
            {{- if .m }} \
              --module {{ .m | quote }}
            {{- end }}
            {{- if eq .only_dev "true" }} \
              --only-dev
            {{- end }}
            {{- if eq .no_editable "true" }} \
              --no-editable
            {{- end }}
            {{- if eq .exact "true" }} \
              --exact
            {{- end }}
            {{- if .env_file }} \
              --env-file {{ .env_file | quote }}
            {{- end }}
            {{- if eq .no_env_file "true" }} \
              --no-env-file
            {{- end }}
            {{- if .withs }} \
              {{ .withs }}
            {{- end }}
            {{- if eq .isolated "true" }} \
              --isolated
            {{- end }}
            {{- if eq .activate "true" }} \
              --activate
            {{- end }}
            {{- if eq .no_sync "true" }} \
              --no-sync
            {{- end }}
            {{- if eq .locked "true" }} \
              --locked
            {{- end }}
            {{- if eq .frozen "true" }} \
              --frozen
            {{- end }}
            {{- if eq .script "true" }} \
              --script
            {{- end }}
            {{- if eq .gui_script "true" }} \
              --gui-script
            {{- end }}
            {{- if eq .all_packages "true" }} \
              --all-packages
            {{- end }}
            {{- if .package }} \
              --package {{ .package | quote }}
            {{- end }}
            {{- if eq .no_project "true" }} \
              --no-project
            {{- end }}
            {{- if .run_args }} \
              {{ .run_args }}
            {{- end }}
