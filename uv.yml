---
version: '3'
tasks:
  sync:
    vars:
      workdir: '{{ .workdir | default .USER_WORKING_DIR }}'
    cmds:
      - |
        {{- if .workdir }}
        cd {{ .workdir | quote }}
        {{- end }}
        uv sync
  run:
    vars:
      workdir: '{{ .workdir | default .USER_WORKING_DIR }}'
      run_args: '{{ .run_args }}'
    cmds:
      - |
        {{- if .workdir }}
        cd {{ .workdir }}
        {{- end }}
        {{- if .run_args }}
        uv run {{ .run_args }};
        {{- end }}
