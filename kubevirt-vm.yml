---
version: '3'
includes:
  virtctl:
    taskfile: virtctl.yml
    vars:
      n: kubevirt-vms
  kk:
    taskfile: kubectl.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: kubevirt-vms
      k: kubevirt-vm
tasks:
  vm-create:
    cmds:
      - task: kk:kapply
    sources:
      - kubevirt-vms/
  vm-start:
    cmds:
      - task: virtctl
        vars:
          action: start
          name: jumpstation
  vm-stop:
    cmds:
      - task: virtctl
        vars:
          action: stop
          name: jumpstation
  vm-delete:
    cmds:
      - task: kk:kdelete
  default:
    deps:
      - apply
  apply:
    cmds:
      - task: kk:ns-create
      - task: vm-create
      - task: vm-start
  delete:
    cmds:
      - task: vm-stop
      - task: vm-delete
      - task: kk:ns-delete
