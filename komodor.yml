---
version: '3'
includes:
  repo: komodor-repo.yml
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: komodorio
      chart: komodor-agent
      chart_ver: 2.7.1
      create_namespace: 'true'
      namespace: komodorio
      name: komodor-agent
      helm_args: >-
        --set clusterName=kind
        -f komodor-values.yml
        --set apiKey="${KOMODOR_API_KEY}"
tasks:
  default:
    deps:
      - upgrade
  test-secrets:
    cmds:
      - test ${KOMODOR_API_KEY}
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: test-secrets
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
