---
version: '3'
includes:
  repo: metallb-repo.yml
  kubectl:
    taskfile: kubectl.yml
    internal: true
    vars:
      n: metallb-system
      k: metallb-kind
  metallb:
    taskfile: helm.yml
    internal: true
    vars:
      namespace: metallb-system
      name: metallb
      chart_repo_name: metallb
      chart_ver: 0.15.2
      chart: metallb
      helm_args: -f metallb-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kubectl:ns-create
      - task: metallb:upgrade
      - task: kubectl:kapply
  delete:
    cmds:
      - task: kubectl:kdelete
      - task: metallb:delete
      - task: kubectl:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: metallb:check
