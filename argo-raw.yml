---
version: '3'
includes:
  kubectl:
    taskfile: kubectl.yml
    internal: true
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
tasks:
  apply:
    vars:
      m: '{{ .m | default "https://raw.githubusercontent.com/argoproj" }}'
      n: '{{ .n }}'
      p: '{{ .p }}'
      v: '{{ .v }}'
      y: '{{ .y | default "install.yaml" }}'
    cmds:
      - task: kubectl:ns-create
        vars:
          n: '{{ .n }}'
      - task: kubectl:apply
        vars:
          n: '{{ .n }}'
          f: '{{ .m }}/argo-{{ .p }}/v{{ .v }}/manifests/{{ .y }}'
  delete:
    vars:
      m: '{{ .m | default "https://raw.githubusercontent.com/argoproj" }}'
      n: '{{ .n }}'
      p: '{{ .p }}'
      v: '{{ .v }}'
      y: '{{ .y | default "install.yaml" }}'
    cmds:
      - task: kubectl:delete
        vars:
          n: '{{ .n }}'
          f: '{{ .m }}/argo-{{ .p }}/v{{ .v }}/manifests/{{ .y }}'
      - task: kubectl:ns-delete
        vars:
          n: '{{ .n }}'
