---
version: '3'

# Cluster safety
# --------------
# Every task that hits a Kubernetes cluster requires the driver to declare
# both the kubeconfig file and the context, either by passing
# kubeconfig=<file> kube_context=<name> on the CLI or by exporting
# KUBECONFIG and KUBE_CONTEXT in the shell. Missing either is a hard error.
# The flags --kubeconfig and --kube-context are passed on every helm
# invocation, so current-context drift cannot select the wrong cluster.

tasks:
  _require-context:
    internal: true
    vars:
      kubeconfig: '{{ .kubeconfig }}'
      kube_context: '{{ .kube_context }}'
    cmds:
      - |-
        missing=
        [ -n {{ .kubeconfig | quote }} ]   || missing="${missing}kubeconfig "
        [ -n {{ .kube_context | quote }} ] || missing="${missing}kube_context "
        if [ -n "${missing}" ]; then
          echo "ERROR: helm task requires explicit ${missing}declaration." >&2
          echo "  Pass kubeconfig=<file> kube_context=<name> on the CLI, or" >&2
          echo "  export KUBECONFIG=<file> KUBE_CONTEXT=<name> in your shell." >&2
          echo "  This is enforced repo-wide to prevent cross-cluster mishaps." >&2
          exit 1
        fi

  check:
    vars:
      chart_repo_name: '{{ .chart_repo_name }}'
      chart: '{{ .chart }}'
      chart_ver: '{{ .chart_ver }}'
      fq_chart: '{{ .chart_repo_name }}/{{ .chart }}'
      q: '{{ .q | default .quiet | default "true" }}'
    cmds:
      - |
        latest=$(helm search repo \
          {{ .fq_chart | quote }} -o json | \
          jq -r '.[] | select(.name=={{ .fq_chart | quote }}) | .version')
        if [ {{ .chart_ver | quote }} != "${latest}" ];
        then
            echo "please upgrade {{ .fq_chart }} from {{ .chart_ver }} to ${latest}"
        elif [ {{ .q | quote }} != "true" ];
        then
          echo "{{ .fq_chart }} at latest (${latest})"
        fi
  upgrade:
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      install: '{{ .install | default "true" }}'
      namespace: '{{ .namespace }}'
      create_namespace: '{{ .create_namespace | default "false" }}'
      name: '{{ .name }}'
      chart_repo_name: '{{ .chart_repo_name }}'
      chart: '{{ .chart }}'
      chart_ver: '{{ .chart_ver }}'
      wait: '{{ .wait | default "true" }}'
      timeout: '{{ .timeout | default "10m" }}'
      force_conflicts: '{{ .force_conflicts | default "false" }}'
      skip_crds: '{{ .skip_crds | default "false" }}'
      helm_args: '{{ .helm_args | default "" }}'
    cmds:
      - task: _require-context
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
      - |-
        helm \
          --kubeconfig {{ .kubeconfig | quote }} \
          --kube-context {{ .kube_context | quote }} \
          upgrade
          {{- if .namespace }} \
          -n {{ .namespace | quote }}
          {{- end }}
          {{- if eq "true" .install }} \
          --install
          {{- end }}
          {{- if eq "true" .create_namespace }}  \
          --create-namespace
          {{- end }}
          {{- if eq "true" .force_conflicts }} \
          --force-conflicts
          {{- end }}
          {{- if eq "true" .skip_crds }} \
          --skip-crds
          {{- end }} \
          {{ .name | quote }} \
          "{{ if .chart_repo_name }}{{ .chart_repo_name }}/
          {{- end }}{{ .chart }}"
          {{- if .chart_ver }} \
          --version {{ .chart_ver | quote }}
          {{- end }}
          {{- if eq "true" .wait }} \
          --wait --timeout {{ .timeout | quote }}
          {{- end }}
          {{- if .helm_args }} \
          {{ .helm_args }}
          {{- end }}
  template-apply:
    desc: "Render chart with helm template and apply via kubectl server-side apply (bypasses release Secret size limit)"
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: '{{ .namespace }}'
      name: '{{ .name }}'
      chart_repo_name: '{{ .chart_repo_name }}'
      chart: '{{ .chart }}'
      chart_ver: '{{ .chart_ver }}'
      helm_args: '{{ .helm_args | default "" }}'
    cmds:
      - task: _require-context
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
      - |-
        helm \
          --kubeconfig {{ .kubeconfig | quote }} \
          --kube-context {{ .kube_context | quote }} \
          template \
          {{ .name | quote }} \
          "{{ if .chart_repo_name }}{{ .chart_repo_name }}/
          {{- end }}{{ .chart }}"
          {{- if .chart_ver }} \
          --version {{ .chart_ver | quote }}
          {{- end }}
          {{- if .namespace }} \
          -n {{ .namespace | quote }}
          {{- end }}
          {{- if .helm_args }} \
          {{ .helm_args }}
          {{- end }} \
          | kubectl \
              --kubeconfig {{ .kubeconfig | quote }} \
              --context {{ .kube_context | quote }} \
              apply --server-side --force-conflicts -f -
  template-delete:
    desc: "Render chart with helm template and delete via kubectl"
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: '{{ .namespace }}'
      name: '{{ .name }}'
      chart_repo_name: '{{ .chart_repo_name }}'
      chart: '{{ .chart }}'
      chart_ver: '{{ .chart_ver }}'
      helm_args: '{{ .helm_args | default "" }}'
    cmds:
      - task: _require-context
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
      - |-
        helm \
          --kubeconfig {{ .kubeconfig | quote }} \
          --kube-context {{ .kube_context | quote }} \
          template \
          {{ .name | quote }} \
          "{{ if .chart_repo_name }}{{ .chart_repo_name }}/
          {{- end }}{{ .chart }}"
          {{- if .chart_ver }} \
          --version {{ .chart_ver | quote }}
          {{- end }}
          {{- if .namespace }} \
          -n {{ .namespace | quote }}
          {{- end }}
          {{- if .helm_args }} \
          {{ .helm_args }}
          {{- end }} \
          | kubectl \
              --kubeconfig {{ .kubeconfig | quote }} \
              --context {{ .kube_context | quote }} \
              delete --ignore-not-found -f -
  install:
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: '{{ .namespace }}'
      create_namespace: '{{ .create_namespace | default "false" }}'
      name: '{{ .name }}'
      chart_repo_name: '{{ .chart_repo_name }}'
      chart: '{{ .chart }}'
      chart_ver: '{{ .chart_ver }}'
      wait: '{{ .wait | default "true" }}'
      timeout: '{{ .timeout | default "10m" }}'
      helm_args: '{{ .helm_args | default "" }}'
    cmds:
      - task: _require-context
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
      - |-
        helm \
          --kubeconfig {{ .kubeconfig | quote }} \
          --kube-context {{ .kube_context | quote }} \
          install
          {{- if .namespace }} \
          -n {{ .namespace | quote }}
          {{- end }}
          {{- if eq "true" .create_namespace }}  \
          --create-namespace
          {{- end }} \
          {{ .name | quote }} \
          {{ if .chart_repo_name }}{{ .chart_repo_name }}/{{ end -}}
          {{- .chart -}}
          {{- if .chart_ver }} \
          --version {{ .chart_ver | quote }}
          {{- end }}
          {{- if eq "true" .wait }} \
          --wait --timeout {{ .timeout | quote }}
          {{- end }}
          {{- if .helm_args }} \
          {{ .helm_args }}
          {{- end }}
    status:
      - |
        helm \
          --kubeconfig {{ .kubeconfig | quote }} \
          --kube-context {{ .kube_context | quote }} \
          list \
          -n {{ .namespace | quote }} \
          -o json \
          | jq -e '.[] | select(.name=={{ .name | quote }})'
  delete:
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: '{{ .namespace }}'
      name: '{{ .name }}'
      wait: '{{ .wait | default "true" }}'
    preconditions:
      - |
        helm \
          --kubeconfig {{ .kubeconfig | quote }} \
          --kube-context {{ .kube_context | quote }} \
          list
          {{- if .namespace }} \
          -n {{ .namespace | quote }}
          {{- end }} \
          -o json \
          | jq -e '.[] | select(.name=={{ .name | quote }})'
    cmds:
      - task: _require-context
        vars:
          kubeconfig: '{{ .kubeconfig }}'
          kube_context: '{{ .kube_context }}'
      - |
        helm \
          --kubeconfig {{ .kubeconfig | quote }} \
          --kube-context {{ .kube_context | quote }} \
          delete
          {{- if .namespace }} \
          -n {{ .namespace | quote }}
          {{- end }}
          {{- if eq "true" .wait }} \
          --wait
          {{- end }} \
          {{ .name | quote }}
