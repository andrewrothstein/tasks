---
version: '3'
vars:
  capsule: pet
  k8s_digester: k8s-digester
  eraser: eraser
  reloader: reloader
  operator_sdk: pet
  knative: pet
  coderv2: coderv2
includes:
  k8s-network: k8s-network.yml

  capsule:
    taskfile: '{{ .capsule }}.yml'

  k8s-digester:
    taskfile: '{{ .k8s_digester }}.yml'

  eraser:
    taskfile: '{{ .eraser }}.yml'

  reloader:
    taskfile: '{{ .reloader }}.yml'

  k8s-policy: k8s-policy.yml
  k8s-security: k8s-security.yml
  k8s-secrets: k8s-secrets.yml
  k8s-storage: k8s-storage.yml
  k8s-streaming: k8s-streaming.yml
  k8s-observability: k8s-observability.yml
  k8s-autoscaling: k8s-autoscaling.yml
  k8s-dns: k8s-dns.yml
  k8s-cicd: k8s-cicd.yml
  k8s-virtualization: k8s-virtualization.yml
  k8s-database: k8s-database.yml
  k8s-ai: k8s-ai.yml
  k8s-chaos: k8s-chaos.yml
  k8s-sdlc: k8s-sdlc.yml

  operator-sdk:
    taskfile: '{{ .operator_sdk }}.yml'

  knative:
    taskfile: '{{ .knative }}.yml'

  coderv2:
    taskfile: '{{ .coderv2 }}.yml'

tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: k8s-network:up
      - task: capsule:upgrade
      - task: k8s-digester:apply
      - task: eraser:upgrade
      - task: reloader:upgrade
      - task: operator-sdk:install
      - task: k8s-policy:up
      - task: k8s-security:up
      - task: k8s-secrets:up
      - task: k8s-storage:up
      - task: k8s-streaming:up
      - task: k8s-observability:up
      - task: k8s-autoscaling:up
      - task: k8s-dns:up
      - task: k8s-cicd:up
      - task: k8s-virtualization:up
      - task: k8s-database:up
      - task: k8s-ai:up
      - task: k8s-chaos:up
      - task: k8s-sdlc:up
      - task: knative:apply
      - task: coderv2:upgrade
  delete:
    cmds:
      - task: coderv2:delete
      - task: knative:delete
      - task: k8s-sdlc:delete
      - task: k8s-chaos:delete
      - task: k8s-ai:delete
      - task: k8s-database:delete
      - task: k8s-virtualization:delete
      - task: k8s-cicd:delete
      - task: k8s-autoscaling:delete
      - task: k8s-observability:delete
      - task: k8s-dns:delete
      - task: k8s-streaming:delete
      - task: k8s-storage:delete
      - task: k8s-secrets:delete
      - task: k8s-security:delete
      - task: k8s-policy:delete
      - task: operator-sdk:delete
      - task: reloader:delete
      - task: eraser:delete
      - task: k8s-digester:delete
      - task: capsule:delete
      - task: k8s-network:delete
  check:
    cmds:
      - task: k8s-network:check
      - task: capsule:check
      - task: k8s-digester:check
      - task: eraser:check
      - task: reloader:check
      - task: k8s-policy:check
      - task: k8s-security:check
      - task: k8s-secrets:check
      - task: k8s-storage:check
      - task: k8s-streaming:check
      - task: k8s-observability:check
      - task: k8s-autoscaling:check
      - task: k8s-dns:check
      - task: k8s-cicd:check
      - task: k8s-virtualization:check
      - task: k8s-database:check
      - task: k8s-ai:check
      - task: k8s-chaos:check
      - task: k8s-sdlc:check
      - task: coderv2:check
