---
version: '3'
includes:
  repo: ot-helm.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: ot-operators
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: ot-helm
      chart: redis-operator
      chart_ver: 0.18.5
      namespace: ot-operators
      name: redis-operator
tasks:
  default:
    cmds:
      - task: upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: helm:upgrade
#        vars:
#          helm_args: -f redis-operator-values.yml
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    cmds:
      - task: helm:check
