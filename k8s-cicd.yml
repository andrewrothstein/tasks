---
version: '3'
vars:
  arc: pet
  conductor: pet
  drone: pet
  awx: pet
  artifactory: pet
  flux: flux
  argoproj: argoproj
  kargo: kargo
  kro: kro
  kpack: pet
  tekton_pipelines: pet
  tekton_triggers: pet
  tekton_operator: pet
  pulumi_kubernetes_operator: pet
  prefect: pet
  blue_agent: pet
  fleet: pet
includes:
  arc:
    taskfile: '{{ .arc }}.yml'

  conductor:
    taskfile: '{{ .conductor }}.yml'

  drone:
    taskfile: '{{ .drone }}.yml'

  awx:
    taskfile: '{{ .awx }}.yml'

  artifactory:
    taskfile: '{{ .artifactory }}.yml'

  flux:
    taskfile: '{{ .flux }}.yml'

  argoproj:
    taskfile: '{{ .argoproj }}.yml'

  kargo:
    taskfile: '{{ .kargo }}.yml'

  kro:
    taskfile: '{{ .kro }}.yml'

  kpack:
    taskfile: '{{ .kpack }}.yml'

  tekton-pipelines:
    taskfile: '{{ .tekton_pipelines }}.yml'

  tekton-triggers:
    taskfile: '{{ .tekton_triggers }}.yml'

  tekton-operator:
    taskfile: '{{ .tekton_operator }}.yml'

  pulumi-kubernetes-operator:
    taskfile: '{{ .pulumi_kubernetes_operator }}.yml'

  prefect:
    taskfile: '{{ .prefect }}.yml'

  blue-agent:
    taskfile: '{{ .blue_agent }}.yml'

  fleet:
    taskfile: '{{ .fleet }}.yml'

tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: conductor:upgrade
      - task: drone:upgrade
      - task: awx:upgrade
      - task: artifactory:upgrade
      - task: flux:upgrade
      - task: argoproj:upgrade
      - task: kargo:upgrade
      - task: kro:upgrade
      - task: kpack:apply
      - task: tekton-operator:apply
      - task: tekton-pipelines:apply
      - task: tekton-triggers:apply
      - task: pulumi-kubernetes-operator:upgrade
      - task: prefect:upgrade
      - task: blue-agent:upgrade
      - task: fleet:upgrade
  delete:
    cmds:
      - task: fleet:delete
      - task: blue-agent:delete
      - task: prefect:delete
      - task: pulumi-kubernetes-operator:delete
      - task: tekton-triggers:delete
      - task: tekton-pipelines:delete
      - task: tekton-operator:delete
      - task: kpack:delete
      - task: kro:delete
      - task: kargo:delete
      - task: argoproj:delete
      - task: flux:delete
      - task: artifactory:delete
      - task: awx:delete
      - task: drone:delete
      - task: conductor:delete
  check:
    cmds:
      - task: conductor:check
      - task: drone:check
      - task: awx:check
      - task: artifactory:check
      - task: flux:check
      - task: argoproj:check
      - task: kargo:check
      - task: kro:check
      - task: pulumi-kubernetes-operator:check
      - task: prefect:check
      - task: blue-agent:check
      - task: fleet:check
