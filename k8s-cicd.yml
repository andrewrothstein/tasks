---
version: '3'
includes:
  artifactory: artifactory-oss.yml
#  artifactory: pet.yml

#  flux: flux.yml
  flux: pet.yml

  argoproj: argoproj.yml
#  argoproj: pet.yml

#  kpack: kpack.yml
  kpack: pet.yml

#  tekton-pipelines: tekton-pipelines.yml
  tekton-pipelines: pet.yml

#  tekton-triggers: tekton-triggers.yml
  tekton-triggers: pet.yml

#  tekton-operator: tekton-operator.yml
  tekton-operator: pet.yml

  pulumi-kubernetes-operator: pulumi-kubernetes-operator.yml
#  pulumi-kubernetes-operator: pet.yaml

  prefect: prefect.yml
#  prefect: pet.yml

tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: artifactory:upgrade
      - task: flux:upgrade
      - task: argoproj:upgrade
      - task: kpack:apply
      - task: tekton-operator:apply
      - task: tekton-pipelines:apply
      - task: tekton-triggers:apply
      - task: pulumi-kubernetes-operator:upgrade
      - task: prefect:upgrade
  delete:
    cmds:
      - task: prefect:delete
      - task: pulumi-kubernetes-operator:delete
      - task: tekton-triggers:delete
      - task: tekton-pipelines:delete
      - task: tekton-operator:delete
      - task: kpack:delete
      - task: argoproj:delete
      - task: flux:delete
      - task: artifactory:delete
  check:
    cmds:
      - task: artifactory:check
      - task: flux:check
      - task: argoproj:check
      - task: pulumi-kubernetes-operator:check
      - task: prefect:check
