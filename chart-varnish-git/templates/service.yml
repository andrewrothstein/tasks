# templates/service.yml
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "git-cache.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: varnish
  selector:
    app: {{ include "git-cache.name" . }}
