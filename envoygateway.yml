---
version: '3'
vars:
  ENVOY_GATEWAY_VER: 1.7.1
  ENVOY_AI_GATEWAY_VER: 0.5.0
includes:
  gh:
    internal: true
    taskfile: gh.yml
  gwkk:
    taskfile: kubectl.yml
    vars:
      n: envoy-gateway-system
      labels: 'istio.io/dataplane-mode=ambient'
  gw-crds:
    taskfile: helm.yml
    vars:
      namespace: envoy-gateway-system
      name: envoy-gateway-crds
      chart_repo_name: oci://docker.io/envoyproxy
      chart: gateway-crds-helm
      # https://github.com/envoyproxy/gateway/tags
      chart_ver: '{{ .ENVOY_GATEWAY_VER }}'
      helm_args: '--set crds.envoyGateway.enabled=true --set crds.gatewayAPI.enabled=false'
  gw:
    taskfile: helm.yml
    vars:
      namespace: envoy-gateway-system
      name: envoy-gateway
      chart_repo_name: oci://docker.io/envoyproxy
      chart: gateway-helm
      # https://github.com/envoyproxy/gateway/tags
      chart_ver: '{{ .ENVOY_GATEWAY_VER }}'
      skip_crds: "true"
  aigwkk:
    taskfile: kubectl.yml
    vars:
      n: envoy-ai-gateway-system
      labels: 'istio.io/dataplane-mode=ambient'
  aigw-crds:
    taskfile: helm.yml
    vars:
      namespace: envoy-ai-gateway-system
      name: aieg-crds
      chart_repo_name: oci://docker.io/envoyproxy
      chart: ai-gateway-crds-helm
      # https://github.com/envoyproxy/ai-gateway/tags
      chart_ver: '{{ .ENVOY_AI_GATEWAY_VER }}'
  aigw:
    taskfile: helm.yml
    vars:
      namespace: envoy-ai-gateway-system
      name: aieg
      chart_repo_name: oci://docker.io/envoyproxy
      chart: ai-gateway-helm
      # https://github.com/envoyproxy/ai-gateway/tags
      chart_ver: '{{ .ENVOY_AI_GATEWAY_VER }}'
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    cmds:
      - task: gwkk:ns-create
      - task: gw-crds:template-apply
      - task: gw:upgrade
      - task: aigwkk:ns-create
      - task: aigw-crds:template-apply
      - task: aigw:upgrade
  delete:
    cmds:
      - task: aigw:delete
      - task: aigw-crds:template-delete
      - task: aigwkk:ns-delete
      - task: gw:delete
      - task: gw-crds:template-delete
      - task: gwkk:ns-delete
  check:
    cmds:
      - task: gh:check
        vars:
          org: envoyproxy
          repo: gateway
          current_ver: '{{ .ENVOY_GATEWAY_VER }}'
      - task: gh:check
        vars:
          org: envoyproxy
          repo: ai-gateway
          current_ver: '{{ .ENVOY_AI_GATEWAY_VER }}'
