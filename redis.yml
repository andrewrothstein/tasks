---
version: '3'
vars:
  standalone: pet
  cluster: pet
includes:
  operator: redis-operator.yml
  standalone:
    taskfile: '{{ .standalone }}.yml'
  cluster:
    taskfile: '{{ .cluster }}.yml'
tasks:
  default:
    cmds:
      - task: up
  up:
    cmds:
      - task: operator:upgrade
      - task: standalone:apply
      - task: cluster:apply
  delete:
    cmds:
      - task: cluster:delete
      - task: standalone:delete
      - task: operator:delete
  check:
    cmds:
      - task: operator:check
