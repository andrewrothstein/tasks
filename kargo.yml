---
version: '3'
vars:
  KARGO_VER: 1.9.5
includes:
  gh:
    internal: true
    taskfile: gh.yml
    vars:
      org: akuity
      repo: kargo
      current_ver: '{{ .KARGO_VER }}'
  kk:
    taskfile: kubectl.yml
    vars:
      n: kargo
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      namespace: kargo
      chart_repo_name: "oci://ghcr.io/akuity/kargo-charts"
      chart: kargo
      chart_ver: '{{ .KARGO_VER }}'
      name: kargo
  ingress:
    taskfile: tailscale-ingress.yml
    vars:
      namespace: kargo
      name: tailscale-ingress
      helm_args: -f kargo-tailscale-ingress-values.yml
tasks:
  generate-secrets:
    cmds:
      - |-
        pass=$(openssl rand -base64 48 | tr -d "=+/" | head -c 32)
        echo "Password: $pass"
        hashed_pass=$(htpasswd -bnBC 10 "" $pass | tr -d ':\n')
        echo "Password Hash: $hashed_pass"
        signing_key=$(openssl rand -base64 48 | tr -d "=+/" | head -c 32)
        echo "Signing Key: $signing_key "
  test-secrets:
    vars:
      adminPasswordHashed: '{{ .adminPassword | default "${KARGO_ADMIN_PASSWORD_HASHED}" }}'
      adminSigningKey: '{{ .adminSigningKey | default "${KARGO_ADMIN_SIGNING_KEY}" }}'
    cmds:
      - test {{ .adminPasswordHashed | quote }}
      - test {{ .adminSigningKey | quote }}
  default:
    cmds:
      - task: upgrade
  check:
    cmds:
      - task: gh:check
  upgrade:
    vars:
      adminPasswordHashed: '{{ .adminPassword | default "${KARGO_ADMIN_PASSWORD_HASHED}" }}'
      adminSigningKey: '{{ .adminSigningKey | default "${KARGO_ADMIN_SIGNING_KEY}" }}'
    cmds:
      - task: kk:ns-create
      - task: helm:upgrade
        vars:
          helm_args: >-
            -f kargo-values.yml
            --set api.adminAccount.passwordHash={{ .adminPasswordHashed | quote }}
            --set api.adminAccount.tokenSigningKey={{ .adminSigningKey | quote }}
      - task: ingress:upgrade
  delete:
    cmds:
      - task: ingress:delete
      - task: helm:delete
      - task: kk:ns-delete
