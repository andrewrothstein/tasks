---
version: '3'
includes:
  repo: spire-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: spire-mgmt
      labels: 'istio.io/dataplane-mode=ambient'
  spire-crds:
    taskfile: helm.yml
    vars:
      chart_repo_name: spire
      chart: spire-crds
      chart_ver: 0.5.0
      namespace: spire-mgmt
      name: spire-crds
  spire:
    taskfile: helm.yml
    vars:
      chart_repo_name: spire
      chart: spire
      chart_ver: 0.27.1
      namespace: spire-mgmt
      name: spire
tasks:
  default:
    deps:
      - task: upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: spire-crds:upgrade
      - task: spire:upgrade
        vars:
          helm_args: |-
            -f spire-server-values.yml \
              --set global.spire.namespaces.system.name=spire-mgmt \
              --set global.spire.namespaces.server.name=spire-mgmt
  delete:
    cmds:
      - task: spire:delete
      - task: spire-crds:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: spire:check
      - task: spire-crds:check
