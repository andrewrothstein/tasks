---
version: '3'
includes:
  repo: flux-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: flux-system
#      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: fluxcd-community
      chart: flux2
      chart_ver: 2.17.1
      namespace: flux-system
      name: flux
#      helm_args: -f flux-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    vars:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
