---
version: '3'
includes:
  repo: capi-operator-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: capi-operator-system
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    internal: true
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: capi-operator-system
      chart_repo_name: capi-operator
      chart: cluster-api-operator
      name: capi-operator
      chart_ver: 0.25.0
      helm_args: -f capi-operator-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
