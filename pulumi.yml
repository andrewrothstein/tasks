---
version: '3'
tasks:
  default:
    vars:
      pulumi_command: '{{ .pulumi_command }}'
      pulumi_args: '{{ .pulumi_args }}'
      # global flags
      C: '{{ .C | default .cwd | default .USER_WORKING_DIR }}'
      e: '{{ .e | default .emoji }}'
      Q: '{{ .Q | default .fully_qualified_stack_names }}'
      logflow: '{{ .logflow }}'
      logtostderr: '{{ .logtostderr }}'
      memprofilerate: '{{ .memprofilerate }}'
      non_interactive: '{{ .non_interactive }}'
      s: '{{ .s | default .stack }}'
      tracing: '{{ .tracing }}'
      v: '{{ .v | default .verbose }}'
    cmds:
      - |-
        pulumi {{ .pulumi_command }}
        {{- if .pulumi_args }}
        {{- .pulumi_args }}
        {{- end }}
        {{- if .C }} \
          -C {{ .C | quote }}
        {{- end }}
        {{- if .e }} \
          -e
        {{- end }}
        {{- if .logflow }} \
          --logflow
        {{- end }}
        {{- if .logtostderr }} \
          --logtostderr
        {{- end }}
        {{- if .memprofilerate }} \
          --memprofilerate {{ .memprofilerate | int }}
        {{- end }}
        {{- if .non_interactive }} \
          --non-interactive
        {{- end }}
        {{- if .s }} \
          -s {{ .s | quote }}
        {{- end }}
        {{- if .tracing }} \
          --tracing {{ .tracing | quote }}
        {{- end }}
        {{- if .v }} \
          -v {{ .v | int }}
        {{- end }}
  up:
    vars:
      template: '{{ .template }}'
      url: '{{ .url }}'
      m: '{{ .m | default .message }}'
      C: '{{ .C | default .USER_WORKING_DIR }}'
      s: '{{ .s | default .stack }}'
      y: '{{ .y | default .yes }}'
    cmds:
      - task: default
        vars:
          pulumi_command: >-
            up
            {{ if .template }}{{ .template | quote }}{{ end }}
            {{ if .url }}{{ .url | quote }}{{ end }}
          pulumi_args: |-
            {{- if .m }} \
              -m {{ .m | quote }}
            {{- end }}
            {{- if .C }} \
              -C {{ .C | quote}}
            {{- end }}
            {{- if .s }} \
              -s {{ .s | quote }}
            {{- end }}
            {{- if eq "true" .y }} \
              -y
            {{- end }}
  test-up:
    cmds:
      - task: up
        vars:
          C: pulumi/aks
          s: test-aks
          y: "true"
