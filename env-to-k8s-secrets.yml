---
version: '3'
includes:
  k8s-secret:
    taskfile: k8s-literal-secret.yml
    internal: true
tasks:
  default:
    desc: Convert .env file to Kubernetes secrets
    deps:
      - validate-env
    cmds:
      - task: create-secret
      - task: create-manifest

  validate-env:
    desc: Validate .env file exists
    cmds:
      - test -f .env || (echo "❌ Error: .env file not found" && exit 1)
    silent: true

  create-secret:
    desc: Create Kubernetes secret from .env file
    vars:
      namespace: '{{ .namespace | default "default" }}'
      secret_name: '{{ .secret_name | default "env-secrets" }}'
    cmds:
      - echo "🔑 Creating Kubernetes secret '{{ .secret_name }}' in namespace '{{ .namespace }}'..."
      - task: k8s-secret:create
        vars:
          n: '{{ .namespace }}'
          s: '{{ .secret_name }}'
          args: '--from-env-file=.env'

  create-manifest:
    desc: Generate Kubernetes secret manifest from .env file
    vars:
      namespace: '{{ .namespace | default "default" }}'
      secret_name: '{{ .secret_name | default "env-secrets" }}'
      output_dir: '{{ .output_dir | default "argocd/secrets" }}'
    cmds:
      - mkdir -p {{ .output_dir }}
      - echo "📄 Generating manifest at {{ .output_dir }}/{{ .secret_name }}.yaml..."
      - task: k8s-secret:_create
        vars:
          n: '{{ .namespace }}'
          s: '{{ .secret_name }}'
          args: '--from-env-file=.env --dry-run=client -o yaml > {{ .output_dir }}/{{ .secret_name }}.yaml'
      - echo "⚠️  WARNING: This manifest contains base64-encoded secrets. Use Sealed Secrets or External Secrets for GitOps!"

  create-sealed:
    desc: Create Sealed Secret from .env file (requires sealed-secrets controller)
    vars:
      namespace: '{{ .namespace | default "default" }}'
      secret_name: '{{ .secret_name | default "env-secrets" }}'
      output_dir: '{{ .output_dir | default "argocd/sealed-secrets" }}'
    cmds:
      - mkdir -p {{ .output_dir }}
      - echo "🔐 Creating Sealed Secret..."
      - task: k8s-secret:_create
        vars:
          n: '{{ .namespace }}'
          s: '{{ .secret_name }}'
          args: '--from-env-file=.env --dry-run=client -o yaml | kubeseal -o yaml > {{ .output_dir }}/{{ .secret_name }}-sealed.yaml'
      - echo "✅ Sealed secret created at {{ .output_dir }}/{{ .secret_name }}-sealed.yaml"

  create-external-secret:
    desc: Generate ExternalSecret manifest for manual secret management
    vars:
      namespace: '{{ .namespace | default "default" }}'
      secret_name: '{{ .secret_name | default "env-secrets" }}'
      output_dir: '{{ .output_dir | default "argocd/external-secrets" }}'
    cmds:
      - mkdir -p {{ .output_dir }}
      - task: generate-external-secret
        vars:
          namespace: '{{ .namespace }}'
          secret_name: '{{ .secret_name }}'
          output_dir: '{{ .output_dir }}'

  generate-external-secret:
    internal: true
    vars:
      namespace: '{{ .namespace }}'
      secret_name: '{{ .secret_name }}'
      output_dir: '{{ .output_dir }}'
    cmds:
      - |
        cat > {{ .output_dir }}/{{ .secret_name }}-external.yaml << EOF
        ---
        apiVersion: v1
        kind: Secret
        metadata:
          name: {{ .secret_name }}-backend
          namespace: {{ .namespace }}
        type: Opaque
        stringData:
          # Paste your .env contents here as key: value pairs
          # Example:
          # DATABASE_URL: "postgresql://user:pass@host:5432/db"
          # API_KEY: "your-api-key"
        ---
        apiVersion: external-secrets.io/v1beta1
        kind: ExternalSecret
        metadata:
          name: {{ .secret_name }}
          namespace: {{ .namespace }}
        spec:
          refreshInterval: 1h
          secretStoreRef:
            name: local-secrets
            kind: SecretStore
          target:
            name: {{ .secret_name }}
          dataFrom:
            - extract:
                key: {{ .secret_name }}-backend
        ---
        apiVersion: external-secrets.io/v1beta1
        kind: SecretStore
        metadata:
          name: local-secrets
          namespace: {{ .namespace }}
        spec:
          provider:
            kubernetes:
              remoteNamespace: {{ .namespace }}
              auth:
                serviceAccount:
                  name: external-secrets
        EOF
      - echo "📝 Template created at {{ .output_dir }}/{{ .secret_name }}-external.yaml"
      - echo "   Edit this file and add your secrets under stringData section"

  bulk-namespace:
    desc: Create secrets in multiple namespaces from .env file
    vars:
      secret_name: '{{ .secret_name | default "env-secrets" }}'
      namespaces: '{{ .namespaces | default "default,argocd,monitoring,istio-system" }}'
    cmds:
      - |
        for ns in $(echo "{{ .namespaces }}" | tr ',' ' '); do
          echo "🔑 Creating secret in namespace: $ns"
          task env-to-k8s-secrets:create-secret namespace=$ns secret_name={{ .secret_name }}
        done

  list:
    desc: List all secrets that would be created from .env file
    cmds:
      - echo "📋 Secrets that will be created from .env:"
      - grep -E "^[A-Z_]+=" .env | cut -d= -f1 | sed 's/^/  - /'