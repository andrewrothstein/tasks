---
version: '3'
vars:
  argo: argo
  argocd: argocd
  argo_events: pet
  argo_rollouts: argo-rollouts
includes:
  argo:
    taskfile: '{{ .argo }}.yml'

  argocd:
    taskfile: '{{ .argocd }}.yml'

  argo-events:
    taskfile: '{{ .argo_events }}.yml'

  argo-rollouts:
    taskfile: '{{ .argo_rollouts }}.yml'
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    cmds:
      - task: argo:upgrade
      - task: argocd:upgrade
      - task: argo-events:upgrade
      - task: argo-rollouts:upgrade
  delete:
    deps:
      - task: argo-rollouts:delete
      - task: argo-events:delete
      - task: argocd:delete
      - task: argo:delete
  check:
    cmds:
      - task: argo:check
      - task: argocd:check
      - task: argo-events:check
      - task: argo-rollouts:check
