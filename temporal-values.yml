---
server:
  replicaCount: 1
  config:
    namespaces:
      create: true
      namespace:
        - name: default
          retention: 3d
    persistence:
      default:
        driver: sql
        sql:
          driver: postgres12
          host: temporal-pg-chart-cnpg-instance-rw
          port: 5432
          database: temporal
          user: temporal
          password: temporal
          existingSecret: temporal-pg-user
          secretName: password
      visibility:
        driver: sql
        sql:
          driver: postgres12
          host: temporal-pg-chart-cnpg-instance-rw
          port: 5432
          database: temporal_visibility
          user: temporal
          password: temporal
          existingSecret: temporal-pg-user
          secretName: password

schema:
  createDatabase:
    enabled: false

web:
  enabled: true

admintools:
  enabled: true

cassandra:
  enabled: false

mysql:
  enabled: false

postgresql:
  enabled: false

elasticsearch:
  enabled: false

prometheus:
  enabled: false

grafana:
  enabled: false
