---
version: '3'
includes:
  repo: debezium-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: debezium-operator
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: debezium
      chart: debezium-operator
      # curl -sSLf https://charts.debezium.io/index.yaml | less
      chart_ver: 3.0.4-final
      namespace: debezium-operator
      name: debezium-operator
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    vars:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
