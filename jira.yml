---
version: '3'
includes:
  atlassian-data-center-repo: atlassian-data-center-repo.yml
  helm:
    taskfile: helm.yml
    internal: true
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      create_namespace: 'true'
      install: 'true'
      namespace: jira
      name: jira
      chart_repo_name: atlassian-data-center
      chart: jira
      chart_ver: '1.18'
#      helm_args: -f atlassian-data-center-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: atlassian-data-center-repo
    cmds:
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
