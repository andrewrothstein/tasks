---
version: '3'
includes:
  repo: dragonfly-repo.yml
  kk:
    aliases: [kdragonfly]
    taskfile: kubectl.yml
    vars:
      n: dragonfly-system
      k: dragonfly
#      labels: istio.io/dataplane-mode=ambient
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: dragonfly
      chart: dragonfly
      chart_ver: 1.2.21
      namespace: dragonfly-system
      name: dragonfly
      helm_args: -f dragonfly-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: helm:upgrade
#      - task: kdragonfly:kapply
  delete:
    cmds:
      - task: kdragonfly:kdelete
      - task: helm:delete
#      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
