---
version: '3'
includes:
  repo: dragonfly-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: dragonfly-system
# failed on 25-JAN-2026
#      labels: istio.io/dataplane-mode=ambient
  helm:
    taskfile: helm.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      chart_repo_name: dragonfly
      chart: dragonfly
      chart_ver: 1.6.23
      namespace: dragonfly-system
      name: dragonfly
  tailscale-ingress:
    taskfile: tailscale-ingress.yml
    vars:
      namespace: dragonfly-system
      name: tailscale-ingress
      helm_args: -f dragonfly-tailscale-ingress-values.yml
tasks:
  default:
    deps:
      - upgrade
  test-secrets:
    vars:
      dragonfly_jwt_key: '{{ .dragonfly_jwt_key | default "${DRAGONFLY_JWT_KEY}" }}'
    cmds:
      - test {{ .dragonfly_jwt_key | quote }}
  upgrade:
    vars:
      dragonfly_jwt_key: '{{ .dragonfly_jwt_key | default "${DRAGONFLY_JWT_KEY}" }}'
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: test-secrets
        vars:
          dragonfly_jwt_key: '{{ .dragonfly_jwt_key }}'
      - task: helm:upgrade
        vars:
          helm_args: >-
            -f dragonfly-values.yml
            --set manager.config.auth.jwt.key={{ .dragonfly_jwt_key | quote }}
      - task: tailscale-ingress:upgrade
  delete:
    cmds:
      - task: tailscale-ingress:delete
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
