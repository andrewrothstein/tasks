---
version: '3'
includes:
  repo: dragonfly-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: dragonfly-system
#      labels: istio.io/dataplane-mode=ambient
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: dragonfly
      chart: dragonfly
      chart_ver: 1.2.22
      namespace: dragonfly-system
      name: dragonfly
      helm_args: -f dragonfly-values.yml
  tailscale-ingress:
    taskfile: helm.yml
    vars:
      chart: chart-tailscale-ingress
      namespace: dragonfly-system
      name: tailscale-ingress
      helm_args: -f dragonfly-tailscale-ingress-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: helm:upgrade
      - task: tailscale-ingress:upgrade
  delete:
    cmds:
      - task: tailscale-ingress:delete
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
