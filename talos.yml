---
version: '3'
vars:
  cluster_dir: '{{ .USER_WORKING_DIR }}'
  cluster_vip_endpoint: 192.168.1.15
  cluster_endpoint: 192.168.1.16
  cluster_endpoints: 192.168.1.16,192.168.1.17,192.168.1.18
  cluster_secrets_yaml: '{{ .cluster_dir }}/secrets.yaml'
  cluster_controlplane_yaml: '{{ .cluster_dir }}/controlplane.yaml'
  cluster_worker_yaml: '{{ .cluster_dir }}/worker.yaml'
  cluster_talosconfig: '{{ .cluster_dir }}/talosconfig'
  cluster_name: talos-bootstrap
  cluster_kubeconfig: '{{ .cluster_dir }}/.kube/config'
  cluster_control_nodes: 192.168.1.16,192.168.1.17,192.168.1.18
  cluster_worker_nodes: 192.168.1.19,192.168.1.20
  cluster_nodes: '{{ .cluster_control_nodes }},{{ .cluster_worker_nodes }}'
  cluster_patches: >-
    --config-patch=@all.yaml
    --config-patch=@network-eth0.yaml
    --config-patch-control-plane=@vip.json
tasks:
  talosctl:
    internal: true
    vars:
      talosctl_cmd: '{{ .talosctl_cmd }}'
      insecure: '{{ .insecure | default "false" }}'
      nodes: '{{ .nodes }}'
      endpoints: '{{ .endpoints }}'
      talos_version: '{{ .talos_version }}'
      talosconfig: '{{ .talosconfig }}'
      force: '{{ .force | default "false" }}'
      extraArgs: '{{ .extraArgs }}'
    cmds:
      - |-
        cd {{ .cluster_dir }};
        talosctl {{ .talosctl_cmd }}
        {{- if eq .insecure "true" }} \
          --insecure
        {{- end }}
        {{- if .nodes }} \
          -n={{ .nodes | quote }}
        {{- end }}
        {{- if .endpoints }} \
          -e={{ .endpoints | quote }}
        {{- end }}
        {{- if .talosconfig }} \
          --talosconfig={{ .talosconfig | quote }}
        {{- end }}
        {{- if .talos_version }} \
          --talos-version {{ .talos_version | quote }}
        {{- end }}
        {{- if eq "true" .force }} \
          --force
        {{- end }}
        {{- if .extraArgs }}
        {{- .extraArgs }}
        {{- end }}
  gen-secrets:
    vars:
      internal: true
      output_file: '{{ .cluster_secrets_yaml }}'
    cmds:
      - task: talosctl
        vars:
          talosctl_cmd: gen secrets
          extraArgs: |
            {{- if .output_file }} \
              --output-file={{ .output_file | quote }}
            {{- end }}
    status:
      - test -f {{ .output_file | quote }}
  gen-config:
    vars:
      cluster_name: '{{ .cluster_name }}'
      cluster_endpoint: '{{ .cluster_endpoint }}'
      with_secrets: '{{ .with_secrets | default .cluster_secrets_yaml }}'
      with_docs: '{{ .with_docs | default "false" }}'
      with_examples: '{{ .with_examples | default "false" }}'
      patches: '{{ .patches | default .cluster_patches }}'
      force: '{{ .force | default "true" }}'
    cmds:
      - task: talosctl
        vars:
          talosctl_cmd: >-
            gen config
            {{ .cluster_name | quote }}
            https://{{ .cluster_vip_endpoint }}
          force: '{{ .force }}'
          extraArgs: |-
            {{- if .with_docs }} \
              --with-docs={{ .with_docs }}
            {{- end }}
            {{- if .with_examples }} \
              --with-examples={{ .with_examples }}
            {{- end }}
            {{- if .patches }} \
              {{ .patches }}
            {{- end }}
            {{- if .with_secrets }} \
              --with-secrets {{ .with_secrets | quote }}
            {{- end }}
  bootstrap:
    vars:
      nodes: '{{ .nodes | default .cluster_endpoint }}'
      endpoints: '{{ .endpoints | default .cluster_endpoint }}'
      talosconfig: '{{ .talosconfig | default .cluster_talosconfig }}'
    cmds:
      - task: talosctl
        vars:
          talosctl_cmd: bootstrap
          nodes: '{{ .nodes }}'
          endpoints: '{{ .endpoints }}'
          talosconfig: '{{ .talosconfig }}'
  disks:
    vars:
      insecure: '{{ .insecure | default "false" }}'
      nodes: '{{ .nodes | default .cluster_nodes }}'
      talosconfig: '{{ .talosconfig | default .cluster_talosconfig }}'
      endpoints: '{{ .endpoints | default .cluster_endpoints }}'
    cmds:
      - task: talosctl
        vars:
          talosctl_cmd: disks
          insecure: '{{ .insecure }}'
          nodes: '{{ .nodes }}'
          talosconfig: '{{ .talosconfig }}'
          endpoints: '{{ .endpoints }}'
  kubeconfig:
    vars:
      local_path: '{{ .local_path | default .cluster_kubeconfig }}'
      force: '{{ .force | default "true" }}'
      nodes: '{{ .nodes | default .cluster_endpoint }}'
      endpoints: '{{ .endpoints | default .cluster_endpoints }}'
      talosconfig: '{{ .talosconfig | default .cluster_talosconfig }}'
      merge: '{{ .merge | default "true" }}'
    cmds:
      - task: talosctl
        vars:
          talosctl_cmd: kubeconfig{{ if .local_path }} {{ .local_path | quote }}{{ end }}
          nodes: '{{ .nodes }}'
          endpoints: '{{ .endpoints }}'
          talosconfig: '{{ .talosconfig }}'
          force: '{{ .force }}'
          extraArgs: |-
            {{- if eq .merge "true" }} \
              --merge
            {{- end }}
  test-kubeconfig:
    cmds:
      - task: kubeconfig
        vars:
          nodes: 192.168.1.16
          talosconfig: '{{ .cluster_talosconfig }}'
          force: "true"
  k9s:
    cmds:
      - |
        export KUBECONFIG={{ .cluster_kubeconfig | quote }}
        k9s
  apply-config:
    internal: true
    vars:
      insecure: '{{ .insecure }}'
      nodes: '{{ .nodes }}'
      endpoints: '{{ .endpoints | default .cluster_endpoints }}'
      file: '{{ .file }}'
      talosconfig: '{{ .talosconfig | default .cluster_talosconfig }}'
      mode: '{{ .mode }}'
      patches: '{{ .patches }}'
    cmds:
      - task: talosctl
        vars:
          talosctl_cmd: apply-config
          insecure: '{{ .insecure }}'
          nodes: '{{ .nodes }}'
          endpoints: '{{ .endpoints }}'
          talosconfig: '{{ .talosconfig }}'
          extraArgs: |-
            {{- if .file }} \
              --file={{ .file | quote }}
            {{- end }}
            {{- if .mode }} \
              --mode={{ .mode | quote }}
            {{- end }}
            {{- if .patches }} \
            {{ .patches }}
            {{- end }}
  apply-config-controlplane:
    vars:
      insecure: '{{ .insecure }}'
      nodes: '{{ .nodes | default .cluster_control_nodes }}'
    cmds:
      - task: apply-config
        vars:
          insecure: '{{ .insecure }}'
          nodes: '{{ .nodes }}'
          file: '{{ .cluster_controlplane_yaml }}'
  apply-config-worker:
    vars:
      insecure: '{{ .insecure }}'
      nodes: '{{ .nodes | default .cluster_worker_nodes }}'
    cmds:
      - task: apply-config
        vars:
          insecure: '{{ .insecure }}'
          nodes: '{{ .nodes }}'
          file: '{{ .cluster_worker_yaml }}'
  upgrade:
    vars:
      endpoints: '{{ .endpoints | default .cluster_endpoints }}'
      nodes: '{{ .nodes | default .cluster_nodes }}'
      talosconfig: '{{ .talosconfig | default .cluster_talosconfig }}'
    cmds:
      - task: talosctl
        vars:
          talosctl_cmd: upgrade
          endpoints: '{{ .endpoints }}'
          nodes: '{{ .nodes }}'
          talosconfig: '{{ .talosconfig }}'
  reboot:
    vars:
      endpoints: '{{ .endpoints | default .cluster_endpoints }}'
      nodes: '{{ .nodes }}'
      talosconfig: '{{ .talosconfig | default .cluster_talosconfig }}'
    cmds:
      - task: talosctl
        vars:
          talosctl_cmd: reboot
          endpoints: '{{ .endpoints }}'
          nodes: '{{ .nodes }}'
          talosconfig: '{{ .talosconfig }}'
