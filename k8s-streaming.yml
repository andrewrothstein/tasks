---
version: '3'
vars:
  nats: nats
  strimzi_kafka_operator: pet
includes:
  nats:
    taskfile: '{{ .nats }}.yml'

  strimzi-kafka-operator:
    taskfile: '{{ .strimzi_kafka_operator }}.yml'

tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: nats:upgrade
      - task: strimzi-kafka-operator:upgrade
  delete:
    cmds:
      - task: strimzi-kafka-operator:delete
      - task: nats:delete
  check:
    cmds:
      - task: nats:check
      - task: strimzi-kafka-operator:check
