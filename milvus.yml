---
version: '3'
includes:
  repo: milvus-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: milvus
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: milvus
      chart: milvus
      chart_ver: 4.0.31
      namespace: milvus
      name: milvus
      helm_args: -f milvus-standalone-values.yml
  ingress:
    taskfile: tailscale-ingress.yml
    vars:
      namespace: milvus
      name: tailscale-ingress
      helm_args: -f milvus-tailscale-ingress-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: helm:upgrade
      - task: ingress:upgrade
  delete:
    cmds:
      - task: ingress:delete
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
