---
name: PR Validation
'on':
  pull_request:
    branches:
      - develop
      - main
jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      dist: ${{ steps.read-matrix.outputs.dist }}
    steps:
      - uses: actions/checkout@v4
      - name: read platform-matrix-v1.json
        id: read-matrix
        run: echo "dist=$(jq -cr '@json' < platform-matrix-v1.json)" >> $GITHUB_OUTPUT
  
  validate-build:
    runs-on: ubuntu-latest
    needs: [prepare-matrix]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Dagger
        run: |
          cd /usr/local
          curl -fsSL https://dl.dagger.io/dagger/install.sh | sudo sh
      
      - name: Install dependencies
        run: |
          cd dagger-ci
          pip install dagger-io
      
      - name: Validate build (no push)
        run: |
          cd dagger-ci
          dagger call build-single-matrix-entry-pr \
            --os="${{ matrix.dist.OS }}" \
            --os-ver="${{ matrix.dist.OS_VER }}"
    
    strategy:
      fail-fast: false
      matrix:
        dist: ${{ fromJSON(needs.prepare-matrix.outputs.dist) }}