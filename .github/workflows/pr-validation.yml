---
name: PR Validation
'on':
  pull_request:
    branches:
      - develop
jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      dist: ${{ steps.read-matrix.outputs.dist }}
    steps:
      - uses: actions/checkout@v4
      - name: read platform-matrix-v1.json
        id: read-matrix
        run: echo "dist=$(jq -cr '@json' < platform-matrix-v1.json)" >> $GITHUB_OUTPUT
  validate-build:
    runs-on: ubuntu-latest
    needs: [prepare-matrix]
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger
        run: |
          cd /usr/local
          curl -fsSL https://dl.dagger.io/dagger/install.sh | sudo sh
      - name: Validate build (no push)
        run: |
          dagger -m dagger-ci call validate-matrix-entry \
            --source=. \
            --os="${{ matrix.dist.OS }}" \
            --os-ver="${{ matrix.dist.OS_VER }}"
    strategy:
      fail-fast: false
      matrix:
        dist: ${{ fromJSON(needs.prepare-matrix.outputs.dist) }}
