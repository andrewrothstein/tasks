---
name: Build with Dagger
'on':
  push:
    branches:
      - develop
  schedule:
    - cron: '0 0 * * *'
jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      dist: ${{ steps.read-matrix.outputs.dist }}
    steps:
      - uses: actions/checkout@v6
      - name: read platform-matrix-v1.json
        id: read-matrix
        run: echo "dist=$(jq -cr '@json' < platform-matrix-v1.json)" >> $GITHUB_OUTPUT
  build:
    runs-on: ubuntu-latest
    needs: [prepare-matrix]
    steps:
      - uses: actions/checkout@v6
      - name: Install Dagger
        run: |
          cd /usr/local
          curl -fsSL https://dl.dagger.io/dagger/install.sh | sudo sh
      - name: Build and push images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dagger -m dagger-ci call build-matrix-entry \
            --source=. \
            --github-token=env:GITHUB_TOKEN \
            --github-actor="${{ github.actor }}" \
            --os="${{ matrix.dist.OS }}" \
            --os-ver="${{ matrix.dist.OS_VER }}"
    strategy:
      fail-fast: false
      matrix:
        dist: ${{ fromJSON(needs.prepare-matrix.outputs.dist) }}
