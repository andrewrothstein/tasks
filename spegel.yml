---
version: '3'
includes:
  helm:
    taskfile: helm.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: spegel
      create_namespace: 'true'
      install: 'true'
      name: spegel
      chart_repo_name: oci://ghcr.io/spegel-org/helm-charts
      chart: spegel
      chart_ver: v0.0.22
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    cmds:
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
