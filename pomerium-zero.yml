---
version: '3'
includes:
  kk:
    taskfile: kubectl.yml
    internal: true
    vars:
      k: pomerium-zero
  token:
    taskfile: k8s-literal-secret.yml
    vars:
      n: pomerium-zero
      s: pomerium
tasks:
  default:
    deps:
      - apply
  test-secrets:
    vars:
      pomerium_zero_token: '{{ .pomerium_zero_token | default "${POMERIUM_ZERO_TOKEN}" }}'
    cmds:
      - test {{ .pomerium_zero_token | quote }}
  apply:
    vars:
      pomerium_zero_token: '{{ .pomerium_zero_token | default "${POMERIUM_ZERO_TOKEN}" }}'
    cmds:
      - task: kk:kapply
      - task: test-secrets
        vars:
          pomerium_zero_token: '{{ .pomerium_zero_token }}'
      - task: token:create
        vars:
          args: --from-literal=pomerium_zero_token={{ .pomerium_zero_token | quote }}
  delete:
    cmds:
      - task: token:delete
      - task: kk:kdelete
