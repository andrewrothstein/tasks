---
version: '3'
includes:
  repo: grafana-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: grafana
      labels: 'istio.io/dataplane-mode=ambient'
  alloy:
    taskfile: helm.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: grafana
      name: alloy
      chart_repo_name: grafana
      chart: alloy
      chart_ver: 1.6.0
  grafana:
    taskfile: helm.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: grafana
      name: grafana
      chart_repo_name: grafana
      chart: grafana
      chart_ver: 10.5.15
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: alloy:upgrade
#      - task: grafana:upgrade
  delete:
    cmds:
#      - task: grafana:delete
      - task: alloy:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: grafana:check
      - task: alloy:check
