---
version: '3'
includes:
  repo: grafana-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: grafana
      labels: 'istio.io/dataplane-mode=ambient'
  alloy:
    taskfile: helm.yml
    vars:
      namespace: grafana
      name: alloy
      chart_repo_name: grafana
      chart: alloy
      chart_ver: 0.10.1
  grafana:
    taskfile: helm.yml
    vars:
      namespace: grafana
      name: grafana
      chart_repo_name: grafana
      chart: grafana
      chart_ver: 8.6.4
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: alloy:upgrade
#      - task: grafana:upgrade
  delete:
    cmds:
#      - task: grafana:delete
      - task: alloy:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: grafana:check
      - task: alloy:check
