---
databaseUpgradeReady: true
unifiedUpgradeAllowed: true
artifactory:
  artifactory:
    replicaCount: 3
  postgresql:
    enabled: true
  nginx:
    enabled: false
  ingress:
    enabled: true
    className: tailscale
    defaultBackend:
      enabled: true
    hosts:
      - artifactory
    routerPath: /
    artifactoryPath: /artifactory/
    tls:
      - hosts:
          - artifactory
