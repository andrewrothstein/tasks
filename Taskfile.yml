---
version: '3'
dotenv:
  - .env
  - .env.local
vars:
  k8s: k8s
  tailscale: tailscale
  mesh: istio
  post_mesh_1: post-mesh-1
  post_mesh_2: post-mesh-2
includes:
  # utilities
  ansible-test-role: ansible-test-role.yml
  ansible-galaxy: ansible-galaxy.yml
  doppler: doppler.yml
  tf-gitlab: tf-gitlab.yml
  tf-cloudflare-lmgtfy: tf-cloudflare-lmgtfy.yml
  helm-repo: helm-repo.yml

  k8s:
    taskfile: '{{ .k8s }}.yml'

  tailscale:
    taskfile: '{{ .tailscale }}.yml'

  gateway-api: gateway-api.yml

  mesh:
    taskfile: '{{ .mesh }}.yml'

  post-mesh-1:
    taskfile: '{{ .post_mesh_1 }}.yml'

  post-mesh-2:
    taskfile: '{{ .post_mesh_2 }}.yml'

tasks:
  test:
    desc: "Run all tests for the repository"
    cmds:
      - task --taskfile tests/test-all.yml all

  test:quick:
    desc: "Run quick tests only (no cluster operations)"
    cmds:
      - task --taskfile tests/test-all.yml quick

  test:ci:
    desc: "Run CI-appropriate tests"
    cmds:
      - task --taskfile tests/test-all.yml ci

  up:
    cmds:
      - task: k8s:up
      - task: gateway-api:apply
      - task: tailscale:upgrade
      - task: mesh:up
      - task: post-mesh-1:up
      - task: post-mesh-2:up
  delete:
    cmds:
      - task: tailscale:cluster-evacuate
      - task: k8s:delete
  destroy:
    cmds:
      - task: k8s:destroy
  default:
    deps:
      - up
  check:
    cmds:
      - task: helm-repo:up
      - task: k8s:check
      - task: gateway-api:check
      - task: tailscale:check
      - task: mesh:check
      - task: post-mesh-1:check
      - task: post-mesh-2:check
