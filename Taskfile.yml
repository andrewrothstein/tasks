---
version: '3'
dotenv:
  - .env
includes:
  ansible-test-role: ansible-test-role.yml
  ansible-galaxy: ansible-galaxy.yml

  k8s: k8s.yml
#  k8s: pet.yml

  mesh: istio.yml
#  mesh: pet.yml

  post-mesh-1: post-mesh-1.yml
#  post-mesh-1: pet.yml

  post-mesh-2: post-mesh-2.yml
#  post-mesh-2: pet.yml

  working: working.yml
#  working: pet.yml

  doppler: doppler.yml
tasks:
  up:
    cmds:
      - task: k8s:up
      - task: mesh:up
      - task: post-mesh-1:up
      - task: post-mesh-2:up
      - task: working:up
  delete:
    cmds:
      - task: post-mesh-1:k8s-network:tailscale:cluster-evacuate
      - task: k8s:delete
  destroy:
    cmds:
      - task: k8s:destroy
  default:
    deps:
      - up
  check:
    cmds:
      - helm repo up
      - task: k8s:check
      - task: mesh:check
      - task: post-mesh-1:check
      - task: post-mesh-2:check
