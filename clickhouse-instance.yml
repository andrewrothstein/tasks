---
version: '3'
includes:
  kk:
    taskfile: kubectl.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: clickhouse-instance
      labels: 'istio.io/dataplane-mode=ambient'
      k: clickhouse-instance
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    cmds:
      - task: kk:ns-create
      - task: kk:kapply
  delete:
    cmds:
      - task: kk:kdelete
      - task: kk:ns-delete
  check:
    cmds: []
