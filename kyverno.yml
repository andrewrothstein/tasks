---
version: '3'
includes:
  repo: kyverno-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: kyverno
  kyverno:
    taskfile: helm.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: kyverno
      name: kyverno
      chart_repo_name: kyverno
      chart_ver: 3.8.0
      chart: kyverno
      helm_args: -f kyverno-values.yml
  kyverno_policies:
    taskfile: helm.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: kyverno
      name: kyverno-policies
      chart_repo_name: kyverno
      chart_ver: 3.8.0
      chart: kyverno-policies
tasks:
  default:
    deps:
      - upgrade
  check:
    deps:
      - task: repo
    cmds:
      - task: kyverno:check
      - task: kyverno_policies:check
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kyverno:upgrade
      - task: kyverno_policies:upgrade
  delete:
    cmds:
      - task: kyverno_policies:delete
      - task: kyverno:delete
      - task: kk:ns-delete
