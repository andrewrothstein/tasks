---
version: '3'
includes:
  repo: clastix.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: capsule-system
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    internal: true
    vars:
      namespace: capsule-system
      name: capsule
      chart_repo_name: clastix
      chart: capsule
      chart_ver: 0.4.6
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
