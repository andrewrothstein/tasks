
---
version: '3'
includes:
  repo: vcluster-repo.yml
  vcluster-cli:
    taskfile: vcluster-cli.yml
  padm:
    taskfile: vcluster.yml
    vars:
      vcluster_name: padm
  psh:
    taskfile: vcluster.yml
    vars:
      vcluster_name: psh
  pac:
    taskfile: vcluster.yml
    vars:
      vcluster_name: pac
  dev:
    taskfile: vcluster.yml
    vars:
      vcluster_name: dev
  tst:
    taskfile: vcluster.yml
    vars:
      vcluster_name: tst
tasks:
  default:
    cmds:
      - task: upgrade
  upgrade-all-parallel:
    internal: true
    deps:
      - task: padm:upgrade
      - task: psh:upgrade
      - task: pac:upgrade
      - task: dev:upgrade
      - task: tst:upgrade
  upgrade-all-sequential:
    internal: true
    cmds:
      - task: padm:upgrade
      - task: psh:upgrade
      - task: pac:upgrade
      - task: dev:upgrade
      - task: tst:upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: upgrade-all-parallel
      - task: vcluster-cli:list
  delete-all-parallel:
    internal: true
    deps:
      - task: tst:delete
      - task: dev:delete
      - task: pac:delete
      - task: psh:delete
      - task: padm:delete
  delete-all-sequential:
    internal: true
    cmds:
      - task: tst:delete
      - task: dev:delete
      - task: pac:delete
      - task: psh:delete
      - task: padm:delete
  delete:
    cmds:
      - task: delete-all-parallel
      - task: vcluster-cli:list
