---
version: '3'
includes:
  repo: cowboysysop-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: vpa
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      namespace: vpa
      name: vpa
      chart_repo_name: cowboysysop
      chart: vertical-pod-autoscaler
      chart_ver: 9.9.1
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
       - task: repo
    cmds:
      - task: helm:check
