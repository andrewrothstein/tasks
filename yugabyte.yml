---
version: '3'
includes:
  repo: yugabyte-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: yugabyte
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: yugabytedb
      chart: yugabyte
      chart_ver: 2024.1.3
      namespace: yugabyte
      name: yugabyte
#      helm_args: -f yugabyte-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
