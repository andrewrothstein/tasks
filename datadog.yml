---
version: '3'
includes:
  repo: datadog-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: datadog
      labels: 'istio.io/dataplane-mode=ambient'
  datadog-secret:
    taskfile: k8s-literal-secret.yml
    vars:
      n: datadog
      s: datadog-secret
  helm:
    taskfile: helm.yml
    internal: true
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: datadog
      name: datadog
      chart_repo_name: datadog
      chart: datadog
      chart_ver: 3.170.1
      helm_args: >-
        -f datadog-values.yml
tasks:
  default:
    deps:
      - upgrade
  test-secrets:
    vars:
      api_key: '{{ .api_key | default "${DATADOG_API_KEY}" }}'
    cmds:
      - test {{ .api_key | quote }}
  upgrade:
    vars:
      api_key: '{{ .api_key | default "${DATADOG_API_KEY}" }}'
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: test-secrets
        vars:
          api_key: '{{ .api_key }}'
      - task: datadog-secret:create
        vars:
          args: >-
            --from-literal=api-key={{ .api_key | quote }}
      - task: helm:upgrade
  delete:
    cmds:
      - task: kk:ns-delete
      - task: helm:delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
