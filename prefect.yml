---
version: '3'
includes:
  repo: prefect-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: prefect
      labels: 'istio.io/dataplane-mode=ambient'
  server:
    taskfile: helm.yml
    vars:
      namespace: prefect
      name: prefect-server
      chart_repo_name: prefect
      chart_ver: 2024.11.21014951
      chart: prefect-server
      helm_args: -f prefect-server-values.yml
  worker:
    taskfile: helm.yml
    internal: true
    vars:
      namespace: prefect
      name: prefect-worker
      chart_repo_name: prefect
      chart_ver: 2024.11.21014951
      chart: prefect-worker
      helm_args: -f prefect-worker-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
       - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: server:upgrade
      - task: worker:upgrade
  delete:
    cmds:
      - task: worker:delete
      - task: server:delete
      - task: kubectl:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: server:check
      - task: worker:check
