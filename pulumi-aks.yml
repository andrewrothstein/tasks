---
version: '3'
dotenv: [.env]
includes:
  stack:
    taskfile: pulumi-stack.yml
    vars:
      C: pulumi/aks
      s: test-aks
      yes: 'true'
tasks:
  ls:
    cmds:
      - task: stack:ls
  init:
    cmds:
      - task: stack:init
  rm:
    cmds:
      - task: stack:rm
  up:
    cmds:
      - task: stack:pulumi:up
