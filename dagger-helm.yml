---
version: '3'
includes:
  helm:
    taskfile: helm.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: dagger
      create_namespace: 'true'
      install: 'true'
      name: dagger
      # https://github.com/dagger/dagger/pkgs/container/dagger-helm
      chart_repo_name: oci://registry.dagger.io
      chart: dagger-helm
      chart_ver: 0.18.3
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    cmds:
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
