---
version: '3'
includes:
  repo: percona.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: pxc-operator
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: percona
      chart: pxc-operator
      chart_ver: 1.17.0
      namespace: pxc-operator
      name: pxc-operator
      helm_args: -f pxc-operator-values.yml
tasks:
  default:
    deps:
      - task: upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
