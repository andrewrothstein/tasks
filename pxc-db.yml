---
version: '3'
includes:
  repo: percona.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: pxc-db
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: percona
      chart: pxc-db
      chart_ver: 1.16.1
      namespace: pxc-db
      name: pxc-db
tasks:
  default:
    deps:
      - task: upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
