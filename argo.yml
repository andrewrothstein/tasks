---
version: '3'
includes:
  k: kubectl.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: argo
      labels: 'istio.io/dataplane-mode=ambient'
  pg-barman-s3-secret:
    taskfile: k8s-literal-secret.yml
    vars:
      n: argo
      s: argo-pg-barman-s3
  barman-s3:
    taskfile: barman-s3-secret.yml
    vars:
      n: argo
      s: argo-pg-barman-s3
  pg:
    taskfile: helm.yml
    vars:
      namespace: argo
      name: argo-pg
      chart: chart-cnpg-instance
      helm_args: -f argo-pg-values.yml
  argo-release:
    taskfile: argo-release.yml
    internal: true
    vars:
      chart: argo-workflows
      chart_ver: 2.0.18
      name: argo
      namespace: argo
      helm_args: -f argo-workflows-values.yml
      labels: 'istio.io/dataplane-mode=ambient'
  ingress:
    taskfile: tailscale-ingress.yml
    vars:
      namespace: argo
      name: tailscale-ingress
      helm_args: -f argo-tailscale-ingress-values.yml
tasks:
  default:
    deps:
      - upgrade
  pg-wait:
    vars:
      cluster_name: argo-pg-chart-cnpg-instance
    cmds:
      - >-
        kubectl wait clusters.postgresql.cnpg.io/{{ .cluster_name }}
        -n argo
        --for=condition=Ready
        --timeout=10m
  upgrade:
    cmds:
      - task: kk:ns-create
      - task: barman-s3:create
      - task: pg:upgrade
      - task: pg-wait
      - task: argo-release:upgrade
      - task: k:apply
        vars:
          f: argo-templates
      - task: ingress:upgrade
  delete:
    cmds:
      - task: ingress:delete
      - task: pg:delete
      - task: pg-barman-s3-secret:delete
      - task: argo-release:delete
  check:
    cmds:
      - task: argo-release:check
  list:
    vars:
      n: '{{ .n | default "argo" }}'
    cmds:
      - argo list -n {{ .n | quote }}
  submit:
    vars:
      n: '{{ .n | default "argo" }}'
      dry_run: '{{ .dry_run | default "false" }}'
      from: '{{ .from }}'
      generate_from: '{{ .generate_from }}'
      f: '{{ .f }}'
      log: '{{ .log | default "true" }}'
      watch: '{{ .watch | default "true" }}'
      serviceaccount: '{{ .serviceaccount | default "workflows" }}'
    cmds:
      - |-
        argo submit
          {{- if .n }} \
          -n {{ .n | quote }}
          {{- end }}
          {{- if eq "true" .dry_run }} \
          --dry-run
          {{- end }}
          {{- if .generate_name }} \
          --generate-name={{ .generate_name | quote }}
          {{- end }}
          {{- if .from }} \
          --from={{ .from | quote }}
          {{- end }}
          {{- if eq "true" .watch }} \
          --watch
          {{- end }}
          {{- if eq "true" .log }} \
          --log
          {{- end }}
          {{- if .serviceaccount }} \
          --serviceaccount={{ .serviceaccount | quote }}
          {{- end }}
          {{- if .f }} \
          {{ .f | quote }}
          {{- end }}
  test:
    cmds:
      - task: submit
        vars:
          n: argo
          from: wftmpl/hello-world
  port-forward:
    cmds:
      - kubectl -n argo port-forward deployment/argo-server 2746:2746
