---
version: '3'
includes:
  repo: temporal-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: temporal
  pg-barman-s3-secret:
    taskfile: k8s-literal-secret.yml
    vars:
      n: temporal
      s: temporal-pg-barman-s3
  barman-s3:
    taskfile: barman-s3-secret.yml
    vars:
      n: temporal
      s: temporal-pg-barman-s3
  pg:
    taskfile: helm.yml
    vars:
      namespace: temporal
      name: temporal-pg
      chart: chart-cnpg-instance
      helm_args: -f temporal-pg-values.yml
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: temporalio
      chart: temporal
      chart_ver: 1.8.0
      namespace: temporal
      name: temporal
      timeout: 15m
      helm_args: -f temporal-values.yml
  ingress:
    taskfile: tailscale-ingress.yml
    vars:
      namespace: temporal
      name: temporal-tailscale-ingress
      helm_args: -f temporal-tailscale-ingress-values.yml
tasks:
  pg-wait:
    vars:
      cluster_name: temporal-pg-chart-cnpg-instance
    cmds:
      - >-
        kubectl wait clusters.postgresql.cnpg.io/{{ .cluster_name }}
        -n temporal
        --for=condition=Ready
        --timeout=10m
  default:
    cmds:
      - task: upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: barman-s3:create
      - task: pg:upgrade
      - task: pg-wait
      - task: helm:upgrade
      - task: ingress:upgrade
  delete:
    cmds:
      - task: ingress:delete
      - task: helm:delete
      - task: pg:delete
      - task: pg-barman-s3-secret:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
