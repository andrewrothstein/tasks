---
version: '3'
includes:
  kk:
    taskfile: kubectl.yml
    vars:
      f: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml
tasks:
  default:
    deps:
      - task: apply
  apply:
    cmds:
      - task: kk:apply
  delete:
    cmds:
      - task: kk:delete
  check:
    cmds: []
