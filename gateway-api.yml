---
version: '3'
includes:
  kk:
    taskfile: kubectl.yml
    vars:
      server_side: "false"
      # check here: https://github.com/kubernetes-sigs/gateway-api/releases
      f: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.4.1/experimental-install.yaml
tasks:
  default:
    deps:
      - task: apply
  apply:
    cmds:
      - task: kk:apply
  delete:
    cmds:
      - task: kk:delete
  check:
    cmds: []
