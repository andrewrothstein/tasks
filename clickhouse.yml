---
version: '3'
vars:
  instance: pet
includes:
  operator: clickhouse-operator.yml

  instance:
    taskfile: '{{ .instance }}.yml'

tasks:
  default:
    deps:
      - upgrade
  upgrade:
    cmds:
      - task: operator:upgrade
      - task: instance:upgrade
  delete:
    cmds:
      - task: instance:delete
      - task: operator:delete
  check:
    cmds:
      - task: operator:check
      - task: instance:check
