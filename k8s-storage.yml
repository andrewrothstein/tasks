---
version: '3'
vars:
  rook: pet
  longhorn: pet
  csi_driver_nfs: csi-driver-nfs
  csi_driver_smb: csi-driver-smb
  trident: pet
  minio_operator: minio-operator
  velero: pet
  openebs: pet
  piraeus_operator: pet
  dragonfly: dragonfly
  cubefs: pet
includes:
  rook:
    taskfile: '{{ .rook }}.yml'

  longhorn:
    taskfile: '{{ .longhorn }}.yml'

  csi-driver-nfs:
    taskfile: '{{ .csi_driver_nfs }}.yml'

  csi-driver-smb:
    taskfile: '{{ .csi_driver_smb }}.yml'

  trident:
    taskfile: '{{ .trident }}.yml'

  minio-operator:
    taskfile: '{{ .minio_operator }}.yml'

  velero:
    taskfile: '{{ .velero }}.yml'

  openebs:
    taskfile: '{{ .openebs }}.yml'

  piraeus-operator:
    taskfile: '{{ .piraeus_operator }}.yml'

  dragonfly:
    taskfile: '{{ .dragonfly }}.yml'

  cubefs:
    taskfile: '{{ .cubefs }}.yml'

tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: rook:upgrade
      - task: longhorn:upgrade
      - task: csi-driver-nfs:upgrade
      - task: csi-driver-smb:upgrade
      - task: trident:upgrade
      - task: minio-operator:upgrade
      - task: velero:upgrade
      - task: openebs:upgrade
      - task: piraeus-operator:apply
      - task: dragonfly:upgrade
      - task: cubefs:upgrade
  delete:
    cmds:
      - task: cubefs:delete
      - task: dragonfly:delete
      - task: piraeus-operator:delete
      - task: openebs:delete
      - task: velero:delete
      - task: minio-operator:delete
      - task: trident:delete
      - task: csi-driver-smb:delete
      - task: csi-driver-nfs:delete
      - task: longhorn:delete
      - task: rook:delete
  check:
    cmds:
      - task: rook:check
      - task: longhorn:check
      - task: csi-driver-nfs:check
      - task: csi-driver-smb:check
      - task: trident:check
      - task: minio-operator:check
      - task: velero:check
      - task: openebs:check
      - task: piraeus-operator:check
      - task: dragonfly:check
      - task: cubefs:check
