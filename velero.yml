---
version: '3'
includes:
  kk:
    taskfile: kubectl.yml
    vars:
      n: velero
  minio-tenant:
    taskfile: minio-tenant.yml
    vars:
      n: velero
      s: velero-minio-root
      accessKey: "${VELERO_MINIO_ACCESS_KEY}"
      secretKey: "${VELERO_MINIO_SECRET_KEY}"
      namespace: velero
      name: velero-minio
      helm_args: -f velero-minio-values.yml
  # different form from the velero-minio-root secret
  velero-minio-credentials:
    taskfile: k8s-literal-secret.yml
    vars:
      n: velero
      s: velero-minio-credentials
  repo: velero-repo.yml
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: vmware-tanzu
      chart: velero
      chart_ver: 7.2.2
      namespace: velero
      name: velero
      helm_args: -f velero-values.yml
tasks:
  default:
    deps:
      - upgrade
  create-velero-minio-credentials:
    vars:
      credentials_file: '{{ .credentials_file | default ".velero-minio-credentials" }}'
    cmds:
      - |
        envsubst > {{ .credentials_file | quote }} <<HERE
        [default]
        aws_access_key_id=${VELERO_MINIO_ACCESS_KEY}
        aws_secret_access_key=${VELERO_MINIO_SECRET_KEY}
        HERE
      - task: velero-minio-credentials:create
        vars:
          args: >-
            --from-literal=cloud="$(cat {{ .credentials_file }})"
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: minio-tenant:upgrade
      - task: create-velero-minio-credentials
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: minio-tenant:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: minio-tenant:check
      - task: helm:check
