---
version: '3'
includes:
  kk:
    taskfile: kubectl.yml
    vars:
      n: velero
  minio-root-secret:
    taskfile: k8s-literal-secret.yml
    vars:
      n: velero
      s: minio-root
  minio-repo: minio-repo.yml
  minio-tenant:
    taskfile: helm.yml
    vars:
      chart_repo_name: minio
      chart: tenant
      chart_ver: 6.0.4
      namespace: velero
      name: velero-minio
      helm_args: -f velero-minio-values.yml
  velero-repo: velero-repo.yml
  velero-helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: vmware-tanzu
      chart: velero
      chart_ver: 7.2.2
      namespace: velero
      name: velero
      helm_args: -f velero-values.yml
tasks:
  default:
    deps:
      - upgrade
  import-minio-root-secret:
    cmds:
      - task: minio-root-secret:create
        vars:
          args: >-
            --from-literal "accessKey=${AWS_ACCESS_KEY}"
            --from-literal "secretKey=${AWS_SECRET_KEY}"
  minio-tenant-upgrade:
    cmds:
      - task: minio-tenant:upgrade
  upgrade:
    deps:
      - task: minio-repo
      - task: velero-repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: minio-tenant:upgrade
      - task: velero-helm:upgrade
  velero-delete:
    cmds:
      - task: velero-helm:delete
  delete:
    cmds:
      - task: velero-helm:delete
      - task: minio-tenant:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: minio-repo
      - task: velero-repo
    cmds:
      - task: minio-tenant:check
      - task: velero-helm:check
