---
version: '3'
includes:
  repo: coredns-repo.yml
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: coredns
      chart: coredns
      chart_ver: 1.39.0
      namespace: coredns
      create_namespace: 'true'
      name: coredns
      helm_args: -f coredns-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
