---
version: '3'
#vars:
#  dashvees: '-vvvvv'
includes:
  gh: gh.yml
tasks:
  test-secrets:
    vars:
      token: '{{ .token | default "$ANSIBLE_GALAXY_TOKEN" }}'
    cmds:
      - test {{ .token }}
  role-init:
    vars:
      roles_dir: '{{ .roles_dir | default "${HOME}/git/github.com/andrewrothstein" }}'
      name: '{{ .name }}'
      token: '{{ .token }}'
    deps:
      - task: test-secrets
        vars:
          token: '{{ .token }}'
    cmds:
      - |
        cd {{ .roles_dir | default .USER_WORKING_DIR | quote }};
        ansible-galaxy role init {{ .name | quote }}
  role-import:
    vars:
      org: '{{ .org | default "andrewrothstein" }}'
      name: '{{ .name }}'
      branch: '{{ .branch }}'
      token: '{{ .token | default "${ANSIBLE_GALAXY_TOKEN}" }}'
      infix: '{{ .infix | default "-" }}'
    deps:
      - task: test-secrets
        vars:
          token: '{{ .token }}'
    cmds:
      - |-
        {{ if .branch -}}
        ansible-galaxy \
          role \
            import
              {{- if .dashvees }} \
              {{ .dashvees | quote -}}
              {{- end -}}
              {{- if .branch }} \
              --branch {{ .branch | quote -}}
              {{- end -}}
              {{- if .token }} \
              --token {{ .token | quote -}}
              {{- end -}}
              {{- if .name }} \
              --role-name {{ .name | quote -}}
              {{- end }} \
              {{ .org | quote }} \
              "ansible{{ .infix }}{{ .name }}"
        {{- else -}}
        echo "please specify a tag to import with branch=1.2.3"
        {{- end }}
  role-delete:
    vars:
      token: '{{ .token | default "${ANSIBLE_GALAXY_TOKEN}" }}'
      org: '{{ .org | default "andrewrothstein" }}'
      name: '{{ .name }}'
    deps:
      - task: test-secrets
        vars:
          token: '{{ .token }}'
    cmds:
      - |-
        ansible-galaxy \
          role \
            delete
              {{- if .dashvees }} \
              {{ .dashvees -}}
              {{- end -}}
              {{- if .token }} \
              --token {{ .token | quote -}}
              {{- end }} \
              {{ .org | quote }} \
              "ansible-{{ .name }}"
  install:
    vars:
      requirements_yml: '{{ .requirements_yml }}'
      requirements_dir: '{{ .requirements_dir | default .USER_WORKING_DIR }}'
      requirements: '{{ .requirements | default "requirements.yml" }}'
      fq_requirements: '{{ .requirements_dir }}/{{ .requirements }}'
      force: '{{ .force | default "false" }}'
    cmds:
      - |
        export FQ_REQUIREMENTS=""
        {{- if .requirements_yml }}
        FQ_REQUIREMENTS="$(mktemp --suffix=.yaml)"
        cat >"${FQ_REQUIREMENTS}" <<HERE
        {{ .requirements_yml }}
        HERE
        {{- else }}
        FQ_REQUIREMENTS={{ .fq_requirements | quote }}
        {{- end }}
        if [ -e "${FQ_REQUIREMENTS}" ];
        then
          ansible-galaxy \
            install \
            {{ if eq "true" .force }}-f{{ end }} \
            -r "${FQ_REQUIREMENTS}"
        else
          echo "${FQ_REQUIREMENTS} not found, skipping..."
        fi
