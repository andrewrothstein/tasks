---
version: '3'
vars:
  fleet_ver: 0.11.1
includes:
  repo: fleet-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: cattle-fleet-system
      labels: 'istio.io/dataplane-mode=ambient'
  fleet-crd:
    taskfile: helm.yml
    vars:
      namespace: cattle-fleet-system
      name: fleet-crd
      chart_repo_name: fleet
      chart_ver: '{{ .fleet_ver }}'
      chart: fleet-crd
      helm_args: -f fleet-crd-values.yml
  fleet:
    taskfile: helm.yml
    vars:
      namespace: cattle-fleet-system
      name: fleet
      chart_repo_name: fleet
      chart_ver: '{{ .fleet_ver }}'
      chart: fleet
      helm_args: -f fleet-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
       - task: repo
    cmds:
      - task: kk:ns-create
      - task: fleet-crd:upgrade
      - task: fleet:upgrade
  delete:
    cmds:
      - task: fleet:delete
      - task: fleet-crd:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: fleet-crd:check
      - task: fleet:check
