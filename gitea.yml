---
version: '3'
includes:
  repo: gitea-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: gitea
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: gitea-charts
      chart: gitea
      chart_ver: 12.2.0
      namespace: gitea
      name: gitea
      helm_args: -f gitea-values.yml
  pg:
    taskfile: helm.yml
    vars:
      namespace: gitea
      name: gitea-pg
      chart: chart-cnpg-instance
      helm_args: >-
        --set instances=1
        --set size=10Gi
  ingress:
    taskfile: helm.yml
    vars:
      chart: chart-tailscale-ingress
      namespace: gitea
      name: gitea
      helm_args: -f gitea-tailscale-ingress-values.yml
  pg-secret:
    taskfile: k8s-literal-secret.yml
    vars:
      n: gitea
      s: gitea-pg-chart-cnpg-instance-app
      f: password
tasks:
  pg-secret:
    cmds:
      - task: pg-secret:get
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: pg:upgrade
      - task: helm:upgrade
      - task: ingress:upgrade
  delete:
    cmds:
      - task: ingress:delete
      - task: helm:delete
      - task: pg:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
