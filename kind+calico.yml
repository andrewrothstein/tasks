---
version: '3'
includes:
  kind: kind+registry.yml
  calico: calico.yml
tasks:
  up:
    cmds:
      - task: kind:up
        vars:
          disableDefaultCNI: true
      - task: calico:upgrade
  delete:
    cmds:
      - task: calico:delete
      - task: kind:delete
  check:
    cmds:
      - task: kind:check
      - task: calico:check
