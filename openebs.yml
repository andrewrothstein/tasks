---
version: '3'
includes:
  repo: openebs-repo.yml
  helm:
    taskfile: helm.yml
    vars:
      namespace: openebs
      create_namespace: true
      name: openebs
      chart_repo_name: openebs
      chart: openebs
      chart_ver: 3.10.0
      helm_args: -f openebs-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
