---
version: '3'
includes:
  repo: ngrok.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: ngrok-operator
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    internal: true
    vars:
      chart_repo_name: ngrok
      chart: ngrok-operator
      namespace: ngrok-operator
      name: ngrok-operator
      chart_ver: 0.21.0
      helm_args: >-
        --set credentials.apiKey="${NGROK_API_KEY}"
        --set credentials.authtoken="${NGROK_AUTHTOKEN}"
        --set gateway.enabled=true
#        --set bindings.enabled=true
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
