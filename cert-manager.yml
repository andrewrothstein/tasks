---
version: '3'
includes:
  repo: jetstack.yml
  kk:
    taskfile: kubectl.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: cert-manager
      labels: 'istio.io/dataplane-mode=ambient'
      k: cert-manager
  ca-secret:
    taskfile: k8s-literal-secret.yml
    vars:
      n: cert-manager
      s: ca-key-pair
      args: >-
        --from-literal=tls.crt="${CA_CERT}"
        --from-literal=tls.key="${CA_KEY}"
  cm:
    taskfile: helm.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: cert-manager
      name: cert-manager
      chart_repo_name: jetstack
      chart_ver: v1.20.2
      chart: cert-manager
      helm_args: -f cert-manager-values.yml
      force_conflicts: 'true'
  approver_policy:
    taskfile: helm.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: cert-manager
      name: cert-manager-approver-policy
      chart_repo_name: jetstack
      chart_ver: v0.25.1
      chart: cert-manager-approver-policy
      helm_args: -f cert-manager-approver-policy-values.yml
  csi_driver:
    taskfile: helm.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: cert-manager
      name: cert-manager-csi-driver
      chart_repo_name: jetstack
      chart_ver: v0.14.0
      chart: cert-manager-csi-driver
  trust_manager:
    taskfile: helm.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: cert-manager
      name: trust-manager
      chart_repo_name: jetstack
      chart_ver: v0.22.1
      chart: trust-manager
      helm_args: -f trust-manager-values.yml
tasks:
  default:
    deps:
      - upgrade
  check:
    deps:
      - task: repo
    cmds:
      - task: cm:check
      - task: approver_policy:check
      - task: csi_driver:check
      - task: trust_manager:check
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: ca-secret:create
      - task: cm:upgrade
      - task: approver_policy:upgrade
      - task: csi_driver:upgrade
      - task: trust_manager:upgrade
      - task: kk:kapply
  delete:
    cmds:
      - task: kk:kdelete
      - task: trust_manager:delete
      - task: csi_driver:delete
      - task: approver_policy:delete
      - task: cm:delete
      - task: ca-secret:delete
      - task: kk:ns-delete
