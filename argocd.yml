---
version: '3'
includes:
  argo-release:
    taskfile: argo-release.yml
    internal: true
    vars:
      chart: argo-cd
      chart_ver: 9.4.2
      name: argo-cd
      namespace: argocd
      labels: 'istio.io/dataplane-mode=ambient'
  ingress:
    taskfile: tailscale-ingress.yml
    vars:
      namespace: argocd
      name: tailscale-ingress
      helm_args: -f argocd-tailscale-ingress-values.yml
tasks:
  default:
    deps:
      - upgrade
  test-secret:
    vars:
      adminSecret: '{{ .adminSecret | default "${ARGOCD_ADMIN_PASSWORD}" }}'
    cmds:
      - test {{ .adminSecret | quote }}
  upgrade:
    vars:
      adminSecret: '{{ .adminSecret | default "${ARGOCD_ADMIN_PASSWORD}" }}'
    cmds:
      - task: test-secret
        vars:
          adminSecret: '{{ .adminSecret }}'
      - task: argo-release:upgrade
        vars:
          helm_args: |-
            -f argocd-values.yml \
              --set configs.secret.argocdServerAdminPassword=$(htpasswd -nbBC 10 "" {{ .adminSecret | quote }} | tr -d ':\n' | sed 's/$2y/$2a/')
      - task: ingress:upgrade
  delete:
    cmds:
      - task: ingress:delete
      - task: argo-release:delete
  check:
    deps:
      - task: argo-release:check
  login:
    vars:
      server: '{{ .server }}'
      grpc_web: '{{ .grpc_web | default "true" }}'
      username: '{{ .username | default "admin" }}'
      password: '{{ .password | default "${ARGOCD_ADMIN_PASSWORD}" }}'
    cmds:
      - |-
        argocd login \
          {{ .server | quote }}
          {{- if eq "true" .grpc_web }} \
          --grpc-web
          {{- end }}
          {{- if .username }} \
          --username {{ .username | quote }}
          {{- end }}
          {{- if .password }} \
          --password {{ .password | quote }}
          {{- end }}
