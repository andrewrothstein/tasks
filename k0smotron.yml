---
version: '3'
includes:
  kk:
    taskfile: kubectl.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      f: https://docs.k0smotron.io/stable/install.yaml
tasks:
  default:
    deps:
      - task: apply
  apply:
    cmds:
      - task: kk:apply
        vars:
          server_side: 'true'
  delete:
    cmds:
      - task: kk:delete
