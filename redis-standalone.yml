---
version: '3'
includes:
  kk:
    taskfile: kubectl.yml
    vars:
      n: redis-standalone
      labels: 'istio.io/dataplane-mode=ambient'
      k: redis-standalone
tasks:
  default:
    cmds:
      - task: apply
  apply:
    cmds:
      - task: kk:ns-create
      - task: kk:kapply
  delete:
    cmds:
      - task: kk:kdelete
      - task: kk:ns-delete
  check:
    cmds: []
