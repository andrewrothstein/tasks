---
version: '3'
includes:
  kk:
    internal: true
    taskfile: kubectl.yml
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      n: linstor-clusters
      k: linstor-cluster
tasks:
  default:
    cmds:
      - task: apply
  apply:
    cmds:
      - task: kk:ns-create
      - task: kk:kapply
  delete:
    cmds:
      - task: kk:kdelete
      - task: kk:ns-delete
  check:
    cmds: []
