---
version: '3'
includes:
  repo: deep-bi-repo.yml
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: deep-bi
      chart: druid-operator
      chart_ver: 0.4.2
      create_namespace: 'true'
      namespace: druid-operator
      name: druid-operator
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
