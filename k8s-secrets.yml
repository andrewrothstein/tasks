---
version: '3'
includes:

  vault: vault.yml
#  vault: pet.yml

  cert-manager: cert-manager.yml
#  cert-manager: pet.yml

  conjur-oss: conjur-oss.yml
#  conjur-oss: pet.yml

tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: conjur-oss:upgrade
      - task: vault:upgrade
      - task: cert-manager:upgrade
  delete:
    cmds:
      - task: cert-manager:delete
      - task: vault:delete
      - task: conjur-oss:delete
  check:
    cmds:
      - task: conjur-oss:check
      - task: vault:check
      - task: cert-manager:check
