---
version: '3'
vars:
  external_secrets: pet
  sealed_secrets: pet
  openbao: openbao
  vault: vault
  cert_manager: cert-manager
  conjur_oss: pet
includes:
  external-secrets:
    taskfile: '{{ .external_secrets }}.yml'

  sealed-secrets:
    taskfile: '{{ .sealed_secrets }}.yml'

  openbao:
    taskfile: '{{ .openbao }}.yml'

  vault:
    taskfile: '{{ .vault }}.yml'

  cert-manager:
    taskfile: '{{ .cert_manager }}.yml'

  conjur-oss:
    taskfile: '{{ .conjur_oss }}.yml'

tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: external-secrets:upgrade
      - task: sealed-secrets:upgrade
      - task: openbao:upgrade
      - task: conjur-oss:upgrade
      - task: vault:upgrade
      - task: cert-manager:upgrade
  delete:
    cmds:
      - task: cert-manager:delete
      - task: vault:delete
      - task: conjur-oss:delete
      - task: openbao:delete
      - task: sealed-secrets:delete
      - task: external-secrets:delete
  check:
    cmds:
      - task: external-secrets:check
      - task: sealed-secrets:check
      - task: openbao:check
      - task: conjur-oss:check
      - task: vault:check
      - task: cert-manager:check
