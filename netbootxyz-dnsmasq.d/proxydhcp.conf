# Proxy DHCP - works alongside existing DHCP server
port=0
dhcp-range=192.168.1.0,proxy
log-dhcp

# TFTP - only for initial iPXE binary
enable-tftp
tftp-root=/config/menus

# Detect iPXE clients (they set user-class = iPXE)
dhcp-match=set:ipxe,175

# Non-iPXE clients: serve plain iPXE binary (no embedded scripts)
dhcp-boot=tag:!ipxe,ipxe-plain.kpxe
pxe-service=tag:!ipxe,x86PC,"iPXE",ipxe-plain.kpxe

# iPXE clients: chain to HTTP script
dhcp-boot=tag:ipxe,http://192.168.1.60/ipxe/harvester-1.ipxe

