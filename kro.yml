---
version: '3'
vars:
  KRO_VERSION: 0.7.1
includes:
  gh:
    internal: true
    taskfile: gh.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: kro
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      namespace: kro
      name: kro
      chart_repo_name: "oci://registry.k8s.io/kro/charts"
      chart: kro
      chart_ver: '{{ .KRO_VERSION }}'
tasks:
  default:
    cmds:
      - task: upgrade
  check:
    cmds:
      - task: gh:check
        vars:
          org: kro-run
          repo: kro
          current_ver: '{{ .KRO_VERSION }}'
  upgrade:
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
