---
version: '3'
vars:
  version: 0.2.3
  org: kro-run
  repo: kro
includes:
  gh:
    internal: true
    taskfile: gh.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: kro
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      namespace: kro
      name: kro
      chart_repo_name: "oci://ghcr.io/{{ .org }}/{{ .repo }}"
      chart: kro
      chart_ver: '{{ .version }}'
tasks:
  default:
    cmds:
      - task: upgrade
  check:
    cmds:
      - task: gh:check
        vars:
          org: kro-run
          repo: kro
          current_ver: '{{ .version }}'
  upgrade:
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
