---
version: '3'
includes:
  repo: gloo-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: gloo-system
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    internal: true
    vars:
      chart_repo_name: gloo
      chart: gloo
      chart_ver: 1.20.3
      namespace: gloo-system
      name: gloo-gateway
      helm_args: -f gloo-gateway-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
