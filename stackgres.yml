---
version: '3'
includes:
  repo: stackgres-repo.yml
  helm:
    taskfile: helm.yml
    internal: true
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      namespace: stackgres
      create_namespace: 'true'
      install: 'true'
      chart_repo_name: stackgres-charts
      chart: stackgres-operator
      name: stackgres-operator
      chart_ver: 1.18.4
#      helm_args: -f stackgres-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
