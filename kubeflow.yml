---
version: '3'
includes:
  repo: kubeflow-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: kubeflow
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      namespace: kubeflow
      name: kubeflow
      chart_repo_name: kubeflow
      chart: kubeflow
      chart_ver: 0.4.0
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
