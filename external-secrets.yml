---
version: '3'
includes:
  repo: external-secrets-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: external-secrets
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: external-secrets
      chart: external-secrets
      chart_ver: 0.19.2
      create_namespace: 'true'
      namespace: external-secrets
      name: external-secrets
#      helm_args: -f external-secrets-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
