---
version: '3'
includes:
  operator:
    taskfile: kubectl.yml
    internal: true
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      k: knative-operator
  crs:
    taskfile: kubectl.yml
    internal: true
    vars:
      kubeconfig: '{{ .kubeconfig | default (env "KUBECONFIG") }}'
      kube_context: '{{ .kube_context | default (env "KUBE_CONTEXT") }}'
      k: knative
tasks:
  default:
    deps:
      - apply
  apply:
    cmds:
      - task: operator:kapply
      - task: crs:kapply
  delete:
    cmds:
      - task: crs:kdelete
      - task: operator:kdelete
