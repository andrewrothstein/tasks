---
version: '3'
includes:
  operator:
    taskfile: kubectl.yml
    internal: true
    vars:
      k: knative-operator
  crs:
    taskfile: kubectl.yml
    internal: true
    vars:
      k: knative
tasks:
  default:
    deps:
      - apply
  apply:
    cmds:
      - task: operator:kapply
      - task: crs:kapply
  delete:
    cmds:
      - task: crs:kdelete
      - task: operator:kdelete
