---
version: '3'
includes:
  repo: cockroachdb-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: cockroachdb
#      labels: 'istio.io/dataplane-mode=ambient'
      f: cockroachdb-issuer.yml
  helm:
    taskfile: helm.yml
    internal: true
    vars:
      namespace: cockroachdb
      name: my-cockroachdb
      chart_repo_name: cockroachdb
      chart: cockroachdb
      chart_ver: 19.0.6
      helm_args: --values cockroachdb-values.yml
tasks:
  default:
    cmds:
      - task: upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:apply
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
