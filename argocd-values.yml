---
global:
  networkPolicy:
    # chart 10.x defaults this to true; the policies block kubelet probes to the
    # repo-server and application-controller when the namespace is in ambient mode
    create: false

redis-ha:
  enabled: false

controller:
  replicas: 1

server:
  replicas: 1

repoServer:
  replicas: 1

applicationSet:
  replicas: 1

configs:
  params:
    server.insecure: true
  cm:
    # report child Application health so that sync waves in an app-of-apps
    # (chart-workflow-engines-apps) wait for one app before starting the next
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
