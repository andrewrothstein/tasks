---
global:
  networkPolicy:
    # chart 10.x defaults this to true; the policies block kubelet probes to the
    # repo-server and application-controller when the namespace is in ambient mode
    create: false

redis-ha:
  enabled: false

controller:
  replicas: 1

server:
  replicas: 1

repoServer:
  replicas: 1

applicationSet:
  replicas: 1

configs:
  params:
    server.insecure: true
