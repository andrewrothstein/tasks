---
redis-ha:
  enabled: false

controller:
  replicas: 1

server:
  replicas: 1

repoServer:
  replicas: 1

applicationSet:
  replicas: 1

global:
  domain: argocd.elephant-frog.ts.net

configs:
  params:
    server.insecure: true

server:
  ingress:
    enabled: true
    ingressClassName: tailscale
    extraTls:
      - hosts:
        - argocd.elephant-frog.ts.net
