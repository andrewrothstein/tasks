---
version: '3'
includes:
  repo: startechnica.yml
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: startechnica
      chart: mayastor
      chart_ver: 0.2.0
      create_namespace: 'true'
      namespace: mayastor
      name: mayastor
      helm_args: -f mayastor-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
