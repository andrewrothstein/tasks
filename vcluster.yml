---
version: '3'
includes:
  repo: vcluster-repo.yml
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: loft-sh
      chart: vcluster
      chart_ver: 0.21.2
tasks:
  default:
    cmds:
      - task: repo
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
  upgrade:
    vars:
      vcluster_namespace: '{{ .vcluster_namespace }}'
      vcluster_name: '{{ .vcluster_name }}'
    deps:
      - task: repo
    cmds:
      - task: helm:upgrade
        vars:
          namespace: '{{ .vcluster_namespace }}'
          name: '{{ .vcluster_name }}'
  delete:
    vars:
      vcluster_namespace: '{{ .vcluster_namespace }}'
      vcluster_name: '{{ .vcluster_name }}'
    cmds:
      - task: helm:delete
        vars:
          namespace: '{{ .vcluster_namespace }}'
          name: '{{ .vcluster_name }}'
