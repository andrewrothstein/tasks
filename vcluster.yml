---
version: '3'
includes:
  repo: vcluster-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: loft-sh
      chart: vcluster
      chart_ver: 0.22.0
tasks:
  default:
    cmds:
      - task: repo
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
  upgrade:
    vars:
      vcluster_namespace: 'vcluster-{{ .vcluster_name }}'
      vcluster_name: '{{ .vcluster_name }}'
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
        vars:
          n: '{{ .vcluster_namespace }}'
      - task: kk:ns-label
        vars:
          n: '{{ .vcluster_namespace }}'
      - task: helm:upgrade
        vars:
          namespace: '{{ .vcluster_namespace }}'
          name: '{{ .vcluster_name }}'
  delete:
    vars:
      vcluster_namespace: 'vcluster-{{ .vcluster_name }}'
      vcluster_name: '{{ .vcluster_name }}'
    cmds:
      - task: helm:delete
        vars:
          namespace: '{{ .vcluster_namespace }}'
          name: '{{ .vcluster_name }}'
      - task: kk:ns-delete
        vars:
          n: '{{ .vcluster_namespace }}'
