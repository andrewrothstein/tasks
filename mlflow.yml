---
version: '3'
includes:
  repo: community-charts-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: mlflow
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    vars:
      chart_repo_name: community-charts
      chart: mlflow
      chart_ver: 0.16.4
      namespace: mlflow
      name: mlflow
#      helm_args: -f mlflow-values.yml
  ingress:
    taskfile: tailscale-ingress.yml
    vars:
      namespace: mlflow
      name: tailscale-ingress
      helm_args: -f mlflow-ingress-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: helm:upgrade
      - task: ingress:upgrade
  delete:
    cmds:
      - task: ingress:delete
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
