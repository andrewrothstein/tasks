---
version: '3'
includes:
  kk:
    taskfile: kubectl.yml
    vars:
      n: bitnami-keycloak
  pg-secret:
    taskfile: k8s-literal-secret.yml
    vars:
      n: bitnami-keycloak
      s: keycloak-pg-user
  pg:
    taskfile: helm.yml
    vars:
      namespace: bitnami-keycloak
      name: keycloak-pg
      chart: chart-cnpg-instance
      helm_args: >-
        --set instances=1
        --set storage.size=10Gi
        --set bootstrap.initdb.database=keycloak
        --set bootstrap.initdb.owner=keycloak
        --set bootstrap.initdb.secret.name=keycloak-pg-user
  bitnami-chart:
    taskfile: bitnami-chart.yml
    vars:
      chart: keycloak
      chart_ver: 25.2.0
      name: bitnami-keycloak
      namespace: bitnami-keycloak
  ingress:
    taskfile: tailscale-ingress.yml
    vars:
      namespace: bitnami-keycloak
      name: tailscale-ingress
      helm_args: -f bitnami-keycloak-tailscale-ingress-values.yml
tasks:
  default:
    deps:
      - task: upgrade
  pg-wait:
    vars:
      cluster_name: keycloak-pg-chart-cnpg-instance
    cmds:
      - >-
        kubectl wait clusters.postgresql.cnpg.io/{{ .cluster_name }}
        -n bitnami-keycloak
        --for=condition=Ready
        --timeout=10m
  test-secrets:
    vars:
      admin_password: '{{ .admin_password | default "${KEYCLOAK_ADMIN_PASSWORD}" }}'
      pg_password: '{{ .pg_password | default "${KEYCLOAK_POSTGRESQL_PASSWORD}" }}'
    cmds:
      - test {{ .admin_password | quote }}
      - test {{ .pg_password | quote }}
  upgrade:
    vars:
      admin_user: '{{ .admin_user | default "${KEYCLOAK_ADMIN_USER:-admin}" }}'
      admin_password: '{{ .admin_password | default "${KEYCLOAK_ADMIN_PASSWORD}" }}'
      pg_username: '{{ .pg_username | default "keycloak" }}'
      pg_password: '{{ .pg_password | default "${KEYCLOAK_POSTGRESQL_PASSWORD}" }}'
    cmds:
      - task: kk:ns-create
      - task: test-secrets
        vars:
          admin_password: '{{ .admin_password }}'
          pg_password: '{{ .pg_password }}'
      - task: pg-secret:create
        vars:
          args: >-
            --from-literal=username={{ .pg_username }}
            --from-literal=password={{ .pg_password }}
      - task: pg:upgrade
      - task: pg-wait
      - task: bitnami-chart:upgrade
        vars:
          helm_args: |
            -f bitnami-keycloak-values.yml \
              --set-string auth.adminUser={{ .admin_user | quote }} \
              --set-string auth.adminPassword={{ .admin_password | quote }}
      - task: ingress:upgrade
  delete:
    cmds:
      - task: ingress:delete
      - task: bitnami-chart:delete
      - task: pg:delete
      - task: pg-secret:delete
      - task: kk:ns-delete
  check:
    cmds:
      - task: bitnami-chart:check
