---
version: '3'
includes:
  kk:
    taskfile: kubectl.yml
    vars:
      n: bitnami-keycloak
#      labels: 'istio.io/dataplane-mode=ambient'
  bitnami-chart:
    taskfile: bitnami-chart.yml
    vars:
      chart: keycloak
      chart_ver: 24.2.3
      name: bitnami-keycloak
      namespace: bitnami-keycloak
tasks:
  default:
    deps:
      - task: upgrade
  test-secrets:
    vars:
      admin_password: '{{ .admin_password | default "${KEYCLOAK_ADMIN_PASSWORD}" }}'
      pg_password: '{{ .pg_password | default "${KEYCLOAK_POSTGRESQL_PASSWORD}" }}'
    cmds:
      - test {{ .admin_password | quote }}
      - test {{ .pg_password | quote }}
  upgrade:
    vars:
      admin_user: '{{ .admin_user | default "${KEYCLOAK_ADMIN_USER:-admin}" }}'
      admin_password: '{{ .admin_password | default "${KEYCLOAK_ADMIN_PASSWORD}" }}'
      pg_password: '{{ .pg_password | default "${KEYCLOAK_POSTGRESQL_PASSWORD}" }}'
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: test-secrets
      - task: bitnami-chart:upgrade
        vars:
          helm_args: |
            -f bitnami-keycloak-values.yml \
              --set-string auth.adminUser={{ .admin_user | quote }} \
              --set-string auth.adminPassword={{ .admin_password | quote }} \
              --set-string postgresql.auth.password={{ .pg_password | quote }}
  delete:
    cmds:
      - task: bitnami-chart:delete
      - task: kk:ns-delete
  check:
    cmds:
      - task: bitnami-chart:check
