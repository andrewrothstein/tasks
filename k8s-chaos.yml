---
version: '3'
vars:
  chaos_mesh: pet
  litmuschaos: pet
includes:
  chaos-mesh:
    taskfile: '{{ .chaos_mesh }}.yml'

  litmuschaos:
    taskfile: '{{ .litmuschaos }}.yml'

tasks:
  default:
    deps:
      - up
  up:
    cmds:
      - task: chaos-mesh:upgrade
      - task: litmuschaos:upgrade
  delete:
    cmds:
      - task: litmuschaos:delete
      - task: chaos-mesh:delete
  check:
    cmds:
      - task: chaos-mesh:check
      - task: litmuschaos:check
