---
version: '3'
includes:
  repo: kubeai-repo.yml
  kk:
    taskfile: kubectl.yml
    vars:
      n: kubeai
      labels: 'istio.io/dataplane-mode=ambient'
  helm:
    taskfile: helm.yml
    internal: true
    vars:
      namespace: kubeai
      name: kubeai
      chart_repo_name: kubeai
      chart: kubeai
      chart_ver: 0.19.0
      helm_args: -f kubeai-values.yml
tasks:
  default:
    deps:
      - upgrade
  upgrade:
    deps:
      - task: repo
    cmds:
      - task: kk:ns-create
      - task: kk:ns-label
      - task: helm:upgrade
  delete:
    cmds:
      - task: helm:delete
      - task: kk:ns-delete
  check:
    deps:
      - task: repo
    cmds:
      - task: helm:check
